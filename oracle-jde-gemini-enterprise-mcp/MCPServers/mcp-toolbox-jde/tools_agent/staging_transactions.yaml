# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  jde_describe_staging_table:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Lists the real columns (name, type, length, and whether the column is required) of the JD Edwards batch interface tables (Z-files) that the jde_stage_* tools write to.
      Call it first, with one :record: the stage tools take JSON rows whose keys must be column names of these tables, and the layouts differ by release and customisation. Column names carry the table's prefix (VN for F0911Z1, VL for F0411Z1, SY / SZ for the sales order, purchase order and address book tables). Required = 'Y' means the database refuses a row without that column (the EDI user, batch, transaction number and line); the EDI user is filled in with your own JDE user. The columns ending in EDSP and EDER are set by the batch processor and cannot be given. Amounts have implied decimals and dates are Julian numbers (CYYDDD, 126285 = 12 Oct 2026).
      Underlying Table: ALL_TAB_COLUMNS (the seven interface tables only, in the configured data schema).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
    - name: record
      type: string
      description: 'Batch interface table: F0911Z1, F0411Z1, F4201Z1, F4211Z1, F4301Z1,
        F4311Z1 or F0101Z2. Empty string = all of them (a long list).'
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :record AS record FROM dual
              )
              SELECT
                  atc.table_name AS record,
                  atc.column_id,
                  atc.column_name,
                  atc.data_type,
                  atc.char_length AS length,
                  atc.data_precision,
                  atc.data_scale,
                  CASE WHEN atc.nullable = 'N' THEN 'Y' ELSE 'N' END AS required
              FROM all_tab_columns atc
              CROSS JOIN params p
              WHERE atc.owner = UPPER('${JDE_DATA_SCHEMA:proddta}')
                AND atc.table_name IN ('F0911Z1', 'F0411Z1', 'F4201Z1', 'F4211Z1', 'F4301Z1', 'F4311Z1', 'F0101Z2')
                AND (p.record IS NULL OR atc.table_name = UPPER(TRIM(p.record)))
              ORDER BY atc.table_name, atc.column_id
              FETCH FIRST 400 ROWS ONLY;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  staging_transactions:
  - jde_describe_staging_table
