# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  jde_get_rfq_details:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Queries a JD Edwards request for quote (quote order, type OQ): solicitation header, delivery instructions, requested items and quantities, estimated costs, the number of suppliers invited per line and the response due date.
      Underlying Tables: F4301 (Purchase Order Header), F4311 (Purchase Order Detail), F4330 (Supplier Selection), F0006 (Business Unit Master), F0101 (Address Book).
      JDE Applications: Quote Orders (P4310, order type OQ), Quote Supplier Entry (P4330).
      Data Notes: JDE has no native scoring rubric; mandatory criteria and technical specifications are usually attached to the quote as media objects (use jde_get_media_object_attachment). Unit costs use 4 implied decimals, amounts 2.
      Security Context: Procurement business unit security (F00950); enforced only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
    - name: order_number
      type: integer
      description: Request for quote (quote order) number (F4301.PHDOCO).
    - name: order_type
      type: string
      description: Optional quote order type (F4301.PHDCTO); defaults to 'OQ'.
    - name: order_company
      type: string
      description: Optional order company (F4301.PHKCOO), e.g. '00001'.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :order_number AS order_number,
                      :order_type AS order_type,
                      :order_company AS order_company
                  FROM dual
              )
              SELECT
                  ph.phdoco AS rfq_number,
                  ph.phdcto AS order_type,
                  ph.phkcoo AS order_company,
                  TRIM(ph.phdesc) AS rfq_title,
                  TRIM(ph.phvr01) AS solicitation_reference,
                  TRIM(ph.phrmk) AS rfq_remark,
                  TRIM(TRIM(ph.phdel1) || ' ' || TRIM(ph.phdel2)) AS delivery_instructions,
                  CASE WHEN ph.phtrdj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ph.phtrdj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS issue_date,
                  CASE WHEN ph.phdrqj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ph.phdrqj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS requested_date,
                  TRIM(ph.phmcu) AS business_unit,
                  TRIM(bu.mcdl01) AS business_unit_name,
                  ph.phanby AS buyer_an8,
                  TRIM(buyer.abalph) AS buyer_name,
                  pd.pdlnid / 1000 AS line_number,
                  TRIM(pd.pdlitm) AS item_number,
                  TRIM(TRIM(pd.pddsc1) || ' ' || TRIM(pd.pddsc2)) AS item_description,
                  TRIM(pd.pdlnty) AS line_type,
                  pd.pduorg AS quantity_requested,
                  TRIM(pd.pduom) AS unit_of_measure,
                  pd.pdprrc / 10000 AS estimated_unit_cost,
                  pd.pdaexp / 100 AS estimated_extended_amount,
                  CASE WHEN pd.pddrqj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(pd.pddrqj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS line_requested_date,
                  TRIM(pd.pdomcu) AS project_business_unit,
                  NULLIF(TO_CHAR(TRIM(pd.pdobj) || '.' || TRIM(pd.pdsub)), '.') AS gl_object_subsidiary,
                  NULLIF(TO_CHAR(TRIM(pd.pdlttr) || '/' || TRIM(pd.pdnxtr)), '/') AS line_status_last_next,
                  (SELECT COUNT(*)
                     FROM ${JDE_DATA_SCHEMA:proddta}.f4330 s
                    WHERE s.p0doco = pd.pddoco AND s.p0dcto = pd.pddcto AND s.p0kcoo = pd.pdkcoo
                      AND s.p0sfxo = pd.pdsfxo AND s.p0lnid = pd.pdlnid) AS suppliers_invited,
                  (SELECT CASE WHEN MIN(s.p0rqqj) > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(MIN(s.p0rqqj) + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END
                     FROM ${JDE_DATA_SCHEMA:proddta}.f4330 s
                    WHERE s.p0doco = pd.pddoco AND s.p0dcto = pd.pddcto AND s.p0kcoo = pd.pdkcoo
                      AND s.p0sfxo = pd.pdsfxo AND s.p0lnid = pd.pdlnid) AS response_due_date
              FROM params p
              JOIN ${JDE_DATA_SCHEMA:proddta}.f4301 ph
                  ON ph.phdoco = p.order_number
                 AND ph.phdcto = NVL(UPPER(p.order_type), 'OQ')
                 AND (p.order_company IS NULL OR ph.phkcoo = LPAD(p.order_company, 5, '0'))
              JOIN ${JDE_DATA_SCHEMA:proddta}.f4311 pd
                  ON pd.pddoco = ph.phdoco
                 AND pd.pddcto = ph.phdcto
                 AND pd.pdkcoo = ph.phkcoo
                 AND pd.pdsfxo = ph.phsfxo
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0006 bu
                  ON bu.mcmcu = ph.phmcu
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0101 buyer
                  ON buyer.aban8 = ph.phanby
              ORDER BY pd.pdlnid;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  jde_get_supplier_quotes:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Retrieves supplier responses to a JD Edwards request for quote: invited suppliers per line, response timeliness, quoted unit prices by quantity break, promised dates and quote validity, with supplier DUNS and tax ID.
      Underlying Tables: F4330 (Supplier Selection), F4331 (Supplier Price Quotes), F4311 (Purchase Order Detail), F0101 (Address Book).
      JDE Applications: Quote Supplier Entry (P4330), Quote Response Entry (P4334).
      Data Notes: Rows are sorted by line and lowest quoted price. Suppliers without a price row have not responded. Proposal documents are media objects on the quote (use jde_get_media_object_attachment).
      Security Context: Commercial-in-confidence supplier data under procurement business unit security; enforced only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
    - name: order_number
      type: integer
      description: Request for quote (quote order) number (F4330.P0DOCO).
    - name: order_type
      type: string
      description: Optional quote order type; defaults to 'OQ'.
    - name: supplier_an8
      type: string
      description: Optional supplier address number to return one supplier's responses
        only.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :order_number AS order_number,
                      :order_type AS order_type,
                      :supplier_an8 AS supplier_an8
                  FROM dual
              )
              SELECT
                  sel.p0doco AS rfq_number,
                  sel.p0dcto AS order_type,
                  sel.p0kcoo AS order_company,
                  sel.p0lnid / 1000 AS line_number,
                  TRIM(pd.pdlitm) AS item_number,
                  TRIM(pd.pddsc1) AS item_description,
                  pd.pduorg AS quantity_requested,
                  sel.p0an8 AS supplier_an8,
                  TRIM(sup.abalph) AS supplier_name,
                  TRIM(sup.abduns) AS duns_number,
                  TRIM(sup.abtax) AS supplier_tax_id,
                  sel.p0qprt AS quote_printed_flag,
                  CASE WHEN sel.p0rqqj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(sel.p0rqqj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS response_due_date,
                  CASE WHEN sel.p0qrdj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(sel.p0qrdj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS response_date,
                  CASE WHEN sel.p0qrdj > sel.p0rqqj AND sel.p0rqqj > 0 THEN 'LATE' WHEN sel.p0qrdj > 0 THEN 'ON_TIME' ELSE 'NO_RESPONSE' END AS response_timeliness,
                  q.p1uorg AS quoted_quantity_break,
                  q.p1prrc / 10000 AS quoted_unit_price,
                  (q.p1prrc / 10000) * pd.pduorg AS quoted_extended_price,
                  TRIM(q.p1crcd) AS currency_code,
                  CASE WHEN q.p1pddj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(q.p1pddj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS promised_date,
                  CASE WHEN q.p1cndj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(q.p1cndj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS quote_valid_until,
                  sel.p0urel AS units_released,
                  sel.p0arel / 100 AS amount_released
              FROM params p
              JOIN ${JDE_DATA_SCHEMA:proddta}.f4330 sel
                  ON sel.p0doco = p.order_number
                 AND sel.p0dcto = NVL(UPPER(p.order_type), 'OQ')
                 AND (p.supplier_an8 IS NULL OR sel.p0an8 = TO_NUMBER(p.supplier_an8))
              JOIN ${JDE_DATA_SCHEMA:proddta}.f4311 pd
                  ON pd.pddoco = sel.p0doco
                 AND pd.pddcto = sel.p0dcto
                 AND pd.pdkcoo = sel.p0kcoo
                 AND pd.pdsfxo = sel.p0sfxo
                 AND pd.pdlnid = sel.p0lnid
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f4331 q
                  ON q.p1doco = sel.p0doco
                 AND q.p1dcto = sel.p0dcto
                 AND q.p1kcoo = sel.p0kcoo
                 AND q.p1sfxo = sel.p0sfxo
                 AND q.p1lnid = sel.p0lnid
                 AND q.p1an8 = sel.p0an8
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0101 sup
                  ON sup.aban8 = sel.p0an8
              ORDER BY sel.p0lnid, quoted_unit_price NULLS LAST, sel.p0an8;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  rfp_vendor_evaluation_scorer:
  - jde_get_rfq_details
  - jde_get_supplier_quotes
