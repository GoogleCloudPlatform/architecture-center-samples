# ==============================================================================
# Model Context Protocol (MCP) Toolbox for Databases - source.yaml
# Connection and authentication; the tools are in the other files of this folder (one per toolset).
# System: JD Edwards EnterpriseOne 9.2 (Oracle Database)
# Target: Gemini for Government Plugin (Oct 2026)
# Bind Variables: Oracle syntax (:param_name)
# Connection Details: Unified connectionString (hostname:port/servicename)
# Schemas: business data in PRODDTA, control tables in PRODCTL (production path code;
# other path codes use e.g. CRPDTA/CRPCTL or TESTDTA/TESTCTL)
# ==============================================================================
#
# Authenticated parameters for the PL/SQL security wrapper (README §2.6).
# To enable: uncomment the authServices block below, set GOOGLE_CLIENT_ID
# in jde/.env, then run: python3 scripts/sync_sql_to_yaml.py --system jde --wrap
# authServices:
#   google-auth:
#     type: google
#     clientId: ${GOOGLE_CLIENT_ID}
# PL/SQL wrapper: mcp-toolbox-jde/templates/plsql_wrapper.sql (sync_sql_to_yaml.py --wrap / --no-wrap)

authServices:
  google-auth:
    type: google
    clientId: ${GOOGLE_CLIENT_ID}
sources:
  jde-oracle-source:
    kind: oracle
    connectionString: ${DB_CONNECTION_STRING:jde.example.com:1521/JDEPROD}
    user: ${DB_USER:JDE_AI}
    password: ${DB_PASSWORD:JDE_AI}
