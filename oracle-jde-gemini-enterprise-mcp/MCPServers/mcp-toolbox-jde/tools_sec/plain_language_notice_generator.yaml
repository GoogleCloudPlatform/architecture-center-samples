# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  jde_get_customer_notice_details:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Retrieves billing determinations, overpayment and open balances, pay status, statutory remarks and dispute (deduction) records for a constituent from JD Edwards Accounts Receivable.
      Underlying Tables: F03B11 (Customer Ledger), F03B40 (A/R Deductions), F0101 (Address Book), F0006 (Business Unit Master), F0005 (UDC 00/DT, 00/PS).
      JDE Applications: Customer Ledger Inquiry (P03B2002), A/R Deduction Management.
      Data Notes: Dates converted from JDE Julian (CYYDDD); amounts converted from implied decimals assuming 2 display decimals.
      Security Context: JDE row security (F00950) by company / business unit; enforced only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: doc_number
      type: integer
      description: A/R invoice or billing document number (F03B11.RPDOC), e.g. the
        claim or determination number.
    - name: doc_type
      type: string
      description: Optional A/R document type (F03B11.RPDCT), e.g. 'RI' for invoices
        or 'RM' for credit memos.
    - name: company
      type: string
      description: Optional document company (F03B11.RPKCO), e.g. '00001' or '1'.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :doc_number AS doc_number,
                      :doc_type AS doc_type,
                      :company AS company
                  FROM dual
              )
              -- JDE storage conventions used below: dates are Julian CYYDDD numbers (0 = blank),
              -- amounts are stored without the decimal point (2 display decimals), and codes are
              -- blank-padded fixed-length strings (UDC tables are compared with TRIM).
              SELECT
                  rp.rpdoc AS doc_number,
                  rp.rpdct AS doc_type,
                  TRIM(dt.drdl01) AS doc_type_description,
                  rp.rpkco AS company,
                  rp.rpsfx AS pay_item,
                  rp.rpan8 AS customer_an8,
                  TRIM(ab.abalph) AS constituent_name,
                  CASE WHEN rp.rpdivj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(rp.rpdivj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS notice_date,
                  CASE WHEN rp.rpddj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(rp.rpddj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS due_date,
                  rp.rpag / 100 AS billed_amount,
                  rp.rpaap / 100 AS outstanding_balance,
                  TRIM(rp.rpcrcd) AS currency_code,
                  rp.rppst AS pay_status,
                  TRIM(ps.drdl01) AS pay_status_description,
                  TRIM(rp.rprmk) AS statutory_remark,
                  TRIM(rp.rpvr01) AS reference,
                  TRIM(rp.rpmcu) AS business_unit,
                  TRIM(bu.mcdl01) AS program_or_grant_name,
                  ded.rbdcid AS dispute_id,
                  TRIM(ded.rbddex) AS dispute_reason_code,
                  TRIM(ded.rbpsdd) AS dispute_status,
                  ded.rbdda / 100 AS disputed_amount,
                  ded.rbddoa / 100 AS disputed_open_amount,
                  CASE WHEN ded.rbdddo > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ded.rbdddo + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS dispute_opened_date
              FROM params p
              JOIN ${JDE_DATA_SCHEMA:proddta}.f03b11 rp
                  ON rp.rpdoc = p.doc_number
                 AND (p.doc_type IS NULL OR rp.rpdct = UPPER(p.doc_type))
                 AND (p.company IS NULL OR rp.rpkco = LPAD(p.company, 5, '0'))
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0101 ab
                  ON ab.aban8 = rp.rpan8
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0006 bu
                  ON bu.mcmcu = rp.rpmcu
              LEFT JOIN ${JDE_CTL_SCHEMA:prodctl}.f0005 dt
                  ON TRIM(dt.drsy) = '00'
                 AND TRIM(dt.drrt) = 'DT'
                 AND TRIM(dt.drky) = TRIM(rp.rpdct)
              LEFT JOIN ${JDE_CTL_SCHEMA:prodctl}.f0005 ps
                  ON TRIM(ps.drsy) = '00'
                 AND TRIM(ps.drrt) = 'PS'
                 AND TRIM(ps.drky) = TRIM(rp.rppst)
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f03b40 ded
                  ON ded.rbodoc = rp.rpdoc
                 AND ded.rbodct = rp.rpdct
                 AND ded.rbokco = rp.rpkco
                 AND ded.rbosfx = rp.rpsfx
              ORDER BY rp.rpdct, rp.rpsfx;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  jde_get_media_object_attachment:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Retrieves attached determination letters, decision notes and case documents from JD Edwards Media Objects for any parent record (A/R invoice, voucher, address book, order).
      Underlying Tables: F00165 (Media Objects Storage), F00166 (Media Object Category Codes).
      JDE Applications: Media Object attachments (paperclip) on any application.
      Data Notes: Text attachments are returned inline in content_blob. File, image and URL attachments return the file name or URL and the media object queue; their bytes live on the media object file server, not in the database.
      Security Context: Attachment visibility follows the parent record's JDE row security; enforced only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: object_name
      type: string
      description: Media object name (F00165.GDOBNM), e.g. 'GT03B11'. Use jde_list_media_object_types
        to discover valid names and key formats.
    - name: text_key
      type: string
      description: Parent record key (F00165.GDTXKY) or one or more consecutive key
        parts, e.g. a document number such as '12345'.
    - name: sequence
      type: string
      description: Optional media object sequence number (F00165.GDMOSEQN); leave
        empty to return every attachment on the record.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :object_name AS object_name,
                      :text_key AS text_key,
                      :sequence AS sequence
                  FROM dual
              )
              -- GDTXKY holds the parent record's key values separated by '|'. The key match below
              -- accepts the full key or any run of whole key parts, so '12345' matches '00001|RI|12345|001'.
              SELECT
                  TRIM(mo.gdobnm) AS object_name,
                  mo.gdtxky AS text_key,
                  mo.gdmoseqn AS sequence,
                  mo.gdgtmotype AS media_object_type,
                  CASE WHEN mo.gdgtmotype = 0 THEN 'TEXT' ELSE 'FILE_OR_LINK' END AS content_kind,
                  TRIM(mo.gdgtitnm) AS item_name,
                  TRIM(mo.gdgtfilenm) AS file_name_or_url,
                  TRIM(mo.gdqunam) AS media_object_queue,
                  TRIM(cat.gtmodoctp) AS document_type,
                  TRIM(cat.gtmodl01) AS document_description,
                  TRIM(cat.gtmostatus) AS document_status,
                  TRIM(mo.gduser) AS updated_by,
                  CASE WHEN mo.gdupmj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(mo.gdupmj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS updated_date,
                  mo.gdtxft AS content_blob
              FROM params p
              JOIN ${JDE_DATA_SCHEMA:proddta}.f00165 mo
                  ON mo.gdobnm = RPAD(UPPER(p.object_name), 10)
                 AND (mo.gdtxky = p.text_key OR '|' || mo.gdtxky || '|' LIKE '%|' || p.text_key || '|%')
                 AND (p.sequence IS NULL OR mo.gdmoseqn = TO_NUMBER(p.sequence))
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f00166 cat
                  ON cat.gtobnm = mo.gdobnm
                 AND cat.gttxky = mo.gdtxky
                 AND cat.gtmoseqn = mo.gdmoseqn
              ORDER BY mo.gdtxky, mo.gdmoseqn
              FETCH FIRST 20 ROWS ONLY;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  plain_language_notice_generator:
  - jde_get_customer_notice_details
  - jde_get_media_object_attachment
