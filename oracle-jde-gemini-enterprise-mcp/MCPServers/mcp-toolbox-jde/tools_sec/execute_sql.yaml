# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  jde_execute_sql:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Runs any single SELECT (or WITH) statement against the JD Edwards EnterpriseOne 9.2 database and returns the rows.
      The statement runs under the security context of the signed-in user (user_id), so row and
      organisation security apply as for that user. Use fully qualified table names (e.g. proddta./prodctl.).
      Only queries are supported. Prefer the specific tools when one fits, and check column names
      before writing a query. A trailing ';' is ignored.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: sql
      type: string
      description: A single SELECT (or WITH) statement to run. No trailing ';'.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              RTRIM(:sql, ';' || CHR(9) || CHR(10) || CHR(13) || ' ');

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  execute_sql:
  - jde_execute_sql
