# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  jde_get_batch_status:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Shows JD Edwards batch headers (F0011 batch control), newest first, up to 50: batch type and number, status (Pending, Approved, Posting, Posted, In Use, Error), user, batch date, number of documents and the expected amount.
      Use this tool to follow what happens to a batch of staged transactions (jde_stage_*): the batch processor (for journal entries R09110Z, for vouchers R04110Z / R04110ZA) creates the real transactions, and the batch status shows whether it finished (Approved/Posted) or failed (Error). Use jde_list_staged_transactions for the rows of a Z-file themselves.
      amount_expected_raw has JDE's implied decimals (divide by 100 for a 2-decimal currency). batch_date is the date the batch was entered.
      Underlying Tables: F0011, F0005 (UDC 98/IT batch type and 98/IC batch status).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: batch_type
      type: string
      description: Batch type code (F0011.ICICUT), e.g. 'G' general accounting, 'V'
        voucher entry, 'IB' invoices, 'O' PO/contract entries, 'N' inventory. Empty
        string = any type.
    - name: batch_number
      type: string
      description: Batch number (F0011.ICICU), a whole number. Empty string = any.
    - name: batch_user
      type: string
      description: JDE user that created the batch (F0011.ICUSER), e.g. 'MS977786'.
        Empty string = any user.
    - name: days_back
      type: string
      description: How many days back to look, by batch date (a whole number). Empty
        string = 30.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :batch_type AS batch_type,
                      :batch_number AS batch_number,
                      :batch_user AS batch_user,
                      :days_back AS days_back
                  FROM dual
              )
              SELECT
                  TO_CHAR(TRIM(b.icicut)) AS batch_type,
                  TO_CHAR(TRIM(ty.drdl01)) AS batch_type_description,
                  b.icicu AS batch_number,
                  TO_CHAR(TRIM(b.icist)) AS status_code,
                  NVL(TO_CHAR(TRIM(st.drdl01)), 'Pending') AS status,
                  TO_CHAR(TRIM(b.icuser)) AS batch_user,
                  CASE WHEN b.icdicj > 0 THEN TO_DATE(TO_CHAR(1900000 + b.icdicj), 'YYYYDDD') END AS batch_date,
                  b.icndo AS documents,
                  b.icame AS amount_expected_raw,
                  TO_CHAR(TRIM(b.icbal)) AS out_of_balance_flag
              FROM params p
              CROSS JOIN ${JDE_DATA_SCHEMA:proddta}.f0011 b
              LEFT JOIN ${JDE_CTL_SCHEMA:prodctl}.f0005 ty ON TRIM(ty.drsy) = '98' AND TRIM(ty.drrt) = 'IT' AND TRIM(ty.drky) = TRIM(b.icicut)
              LEFT JOIN ${JDE_CTL_SCHEMA:prodctl}.f0005 st ON TRIM(st.drsy) = '98' AND TRIM(st.drrt) = 'IC' AND TRIM(st.drky) = TRIM(b.icist)
              WHERE (p.batch_type IS NULL OR TRIM(b.icicut) = UPPER(TRIM(p.batch_type)))
                AND (p.batch_number IS NULL OR b.icicu = TO_NUMBER(p.batch_number))
                AND (p.batch_user IS NULL OR TRIM(b.icuser) = UPPER(TRIM(p.batch_user)))
                AND b.icdicj >= (TO_NUMBER(TO_CHAR(SYSDATE - NVL(TO_NUMBER(p.days_back), 30), 'YYYY')) - 1900) * 1000
                                + TO_NUMBER(TO_CHAR(SYSDATE - NVL(TO_NUMBER(p.days_back), 30), 'DDD'))
              ORDER BY b.icdicj DESC, b.icicu DESC
              FETCH FIRST 50 ROWS ONLY;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  jde_list_staged_transactions:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Lists rows in a JD Edwards batch interface table (Z-file), up to 100: the EDI user, EDI batch number, EDI transaction number and line, and the processing flags the batch processor sets.
      Use this tool to see what jde_stage_* put into a Z-file and whether the batch processor has taken it yet (processed = 'Y'). error_flag is set by the processor on the journal entry and voucher tables (F0911Z1, F0411Z1); a non-blank value means the processor flagged the row, so read its report or the Employee Work Center for the reason. It is not available for the sales order, purchase order and address book tables (NULL). Use jde_get_batch_status for the F0011 batch header.
      :record is required. Underlying Tables: F0911Z1, F0411Z1, F4201Z1, F4211Z1, F4301Z1, F4311Z1, F0101Z2.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: record
      type: string
      description: 'Batch interface table: F0911Z1 (journal entries), F0411Z1 (vouchers),
        F4201Z1 / F4211Z1 (sales order header / detail), F4301Z1 / F4311Z1 (purchase
        order header / detail) or F0101Z2 (address book).'
    - name: edi_user
      type: string
      description: EDI user ID of the rows (the JDE user that staged them). Empty
        string = any user.
    - name: batch_number
      type: string
      description: EDI batch number (a text, e.g. 'B1'). Empty string = any batch.
    - name: processed
      type: string
      description: '''Y'' = only rows the batch processor has processed, ''N'' = only
        rows still waiting. Empty string = both.'
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :record AS record,
                      :edi_user AS edi_user,
                      :batch_number AS batch_number,
                      :processed AS processed
                  FROM dual
              ),
              staged AS (
                  SELECT 'F0911Z1' AS record, TO_CHAR(TRIM(z.vnedus)) AS edi_user, TO_CHAR(TRIM(z.vnedbt)) AS batch_number, TO_CHAR(TRIM(z.vnedtn)) AS transaction_number,
                         z.vnedln AS line_number, TO_CHAR(TRIM(z.vnedsp)) AS processed_flag, TO_CHAR(TRIM(z.vneder)) AS error_flag
                  FROM ${JDE_DATA_SCHEMA:proddta}.f0911z1 z
                  UNION ALL
                  SELECT 'F0411Z1', TO_CHAR(TRIM(z.vledus)), TO_CHAR(TRIM(z.vledbt)), TO_CHAR(TRIM(z.vledtn)), z.vledln, TO_CHAR(TRIM(z.vledsp)), TO_CHAR(TRIM(z.vleder))
                  FROM ${JDE_DATA_SCHEMA:proddta}.f0411z1 z
                  UNION ALL
                  SELECT 'F4201Z1', TO_CHAR(TRIM(z.syedus)), TO_CHAR(TRIM(z.syedbt)), TO_CHAR(TRIM(z.syedtn)), z.syedln, TO_CHAR(TRIM(z.syedsp)), NULL
                  FROM ${JDE_DATA_SCHEMA:proddta}.f4201z1 z
                  UNION ALL
                  SELECT 'F4211Z1', TO_CHAR(TRIM(z.szedus)), TO_CHAR(TRIM(z.szedbt)), TO_CHAR(TRIM(z.szedtn)), z.szedln, TO_CHAR(TRIM(z.szedsp)), NULL
                  FROM ${JDE_DATA_SCHEMA:proddta}.f4211z1 z
                  UNION ALL
                  SELECT 'F4301Z1', TO_CHAR(TRIM(z.syedus)), TO_CHAR(TRIM(z.syedbt)), TO_CHAR(TRIM(z.syedtn)), z.syedln, TO_CHAR(TRIM(z.syedsp)), NULL
                  FROM ${JDE_DATA_SCHEMA:proddta}.f4301z1 z
                  UNION ALL
                  SELECT 'F4311Z1', TO_CHAR(TRIM(z.szedus)), TO_CHAR(TRIM(z.szedbt)), TO_CHAR(TRIM(z.szedtn)), z.szedln, TO_CHAR(TRIM(z.szedsp)), NULL
                  FROM ${JDE_DATA_SCHEMA:proddta}.f4311z1 z
                  UNION ALL
                  SELECT 'F0101Z2', TO_CHAR(TRIM(z.szedus)), TO_CHAR(TRIM(z.szedbt)), TO_CHAR(TRIM(z.szedtn)), z.szedln, TO_CHAR(TRIM(z.szedsp)), NULL
                  FROM ${JDE_DATA_SCHEMA:proddta}.f0101z2 z
              )
              SELECT
                  s.record,
                  s.edi_user,
                  s.batch_number,
                  s.transaction_number,
                  s.line_number,
                  CASE WHEN s.processed_flag = 'Y' THEN 'Y' ELSE 'N' END AS processed,
                  s.processed_flag,
                  s.error_flag
              FROM staged s
              CROSS JOIN params p
              WHERE s.record = UPPER(TRIM(p.record))
                AND (p.edi_user IS NULL OR s.edi_user = UPPER(TRIM(p.edi_user)))
                AND (p.batch_number IS NULL OR s.batch_number = TRIM(p.batch_number))
                AND (p.processed IS NULL OR (UPPER(p.processed) = 'Y' AND s.processed_flag = 'Y') OR (UPPER(p.processed) = 'N' AND NVL(s.processed_flag, 'N') <> 'Y'))
              ORDER BY s.batch_number, s.transaction_number, s.line_number
              FETCH FIRST 100 ROWS ONLY;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  batch_monitor:
  - jde_get_batch_status
  - jde_list_staged_transactions
