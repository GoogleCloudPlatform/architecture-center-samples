# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  jde_get_agency_policy_rules:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Queries agency-configured travel and expense policy rules (per diem allowances, receipt thresholds, audit sampling) and procurement approval limits (delegation of authority) from JD Edwards setups.
      Underlying Tables: F09E108 (Expense Policy Rules), F09E110 (Audit Selection Rules), F43008 (Approval Level Revisions), F0101 (Address Book).
      JDE Applications: Expense Management policy setup (system 09E), Approval Routing Revisions for Procurement.
      Data Notes: Dates converted from JDE Julian (CYYDDD); expense amounts converted from implied decimals (2 places, rates 3 places); approval limits (APALIM) are stored with no decimals.
      Security Context: Setup data, readable by all agency users.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: policy_category
      type: string
      description: 'Policy category: ''EXPENSE'' (per diem and receipt rules), ''AUDIT''
        (expense audit sampling), ''PROCUREMENT'' (approval limits) or ''ALL''.'
    - name: rule_name
      type: string
      description: Optional expense policy name or procurement approval route code
        (partial match).
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :policy_category AS policy_category,
                      :rule_name AS rule_name
                  FROM dual
              )
              SELECT * FROM (
                  -- Expense Management policy rules by expense category and location
                  SELECT
                      'EXPENSE' AS policy_category,
                      TO_CHAR(TRIM(pr.prpolicy)) AS rule_group,
                      TO_CHAR(TRIM(pr.prdl01)) AS rule_description,
                      TO_CHAR(TRIM(pr.prexptype)) AS rule_type,
                      TO_CHAR('Location ' || NVL(TRIM(pr.prlocatn), 'ANY') || ' | Report type ' || TRIM(pr.prexrpttyp)) AS rule_scope,
                      pr.prdlyallow / 100 AS threshold_amount,
                      TO_CHAR(pr.prrctrqd) AS receipt_required,
                      pr.prdomrctam / 100 AS receipt_threshold_amount,
                      pr.prrate1 / 1000 AS rate_or_percent,
                      'Audit amount ' || TO_CHAR(pr.prauditamt / 100, 'FM999999990.00')
                          || ' | Tolerance ' || TO_CHAR(pr.prtoler) || '%'
                          || ' | Hard edit ' || TO_CHAR(pr.prhedit)
                          || ' | Allowable/unallowable rule ' || TO_CHAR(pr.prgovtflag) AS rule_notes,
                      TO_CHAR(TRIM(pr.prpolcrcy)) AS currency_code,
                      CASE WHEN pr.preftj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(pr.preftj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS effective_start_date,
                      CASE WHEN pr.prexdj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(pr.prexdj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS effective_end_date
                  FROM ${JDE_DATA_SCHEMA:proddta}.f09e108 pr
                  CROSS JOIN params p
                  WHERE (p.policy_category IS NULL OR UPPER(p.policy_category) IN ('EXPENSE', 'TRAVEL', 'ALL'))
                    AND (p.rule_name IS NULL OR UPPER(pr.prpolicy) LIKE UPPER('%' || p.rule_name || '%'))

                  UNION ALL

                  -- Expense audit selection (sampling) rules
                  SELECT
                      'AUDIT' AS policy_category,
                      TO_CHAR(TRIM(au.aspolicy)) AS rule_group,
                      TO_CHAR('Audit selection rule ' || TO_CHAR(au.asrulenum)) AS rule_description,
                      'AUDIT_SAMPLING' AS rule_type,
                      TO_CHAR('Report amount ' || TO_CHAR(au.asfromrng / 100, 'FM999999990.00') || ' to ' || TO_CHAR(au.asthrurng / 100, 'FM999999990.00')) AS rule_scope,
                      au.asthrurng / 100 AS threshold_amount,
                      NULL AS receipt_required,
                      NULL AS receipt_threshold_amount,
                      au.aspercsel AS rate_or_percent,
                      'Percent of reports selected for audit' AS rule_notes,
                      NULL AS currency_code,
                      CASE WHEN au.aseftb > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(au.aseftb + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS effective_start_date,
                      NULL AS effective_end_date
                  FROM ${JDE_DATA_SCHEMA:proddta}.f09e110 au
                  CROSS JOIN params p
                  WHERE (p.policy_category IS NULL OR UPPER(p.policy_category) IN ('AUDIT', 'EXPENSE', 'ALL'))
                    AND (p.rule_name IS NULL OR UPPER(au.aspolicy) LIKE UPPER('%' || p.rule_name || '%'))

                  UNION ALL

                  -- Procurement approval routes and delegation-of-authority limits
                  SELECT
                      'PROCUREMENT' AS policy_category,
                      TO_CHAR(TRIM(ap.apartg)) AS rule_group,
                      TO_CHAR(TRIM(ap.apdl01)) AS rule_description,
                      'APPROVAL_LIMIT' AS rule_type,
                      TO_CHAR('Order type ' || ap.apdcto || ' | Approver ' || TRIM(ab.abalph) || ' (' || TO_CHAR(ap.aprper) || ')') AS rule_scope,
                      ap.apalim AS threshold_amount,
                      NULL AS receipt_required,
                      NULL AS receipt_threshold_amount,
                      NULL AS rate_or_percent,
                      'Approver type ' || TO_CHAR(ap.apaty) AS rule_notes,
                      NULL AS currency_code,
                      NULL AS effective_start_date,
                      NULL AS effective_end_date
                  FROM ${JDE_DATA_SCHEMA:proddta}.f43008 ap
                  LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0101 ab
                      ON ab.aban8 = ap.aprper
                  CROSS JOIN params p
                  WHERE (p.policy_category IS NULL OR UPPER(p.policy_category) IN ('PROCUREMENT', 'ALL'))
                    AND (p.rule_name IS NULL OR UPPER(ap.apartg) LIKE UPPER('%' || p.rule_name || '%'))
              )
              ORDER BY policy_category, rule_group, rule_type;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  jde_search_policy_documents:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Searches agency policy bulletins, administrative guidelines and SOP documents stored as JD Edwards Media Objects, with their document type, status, effective dates and review date.
      Underlying Tables: F00165 (Media Objects Storage), F00166 (Media Object Category Codes).
      Data Notes: Returns metadata only; fetch a document's content with jde_get_media_object_attachment using object_name, text_key and sequence. Pass object_name or document_type when possible: a keyword-only search scans every media object.
      Security Context: Public agency policy documents; attachment visibility follows the parent record's JDE security.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: keyword
      type: string
      description: Search keyword or policy title (matched against attachment name,
        file name and document description).
    - name: object_name
      type: string
      description: Optional media object name the agency uses for policy documents
        (F00165.GDOBNM). Use jde_list_media_object_types to discover it.
    - name: document_type
      type: string
      description: Optional media object document type (F00166.GTMODOCTP), e.g. 'POLICY'
        or 'SOP' as configured by the agency.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :keyword AS keyword,
                      :object_name AS object_name,
                      :document_type AS document_type
                  FROM dual
              )
              SELECT
                  TRIM(mo.gdobnm) AS object_name,
                  mo.gdtxky AS text_key,
                  mo.gdmoseqn AS sequence,
                  CASE WHEN mo.gdgtmotype = 0 THEN 'TEXT' ELSE 'FILE_OR_LINK' END AS content_kind,
                  TRIM(mo.gdgtitnm) AS policy_title,
                  TRIM(mo.gdgtfilenm) AS file_name_or_url,
                  TRIM(cat.gtmodoctp) AS document_type,
                  TRIM(cat.gtmodl01) AS policy_summary,
                  TRIM(cat.gtmoauthor) AS author,
                  TRIM(cat.gtmostatus) AS policy_status,
                  CASE WHEN cat.gtmoefdtfr > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(cat.gtmoefdtfr + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS effective_from,
                  CASE WHEN cat.gtmoefdtto > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(cat.gtmoefdtto + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS effective_to,
                  CASE WHEN cat.gtmorevdt > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(cat.gtmorevdt + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS next_review_date,
                  CASE WHEN mo.gdupmj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(mo.gdupmj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS updated_date
              FROM params p
              JOIN ${JDE_DATA_SCHEMA:proddta}.f00165 mo
                  ON (p.object_name IS NULL OR mo.gdobnm = RPAD(UPPER(p.object_name), 10))
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f00166 cat
                  ON cat.gtobnm = mo.gdobnm
                 AND cat.gttxky = mo.gdtxky
                 AND cat.gtmoseqn = mo.gdmoseqn
              WHERE (p.document_type IS NULL OR TRIM(cat.gtmodoctp) = UPPER(p.document_type))
                AND (p.keyword IS NULL
                  OR UPPER(mo.gdgtitnm) LIKE UPPER('%' || p.keyword || '%')
                  OR UPPER(mo.gdgtfilenm) LIKE UPPER('%' || p.keyword || '%')
                  OR UPPER(cat.gtmodl01) LIKE UPPER('%' || p.keyword || '%'))
              ORDER BY mo.gdupmj DESC
              FETCH FIRST 20 ROWS ONLY;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  policy_and_statute_assistant:
  - jde_get_agency_policy_rules
  - jde_search_policy_documents
