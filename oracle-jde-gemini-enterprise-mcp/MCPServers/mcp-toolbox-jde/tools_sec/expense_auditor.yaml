# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  jde_get_expense_reports:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Retrieves employee travel and operational expense reports from JD Edwards Expense Management: report totals and status, itemized lines (category, date, amount, business purpose, hotel, grant subledger), allowable/unallowable amounts, policy exceptions, and the policy rule in force for each line.
      Underlying Tables: F20111 (Expense Report Header), F20112 (Expense Report Detail), F09E108 (Expense Policy Rules), F0101 (Address Book).
      JDE Applications: Expense Management (system 09E).
      Data Notes: Filter by submission date for nightly audits. Receipts are media objects on the report (use jde_get_media_object_attachment). Amounts converted from implied decimals (2 places). At most 500 lines per call.
      Security Context: Expense auditor role and home business unit security (F00950); enforced only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: report_number
      type: string
      description: Expense report number (F20111.EHEXRPTNUM).
    - name: employee_an8
      type: string
      description: Address number of the employee who submitted the report (F20111.EHEMPLOYID).
    - name: start_date
      type: string
      description: Submission date window start in YYYY-MM-DD format.
    - name: end_date
      type: string
      description: Submission date window end in YYYY-MM-DD format.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :report_number AS report_number,
                      :employee_an8 AS employee_an8,
                      :start_date AS start_date,
                      :end_date AS end_date
                  FROM dual
              )
              -- The policy rule shown for each line is the one effective on the expense date for
              -- the report's policy and expense category, preferring a location-specific rule.
              SELECT
                  TRIM(eh.ehexrptnum) AS report_number,
                  eh.ehexrpttyp AS report_type,
                  eh.ehemployid AS employee_an8,
                  TRIM(emp.abalph) AS employee_name,
                  TRIM(eh.ehexrptdes) AS report_description,
                  TRIM(eh.ehbuspurp) AS report_business_purpose,
                  TRIM(eh.ehexrptsta) AS report_status,
                  CASE WHEN eh.ehdatesub > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(eh.ehdatesub + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS submission_date,
                  CASE WHEN eh.ehdateapp > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(eh.ehdateapp + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS approval_date,
                  eh.ehtotexp / 100 AS report_total,
                  eh.ehreimbtot / 100 AS reimbursement_total,
                  eh.ehgovuntot / 100 AS unallowable_total,
                  eh.ehcashadv / 100 AS cash_advance,
                  eh.ehnumexc AS exception_count,
                  TRIM(eh.ehpolicy) AS policy_name,
                  TRIM(eh.ehco) AS company,
                  TRIM(eh.ehhmcu) AS home_business_unit,
                  ed.edlin / 100 AS line_number,
                  TRIM(ed.edexptype) AS expense_category,
                  CASE WHEN ed.edexpdate > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ed.edexpdate + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS expense_date,
                  ed.edexpfamt / 100 AS expense_amount,
                  TRIM(ed.edcrcd) AS expense_currency,
                  ed.edexpdamt / 100 AS reimbursement_amount,
                  ed.edgovtamt / 100 AS allowable_amount,
                  ed.edgovtuamt / 100 AS unallowable_amount,
                  ed.edtapda / 100 AS per_diem_available,
                  TRIM(ed.edpmtmeth) AS payment_method,
                  TRIM(ed.edbuspurp) AS business_purpose,
                  TRIM(ed.edaddlcmt) AS additional_comments,
                  TRIM(ed.edhotelloc) AS hotel_location,
                  ed.ednumnites AS number_of_nights,
                  ed.edrcptlbl AS receipt_label,
                  TRIM(ed.edmcu0) AS charged_business_unit,
                  TO_CHAR(TRIM(ed.edsbl)) || CASE WHEN TRIM(ed.edsblt) IS NOT NULL THEN ' (' || TO_CHAR(TRIM(ed.edsblt)) || ')' END AS grant_subledger,
                  TRIM(ed.edexpstat) AS line_status,
                  CASE WHEN TRIM(ed.edpolicyex) IS NOT NULL THEN 'EXCEPTION: ' || TO_CHAR(TRIM(ed.edpolicyex)) ELSE 'OK' END AS policy_status,
                  pol.prdlyallow / 100 AS policy_daily_allowance,
                  pol.prrctrqd AS policy_receipt_required,
                  pol.prdomrctam / 100 AS policy_receipt_threshold,
                  pol.prauditamt / 100 AS policy_audit_amount
              FROM params p
              JOIN ${JDE_DATA_SCHEMA:proddta}.f20111 eh
                  ON (p.report_number IS NULL OR TRIM(eh.ehexrptnum) = TRIM(p.report_number))
                 AND (p.employee_an8 IS NULL OR eh.ehemployid = TO_NUMBER(p.employee_an8))
                 AND (p.start_date IS NULL OR eh.ehdatesub >= TO_NUMBER(TO_CHAR(TO_DATE(p.start_date, 'YYYY-MM-DD'), 'YYYYDDD')) - 1900000)
                 AND (p.end_date IS NULL OR eh.ehdatesub <= TO_NUMBER(TO_CHAR(TO_DATE(p.end_date, 'YYYY-MM-DD'), 'YYYYDDD')) - 1900000)
              JOIN ${JDE_DATA_SCHEMA:proddta}.f20112 ed
                  ON ed.edexrptnum = eh.ehexrptnum
                 AND ed.edexrpttyp = eh.ehexrpttyp
                 AND ed.edemployid = eh.ehemployid
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0101 emp
                  ON emp.aban8 = eh.ehemployid
              OUTER APPLY (
                  SELECT pr.prdlyallow, pr.prrctrqd, pr.prdomrctam, pr.prauditamt
                  FROM ${JDE_DATA_SCHEMA:proddta}.f09e108 pr
                  WHERE pr.prpolicy = eh.ehpolicy
                    AND pr.prexptype = ed.edexptype
                    AND pr.preftj <= ed.edexpdate
                    AND (pr.prexdj = 0 OR pr.prexdj >= ed.edexpdate)
                    AND (TRIM(pr.prlocatn) IS NULL OR pr.prlocatn = ed.edlocatn)
                  ORDER BY CASE WHEN TRIM(pr.prlocatn) IS NULL THEN 1 ELSE 0 END, pr.preftj DESC
                  FETCH FIRST 1 ROWS ONLY
              ) pol
              ORDER BY eh.ehexrptnum, ed.edlin
              FETCH FIRST 500 ROWS ONLY;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  jde_get_voucher_match:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Retrieves A/P vouchers with their three-way match against JD Edwards purchase orders and receipts: ordered vs. received vs. vouchered quantities and amounts, match variance and status, and the grant/project business unit, GL account and subledger charged (2 CFR 200).
      Underlying Tables: F0411 (Supplier Ledger), F43121 (Purchase Order Receiver: receipts and voucher match records), F4311 (Purchase Order Detail), F0006 (Business Unit Master), F0101 (Address Book).
      JDE Applications: Voucher Match (P4314), PO Receipts (P4312), Supplier Ledger Inquiry (P042002).
      Data Notes: Requires voucher_number, po_number or supplier_invoice. Vouchers not created from a PO show NOT_PO_MATCHED. Amounts converted from implied decimals (2 places, unit cost 4).
      Security Context: Accounts Payable company and business unit security (F00950); enforced only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: voucher_number
      type: string
      description: A/P voucher document number (F0411.RPDOC).
    - name: company
      type: string
      description: Optional voucher document company (F0411.RPKCO), e.g. '00001'.
    - name: po_number
      type: string
      description: Purchase order number the voucher was matched to (F43121.PRDOCO).
    - name: supplier_invoice
      type: string
      description: Supplier invoice number on the voucher (F0411.RPVINV).
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :voucher_number AS voucher_number,
                      :company AS company,
                      :po_number AS po_number,
                      :supplier_invoice AS supplier_invoice
                  FROM dual
              )
              -- At least one of voucher_number, po_number or supplier_invoice is required.
              -- Receipts (match type 1) are summed per PO line; the voucher match row (match type 2)
              -- carries the quantity and amount vouchered against that line.
              SELECT
                  rp.rpdoc AS voucher_number,
                  rp.rpdct AS voucher_type,
                  rp.rpkco AS company,
                  rp.rpsfx AS pay_item,
                  rp.rpan8 AS supplier_an8,
                  TRIM(sup.abalph) AS supplier_name,
                  TRIM(rp.rpvinv) AS supplier_invoice,
                  CASE WHEN rp.rpdivj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(rp.rpdivj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS invoice_date,
                  CASE WHEN rp.rpdgj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(rp.rpdgj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS gl_date,
                  rp.rpag / 100 AS pay_item_gross_amount,
                  rp.rpaap / 100 AS pay_item_open_amount,
                  rp.rppst AS pay_status,
                  mt.prdoco AS po_number,
                  mt.prdcto AS po_type,
                  mt.prlnid / 1000 AS po_line_number,
                  TRIM(mt.prlitm) AS item_number,
                  pd.pduorg AS quantity_ordered,
                  pd.pdprrc / 10000 AS po_unit_cost,
                  pd.pdaexp / 100 AS po_line_amount,
                  rc.qty_received AS quantity_received,
                  rc.amt_received / 100 AS amount_received,
                  mt.prurec AS quantity_vouchered,
                  mt.prarec / 100 AS amount_vouchered,
                  (NVL(mt.prarec, 0) - NVL(rc.amt_received, 0)) / 100 AS match_variance,
                  CASE
                      WHEN mt.prdoco IS NULL THEN 'NOT_PO_MATCHED'
                      WHEN rc.qty_received IS NULL THEN 'NO_RECEIPT'
                      WHEN mt.prarec > rc.amt_received THEN 'BILLED_OVER_RECEIVED'
                      WHEN rc.qty_received > pd.pduorg THEN 'RECEIVED_OVER_ORDERED'
                      ELSE 'MATCHED'
                  END AS three_way_match_status,
                  TRIM(mt.prani) AS gl_account,
                  NVL(TRIM(mt.promcu), TRIM(mt.prmcu)) AS grant_or_project_business_unit,
                  TRIM(bu.mcdl01) AS grant_or_project_name,
                  TO_CHAR(TRIM(mt.prsbl)) || CASE WHEN TRIM(mt.prsblt) IS NOT NULL THEN ' (' || TO_CHAR(TRIM(mt.prsblt)) || ')' END AS grant_subledger
              FROM params p
              JOIN ${JDE_DATA_SCHEMA:proddta}.f0411 rp
                  ON (p.voucher_number IS NULL OR rp.rpdoc = TO_NUMBER(p.voucher_number))
                 AND (p.company IS NULL OR rp.rpkco = LPAD(p.company, 5, '0'))
                 AND (p.supplier_invoice IS NULL OR UPPER(TRIM(rp.rpvinv)) = UPPER(TRIM(p.supplier_invoice)))
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f43121 mt
                  ON mt.prmatc = '2'
                 AND mt.prdoc = rp.rpdoc
                 AND mt.prdct = rp.rpdct
                 AND mt.prkco = rp.rpkco
                 AND mt.prsfx = rp.rpsfx
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f4311 pd
                  ON pd.pddoco = mt.prdoco
                 AND pd.pddcto = mt.prdcto
                 AND pd.pdkcoo = mt.prkcoo
                 AND pd.pdsfxo = mt.prsfxo
                 AND pd.pdlnid = mt.prlnid
              LEFT JOIN (
                  SELECT prdoco, prdcto, prkcoo, prsfxo, prlnid,
                         SUM(prurec) AS qty_received,
                         SUM(prarec) AS amt_received
                  FROM ${JDE_DATA_SCHEMA:proddta}.f43121
                  WHERE prmatc = '1'
                  GROUP BY prdoco, prdcto, prkcoo, prsfxo, prlnid
              ) rc
                  ON rc.prdoco = mt.prdoco
                 AND rc.prdcto = mt.prdcto
                 AND rc.prkcoo = mt.prkcoo
                 AND rc.prsfxo = mt.prsfxo
                 AND rc.prlnid = mt.prlnid
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0101 sup
                  ON sup.aban8 = rp.rpan8
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0006 bu
                  ON bu.mcmcu = CASE WHEN TRIM(mt.promcu) IS NOT NULL THEN mt.promcu ELSE mt.prmcu END
              WHERE COALESCE(p.voucher_number, p.po_number, p.supplier_invoice) IS NOT NULL
                AND (p.po_number IS NULL OR mt.prdoco = TO_NUMBER(p.po_number))
              ORDER BY rp.rpdoc, rp.rpsfx, mt.prlnid;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  expense_auditor:
  - jde_get_expense_reports
  - jde_get_voucher_match
