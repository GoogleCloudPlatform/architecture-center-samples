# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  jde_get_employee_personnel_file:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Retrieves an employee's personnel file from JD Edwards HCM: identity (name, SSN, date of birth, home address), job, status and pay rates, the HR change history, and recent pay stubs.
      Underlying Tables: F060116 (Employee Master), F0111 (Who's Who), F0116 (Address by Date), F08042 (HR History), F06156 (Payment Header), F0006 (Business Unit Master).
      JDE Applications: Employee Master (P0801), HR History, Payroll Check Inquiry.
      Data Notes: hr_history and pay_history are text lists, newest first, truncated at 4000 bytes. Contains SSN and date of birth, which are redaction targets.
      Security Context: JDE HR business unit and home company row security (F00950); enforced only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: employee_an8
      type: string
      description: Employee address number (F060116.YAAN8).
    - name: employee_number
      type: string
      description: Additional employee number or badge number (F060116.YAOEMP), used
        when the address number is unknown.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :employee_an8 AS employee_an8,
                      :employee_number AS employee_number
                  FROM dual
              )
              -- HR history (F08042) and pay history (F06156) are returned as one text column each
              -- (newest first) so an employee stays one row instead of multiplying rows.
              SELECT
                  ya.yaan8 AS employee_an8,
                  TRIM(ya.yaoemp) AS employee_number,
                  TRIM(ya.yaalph) AS full_name,
                  TRIM(ww.wwgnnm) AS first_name,
                  TRIM(ww.wwsrnm) AS last_name,
                  TRIM(ya.yassn) AS ssn_tax_id,
                  CASE WHEN ya.yadob > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ya.yadob + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS date_of_birth,
                  TRIM(ya.yasex) AS gender,
                  TRIM(al.aladd1) AS home_address,
                  TRIM(al.alcty1) AS home_city,
                  TRIM(al.aladds) AS home_state,
                  TRIM(al.aladdz) AS home_postal_code,
                  TRIM(ya.yahmco) AS home_company,
                  TRIM(ya.yahmcu) AS home_business_unit,
                  TRIM(bu.mcdl01) AS home_business_unit_name,
                  TRIM(ya.yajbcd) AS job_type,
                  TRIM(ya.yajbst) AS job_step,
                  ya.yaest AS employment_status,
                  ya.yapast AS pay_status,
                  ya.yaanpa AS supervisor_an8,
                  ya.yasal / 100 AS annual_salary,
                  ya.yaphrt / 1000 AS hourly_rate,
                  CASE WHEN ya.yadsi > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ya.yadsi + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS original_hire_date,
                  CASE WHEN ya.yadst > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ya.yadst + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS start_date,
                  CASE WHEN ya.yadt > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ya.yadt + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS termination_date,
                  TRIM(ya.yatrs) AS last_change_reason,
                  (SELECT LISTAGG(
                              CASE WHEN h.jwefto > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(h.jwefto + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END
                              || ' ' || TRIM(h.jwdtai) || '=' || TRIM(h.jwhstd)
                              || CASE WHEN TRIM(h.jwtrs) IS NOT NULL THEN ' (reason ' || TRIM(h.jwtrs) || ')' END,
                              '; ' ON OVERFLOW TRUNCATE '...' WITH COUNT)
                          WITHIN GROUP (ORDER BY h.jwefto DESC)
                     FROM ${JDE_DATA_SCHEMA:proddta}.f08042 h
                    WHERE h.jwan8 = ya.yaan8) AS hr_history,
                  (SELECT LISTAGG(
                              CASE WHEN pc.yuckd > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(pc.yuckd + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END
                              || ' check ' || TO_CHAR(pc.yudocm)
                              || ' gross ' || TO_CHAR(pc.yugpay / 100, 'FM999999990.00')
                              || ' net ' || TO_CHAR(pc.yunpay / 100, 'FM999999990.00'),
                              '; ' ON OVERFLOW TRUNCATE '...' WITH COUNT)
                          WITHIN GROUP (ORDER BY pc.yuckd DESC)
                     FROM ${JDE_DATA_SCHEMA:proddta}.f06156 pc
                    WHERE pc.yuan8 = ya.yaan8) AS pay_history
              FROM params p
              JOIN ${JDE_DATA_SCHEMA:proddta}.f060116 ya
                  ON (p.employee_an8 IS NOT NULL AND ya.yaan8 = TO_NUMBER(p.employee_an8))
                  OR (p.employee_number IS NOT NULL AND TRIM(ya.yaoemp) = TRIM(p.employee_number))
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0111 ww
                  ON ww.wwan8 = ya.yaan8
                 AND ww.wwidln = 0
              LEFT JOIN (
                  SELECT a.*
                  FROM ${JDE_DATA_SCHEMA:proddta}.f0116 a
                  WHERE a.aleftb = (SELECT MAX(x.aleftb) FROM ${JDE_DATA_SCHEMA:proddta}.f0116 x WHERE x.alan8 = a.alan8)
              ) al
                  ON al.alan8 = ya.yaan8
              LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0006 bu
                  ON bu.mcmcu = ya.yahmcu;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  jde_search_foia_records:
    kind: oracle-sql
    source: jde-oracle-source
    description: |-
      Searches discoverable employee records, purchase orders and contracts, and supplier vouchers across JD Edwards HR, Procurement and Accounts Payable by keyword, date range or company.
      Underlying Tables: F060116 (Employee Master), F4301 (Purchase Order Header), F0411 (Supplier Ledger), F0101 (Address Book).
      JDE Applications: Employee Master (P0801), Purchase Orders (P4310), Supplier Ledger Inquiry (P042002).
      Data Notes: reference_id is the JDE address number or document number; pass it to jde_get_employee_personnel_file or, with the matching media object name, to jde_get_media_object_attachment.
      Security Context: Cross-module discovery scoped by JDE company; row security (F00950) enforced only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the JD Edwards security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: search_keyword
      type: string
      description: Keyword, party name, document number or supplier invoice number
        to search for.
    - name: category
      type: string
      description: 'Record category filter: ''HR'', ''PO'', ''AP'' or ''ALL''.'
    - name: start_date
      type: string
      description: Record date window start in YYYY-MM-DD format.
    - name: end_date
      type: string
      description: Record date window end in YYYY-MM-DD format.
    - name: company
      type: string
      description: Optional JDE company (e.g. '00001') to scope the search to one
        agency.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Map the caller to a JDE user and apply their row security
          jde_ai.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the JD Edwards selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :search_keyword AS search_keyword,
                      :category AS category,
                      :start_date AS start_date,
                      :end_date AS end_date,
                      TO_CHAR(:company) AS company
                  FROM dual
              )
              SELECT * FROM (
                  -- HR employee master records
                  SELECT
                      'HR' AS record_category,
                      TO_CHAR(ya.yaan8) AS reference_id,
                      'F060116' AS source_table,
                      'EMPLOYEE' AS document_type,
                      TO_CHAR(TRIM(ya.yahmco)) AS company,
                      TO_CHAR(TRIM(ya.yaalph)) AS party_name,
                      TO_CHAR(RTRIM('Employee ' || TRIM(ya.yaoemp) || ' | Job ' || TRIM(ya.yajbcd) || ' ' || TRIM(ya.yajbst) || ' | BU ' || TRIM(ya.yahmcu), ' |')) AS record_summary,
                      CASE WHEN ya.yadst > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ya.yadst + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS record_date
                  FROM params p
                  JOIN ${JDE_DATA_SCHEMA:proddta}.f060116 ya
                      ON (p.category IS NULL OR UPPER(p.category) IN ('HR', 'ALL'))
                     AND (p.company IS NULL OR ya.yahmco = LPAD(p.company, 5, '0'))
                     AND (p.start_date IS NULL OR ya.yadst >= TO_NUMBER(TO_CHAR(TO_DATE(p.start_date, 'YYYY-MM-DD'), 'YYYYDDD')) - 1900000)
                     AND (p.end_date IS NULL OR ya.yadst <= TO_NUMBER(TO_CHAR(TO_DATE(p.end_date, 'YYYY-MM-DD'), 'YYYYDDD')) - 1900000)
                  WHERE (p.search_keyword IS NULL
                      OR UPPER(ya.yaalph) LIKE UPPER('%' || p.search_keyword || '%')
                      OR TO_CHAR(ya.yaan8) = p.search_keyword
                      OR TRIM(ya.yaoemp) = p.search_keyword)

                  UNION ALL

                  -- Purchase orders and contracts
                  SELECT
                      'PO' AS record_category,
                      TO_CHAR(ph.phdoco) AS reference_id,
                      'F4301' AS source_table,
                      TO_CHAR(ph.phdcto) AS document_type,
                      TO_CHAR(ph.phkcoo) AS company,
                      TO_CHAR(TRIM(ab.abalph)) AS party_name,
                      TO_CHAR(RTRIM('Order ' || TRIM(ph.phdesc) || ' | Ref ' || TRIM(ph.phvr01) || ' | ' || TRIM(ph.phrmk), ' |')) AS record_summary,
                      CASE WHEN ph.phtrdj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ph.phtrdj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS record_date
                  FROM params p
                  JOIN ${JDE_DATA_SCHEMA:proddta}.f4301 ph
                      ON (p.category IS NULL OR UPPER(p.category) IN ('PO', 'ALL'))
                     AND (p.company IS NULL OR ph.phkcoo = LPAD(p.company, 5, '0'))
                     AND (p.start_date IS NULL OR ph.phtrdj >= TO_NUMBER(TO_CHAR(TO_DATE(p.start_date, 'YYYY-MM-DD'), 'YYYYDDD')) - 1900000)
                     AND (p.end_date IS NULL OR ph.phtrdj <= TO_NUMBER(TO_CHAR(TO_DATE(p.end_date, 'YYYY-MM-DD'), 'YYYYDDD')) - 1900000)
                  LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0101 ab
                      ON ab.aban8 = ph.phan8
                  WHERE (p.search_keyword IS NULL
                      OR TO_CHAR(ph.phdoco) = p.search_keyword
                      OR UPPER(ph.phdesc) LIKE UPPER('%' || p.search_keyword || '%')
                      OR UPPER(ph.phvr01) LIKE UPPER('%' || p.search_keyword || '%')
                      OR UPPER(ab.abalph) LIKE UPPER('%' || p.search_keyword || '%'))

                  UNION ALL

                  -- A/P vouchers (first pay item only, one row per voucher)
                  SELECT
                      'AP' AS record_category,
                      TO_CHAR(ap.rpdoc) AS reference_id,
                      'F0411' AS source_table,
                      TO_CHAR(ap.rpdct) AS document_type,
                      TO_CHAR(ap.rpkco) AS company,
                      TO_CHAR(TRIM(ab.abalph)) AS party_name,
                      TO_CHAR(RTRIM('Voucher for invoice ' || TRIM(ap.rpvinv) || ' | ' || TRIM(ap.rprmk), ' |')) AS record_summary,
                      CASE WHEN ap.rpdivj > 0 THEN TO_CHAR(TO_DATE(TO_CHAR(ap.rpdivj + 1900000), 'YYYYDDD'), 'YYYY-MM-DD') END AS record_date
                  FROM params p
                  JOIN ${JDE_DATA_SCHEMA:proddta}.f0411 ap
                      ON ap.rpsfx = '001'
                     AND (p.category IS NULL OR UPPER(p.category) IN ('AP', 'ALL'))
                     AND (p.company IS NULL OR ap.rpkco = LPAD(p.company, 5, '0'))
                     AND (p.start_date IS NULL OR ap.rpdivj >= TO_NUMBER(TO_CHAR(TO_DATE(p.start_date, 'YYYY-MM-DD'), 'YYYYDDD')) - 1900000)
                     AND (p.end_date IS NULL OR ap.rpdivj <= TO_NUMBER(TO_CHAR(TO_DATE(p.end_date, 'YYYY-MM-DD'), 'YYYYDDD')) - 1900000)
                  LEFT JOIN ${JDE_DATA_SCHEMA:proddta}.f0101 ab
                      ON ab.aban8 = ap.rpan8
                  WHERE (p.search_keyword IS NULL
                      OR TO_CHAR(ap.rpdoc) = p.search_keyword
                      OR UPPER(ap.rpvinv) LIKE UPPER('%' || p.search_keyword || '%')
                      OR UPPER(ap.rprmk) LIKE UPPER('%' || p.search_keyword || '%')
                      OR UPPER(ab.abalph) LIKE UPPER('%' || p.search_keyword || '%'))
              )
              ORDER BY record_date DESC
              FETCH FIRST 100 ROWS ONLY;

          -- 3. Forget the identity so a pooled connection never carries it into the next call
          jde_ai.xx_ai_security_pkg.clear_session;

          -- 4. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  redaction_and_foia_compliance:
  - jde_get_employee_personnel_file
  - jde_search_foia_records
