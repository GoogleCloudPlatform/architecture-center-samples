# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_get_intake_attachments:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Retrieves the documents attached to one intake record (for example applicant proof documents such as paystubs, W-2s or utility bills) from the EBS attachment store, in attachment order, with category, data type, title, file name, MIME type, size, upload date and uploader.
      entity_name is required (find it with ebs_list_attachment_entities); the key value alone is not unique across EBS. File data is returned only with include_content = 'Y' and is binary (for example a PDF or image), not text. At most 50 attachments are returned.
      Underlying Tables: FND_ATTACHED_DOCUMENTS, FND_DOCUMENTS, FND_DOCUMENTS_TL, FND_DOCUMENT_CATEGORIES_TL, FND_DOCUMENT_DATATYPES, FND_LOBS, FND_USER.
      Security Context: Per-user security only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: intake_queue_id
      type: string
      description: Primary key value of the intake record the documents are attached
        to (FND_ATTACHED_DOCUMENTS.PK1_VALUE).
    - name: applicant_id
      type: string
      description: Optional second key value, e.g. the applicant or party ID (PK2_VALUE).
        Empty string = any.
    - name: entity_name
      type: string
      description: Required. Attachment entity of the intake record (e.g. the agency's
        intake or party entity); use ebs_list_attachment_entities to find it. Without
        it nothing is returned.
    - name: include_content
      type: string
      description: '''Y'' returns the file data (large); anything else returns metadata
        only.'
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :intake_queue_id AS intake_queue_id,
                      :applicant_id AS applicant_id,
                      :entity_name AS entity_name,
                      :include_content AS include_content
                  FROM dual
              )
              -- The entity filter is mandatory: the same key value is used by unrelated entities
              -- (for example '1' appears on five, including HR performance plans).
              SELECT
                  fad.attached_document_id,
                  fd.document_id,
                  fad.entity_name,
                  fad.pk1_value AS intake_queue_id,
                  fad.pk2_value AS applicant_id,
                  fad.seq_num AS attachment_sequence,
                  cat.user_name AS document_category,
                  dtype.user_name AS document_datatype,
                  fdt.title AS document_title,
                  fdt.description AS document_notes,
                  NVL(fl.file_name, fd.file_name) AS file_name,
                  fl.file_content_type AS mime_type,
                  DBMS_LOB.GETLENGTH(fl.file_data) AS file_size_bytes,
                  TO_CHAR(NVL(fl.upload_date, fad.creation_date), 'YYYY-MM-DD') AS upload_date,
                  fu.user_name AS uploaded_by,
                  CASE WHEN UPPER(p.include_content) = 'Y' THEN fl.file_data END AS file_data
              FROM params p
              JOIN apps.fnd_attached_documents fad
                  ON fad.entity_name = p.entity_name
                 AND fad.pk1_value = p.intake_queue_id
                 AND (p.applicant_id IS NULL OR fad.pk2_value = p.applicant_id)
              JOIN apps.fnd_documents fd
                  ON fad.document_id = fd.document_id
              LEFT JOIN apps.fnd_documents_tl fdt
                  ON fd.document_id = fdt.document_id
                 AND fdt.language = USERENV('LANG')
              LEFT JOIN apps.fnd_document_categories_tl cat
                  ON cat.category_id = NVL(fad.category_id, fd.category_id)
                 AND cat.language = USERENV('LANG')
              LEFT JOIN apps.fnd_document_datatypes dtype
                  ON dtype.datatype_id = fd.datatype_id
                 AND dtype.language = USERENV('LANG')
              LEFT JOIN apps.fnd_lobs fl
                  ON fd.datatype_id = 6
                 AND fd.media_id = fl.file_id
              LEFT JOIN apps.fnd_user fu
                  ON fu.user_id = fad.created_by
              ORDER BY fad.seq_num, fad.attached_document_id
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_verify_party_identity:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Validates extracted identity data (legal name, tax ID/SSN hash, postal code) for a person against the EBS Trading Community Architecture (TCA) registry. Returns one row per matching person, at most 10, with name match confidence (100 exact, 75 partial, 0 no match), VERIFIED_MATCH / NO_MATCH / NOT_CHECKED results for the tax ID hash and postal code, the matching or identifying address and its uses (BILL_TO, SHIP_TO and so on), and the primary email and phone.
      Pass party_id when known; otherwise legal_name must be at least 3 characters. The tax ID is never returned: send its SHA-256 hash (hex, either case) computed over the value exactly as stored.
      Underlying Tables: HZ_PARTIES, HZ_PERSON_PROFILES, HZ_PARTY_SITES, HZ_PARTY_SITE_USES, HZ_LOCATIONS, HZ_CONTACT_POINTS.
      Security Context: Per-user security only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: legal_name
      type: string
      description: Legal full name of the person to cross-reference (at least 3 characters
        when party_id is empty).
    - name: tax_id_hash
      type: string
      description: SHA-256 hash (64 hex characters, either case) of the tax ID or
        SSN exactly as stored in EBS. Empty string = not checked.
    - name: postal_code
      type: string
      description: ZIP or postal code to verify against the person's active addresses.
        Empty string = not checked.
    - name: party_id
      type: string
      description: Existing TCA party ID, if known. Empty string = search by name.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :legal_name AS legal_name,
                      :tax_id_hash AS tax_id_hash,
                      :postal_code AS postal_code,
                      :party_id AS party_id
                  FROM dual
              )
              -- One row per person. The address shown is the one matching postal_code if any, else
              -- the identifying address; email and phone are the primary active contact points.
              SELECT
                  hp.party_id,
                  hp.party_number,
                  hp.party_name,
                  hpp.person_first_name,
                  hpp.person_last_name,
                  hl.address1,
                  hl.city,
                  hl.state,
                  hl.postal_code,
                  (SELECT LISTAGG(u.site_use_type, ',') WITHIN GROUP (ORDER BY u.site_use_type)
                     FROM apps.hz_party_site_uses u
                    WHERE u.party_site_id = hps.party_site_id AND u.status = 'A') AS address_uses,
                  (SELECT MAX(cp.email_address) KEEP (DENSE_RANK FIRST ORDER BY cp.primary_flag DESC NULLS LAST)
                     FROM apps.hz_contact_points cp
                    WHERE cp.owner_table_name = 'HZ_PARTIES' AND cp.owner_table_id = hp.party_id
                      AND cp.status = 'A' AND cp.contact_point_type = 'EMAIL') AS email_address,
                  (SELECT MAX(TRIM(cp.phone_area_code || ' ' || cp.phone_number)) KEEP (DENSE_RANK FIRST ORDER BY cp.primary_flag DESC NULLS LAST)
                     FROM apps.hz_contact_points cp
                    WHERE cp.owner_table_name = 'HZ_PARTIES' AND cp.owner_table_id = hp.party_id
                      AND cp.status = 'A' AND cp.contact_point_type = 'PHONE') AS phone_number,
                  CASE
                      WHEN p.legal_name IS NULL THEN NULL
                      WHEN UPPER(TRIM(hp.party_name)) = UPPER(TRIM(p.legal_name))
                        OR UPPER(hpp.person_first_name || ' ' || hpp.person_last_name) = UPPER(TRIM(p.legal_name))
                        OR UPPER(hpp.person_last_name || ', ' || hpp.person_first_name) = UPPER(TRIM(p.legal_name)) THEN 100
                      WHEN UPPER(hp.party_name) LIKE UPPER('%' || TRIM(p.legal_name) || '%') THEN 75
                      ELSE 0
                  END AS name_match_confidence,
                  CASE
                      WHEN p.tax_id_hash IS NULL THEN 'NOT_CHECKED'
                      WHEN hpp.jgzz_fiscal_code IS NULL THEN 'NO_TAX_ID_ON_FILE'
                      WHEN RAWTOHEX(STANDARD_HASH(hpp.jgzz_fiscal_code, 'SHA256')) = UPPER(TRIM(p.tax_id_hash)) THEN 'VERIFIED_MATCH'
                      ELSE 'NO_MATCH'
                  END AS tax_id_hash_verification,
                  CASE
                      WHEN p.postal_code IS NULL THEN 'NOT_CHECKED'
                      WHEN hl.postal_code LIKE TRIM(p.postal_code) || '%' THEN 'VERIFIED_MATCH'
                      ELSE 'NO_MATCH'
                  END AS postal_code_verification
              FROM params p
              JOIN apps.hz_parties hp
                  ON hp.party_type = 'PERSON'
                 AND ((p.party_id IS NOT NULL AND hp.party_id = TO_NUMBER(p.party_id))
                   OR (p.party_id IS NULL AND LENGTH(TRIM(p.legal_name)) >= 3
                       AND UPPER(hp.party_name) LIKE UPPER('%' || TRIM(p.legal_name) || '%')))
              JOIN apps.hz_person_profiles hpp
                  ON hp.party_id = hpp.party_id
                 AND SYSDATE BETWEEN hpp.effective_start_date AND NVL(hpp.effective_end_date, SYSDATE + 1)
              OUTER APPLY (
                  SELECT s.party_site_id, s.location_id
                  FROM apps.hz_party_sites s
                  JOIN apps.hz_locations l
                      ON l.location_id = s.location_id
                  WHERE s.party_id = hp.party_id
                    AND s.status = 'A'
                  ORDER BY CASE WHEN p.postal_code IS NOT NULL AND l.postal_code LIKE TRIM(p.postal_code) || '%' THEN 0 ELSE 1 END,
                           CASE WHEN s.identifying_address_flag = 'Y' THEN 0 ELSE 1 END,
                           s.party_site_id
                  FETCH FIRST 1 ROWS ONLY
              ) hps
              LEFT JOIN apps.hz_locations hl
                  ON hl.location_id = hps.location_id
              ORDER BY name_match_confidence DESC NULLS LAST, hp.party_id
              FETCH FIRST 10 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  document_intake_cleanup_and_validation:
  - ebs_get_intake_attachments
  - ebs_verify_party_identity
