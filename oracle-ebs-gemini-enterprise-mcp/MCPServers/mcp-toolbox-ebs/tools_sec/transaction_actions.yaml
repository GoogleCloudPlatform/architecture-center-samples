# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_find_items:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Finds inventory items by item number or description and shows where they exist (inventory organization code), their unit of measure and whether they can be reserved.
      Use this tool to find valid values for :item (item_number) and :location (location) of ebs_reserve_item and ebs_create_onhand. Only items with reservable = 'Y' can be reserved. Up to 50 rows.
      Underlying Tables: MTL_SYSTEM_ITEMS_B, MTL_PARAMETERS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: keyword
      type: string
      description: Part of the item number or description (e.g. 'O-ring'). Empty string
        = any.
    - name: location
      type: string
      description: Inventory organization code (e.g. 'S1'). Empty string = every organization.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :keyword AS keyword,
                      :location AS location
                  FROM dual
              )
              SELECT
                  msi.segment1 AS item_number,
                  msi.description,
                  mp.organization_code AS location,
                  msi.organization_id,
                  msi.primary_uom_code,
                  CASE WHEN msi.reservable_type = 1 THEN 'Y' ELSE 'N' END AS reservable,
                  msi.inventory_item_status_code AS item_status,
                  msi.inventory_item_id
              FROM apps.mtl_system_items_b msi
              JOIN apps.mtl_parameters mp ON mp.organization_id = msi.organization_id
              CROSS JOIN params p
              WHERE (p.keyword IS NULL
                     OR UPPER(msi.segment1) LIKE UPPER('%' || p.keyword || '%')
                     OR UPPER(msi.description) LIKE UPPER('%' || p.keyword || '%'))
                AND (p.location IS NULL OR mp.organization_code = UPPER(p.location))
                AND msi.enabled_flag = 'Y'
              ORDER BY msi.segment1, mp.organization_code
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_get_invoice_import_status:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Shows what happened to an invoice submitted by ebs_create_ap_invoice: the status of its interface row and the reasons it was rejected, if any.
      interface_status PROCESSED means it was imported (then it is in ebs_list_supplier_invoices; imported rows are normally purged from the interface). REJECTED with a reject_lookup_code (e.g. INVALID SUPPLIER SITE) explains why the import failed. NULL or PENDING means the concurrent request (request_id) has not run yet, so try again later. No rows means the invoice is already imported or was never submitted.
      Underlying Tables: AP_INVOICES_INTERFACE, AP_INTERFACE_REJECTIONS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: vendor_id
      type: integer
      description: Supplier ID (AP_SUPPLIERS.VENDOR_ID).
    - name: invoice_num
      type: string
      description: Invoice number, exact match. Empty string = the supplier's latest
        interface rows.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :vendor_id AS vendor_id,
                      :invoice_num AS invoice_num
                  FROM dual
              )
              SELECT
                  aii.invoice_id,
                  aii.invoice_num,
                  aii.status AS interface_status,
                  aii.request_id,
                  aii.group_id,
                  air.reject_lookup_code,
                  aii.creation_date
              FROM apps.ap_invoices_interface aii
              LEFT JOIN apps.ap_interface_rejections air
                     ON air.parent_table = 'AP_INVOICES_INTERFACE' AND air.parent_id = aii.invoice_id
              CROSS JOIN params p
              WHERE aii.vendor_id = p.vendor_id
                AND (p.invoice_num IS NULL OR aii.invoice_num = p.invoice_num)
              ORDER BY aii.creation_date DESC, aii.invoice_id
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_get_onhand:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Shows the on-hand quantity, the reserved quantity and the available quantity of one item per organization and subinventory.
      Use this tool before ebs_reserve_item (is enough stock available?) and to confirm the result of ebs_create_onhand. An item with no stock returns no rows.
      Underlying Tables: MTL_ONHAND_QUANTITIES_DETAIL, MTL_RESERVATIONS, MTL_SYSTEM_ITEMS_B, MTL_PARAMETERS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: item
      type: string
      description: Item number (MTL_SYSTEM_ITEMS_B.SEGMENT1), exact match.
    - name: location
      type: string
      description: Inventory organization code (e.g. 'S1'). Empty string = every organization.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :item AS item,
                      :location AS location
                  FROM dual
              ),
              oh AS (
                  SELECT inventory_item_id, organization_id, subinventory_code,
                         SUM(primary_transaction_quantity) AS onhand_qty
                  FROM apps.mtl_onhand_quantities_detail
                  GROUP BY inventory_item_id, organization_id, subinventory_code
              ),
              rs AS (
                  SELECT inventory_item_id, organization_id, subinventory_code,
                         SUM(primary_reservation_quantity) AS reserved_qty
                  FROM apps.mtl_reservations
                  GROUP BY inventory_item_id, organization_id, subinventory_code
              )
              SELECT
                  msi.segment1 AS item_number,
                  mp.organization_code AS location,
                  oh.subinventory_code AS sub_inventory,
                  msi.primary_uom_code,
                  oh.onhand_qty,
                  NVL(rs.reserved_qty, 0) AS reserved_qty,
                  oh.onhand_qty - NVL(rs.reserved_qty, 0) AS available_qty
              FROM params p
              JOIN apps.mtl_system_items_b msi ON UPPER(msi.segment1) = UPPER(p.item)
              JOIN apps.mtl_parameters mp ON mp.organization_id = msi.organization_id
              JOIN oh ON oh.inventory_item_id = msi.inventory_item_id AND oh.organization_id = msi.organization_id
              LEFT JOIN rs ON rs.inventory_item_id = oh.inventory_item_id
                          AND rs.organization_id = oh.organization_id
                          AND rs.subinventory_code = oh.subinventory_code
              WHERE p.location IS NULL OR mp.organization_code = UPPER(p.location)
              ORDER BY mp.organization_code, oh.subinventory_code
              FETCH FIRST 100 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_list_inventory_orgs:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists inventory organizations with their organization code, name and operating unit.
      Use this tool to find valid values for :location (location) of ebs_find_items, ebs_reserve_item, ebs_create_onhand, ebs_list_subinventories, ebs_get_onhand and ebs_list_reservations. The write tools only see organizations of the signed-in user's operating unit (see ebs_get_my_context).
      Underlying Tables: MTL_PARAMETERS, ORG_ORGANIZATION_DEFINITIONS, HR_OPERATING_UNITS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: org_id
      type: string
      description: Operating unit ID (HR_OPERATING_UNITS.ORGANIZATION_ID); returns
        only inventory organizations of that operating unit. Empty string = any.
    - name: name_pattern
      type: string
      description: Part of the organization name or code (e.g. 'Seattle' or 'S1').
        Empty string = any.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :org_id AS org_id,
                      :name_pattern AS name_pattern
                  FROM dual
              )
              SELECT
                  mp.organization_code AS location,
                  ood.organization_name,
                  ood.organization_id,
                  ood.operating_unit AS org_id,
                  hou.name AS operating_unit_name
              FROM apps.mtl_parameters mp
              JOIN apps.org_organization_definitions ood ON ood.organization_id = mp.organization_id
              LEFT JOIN apps.hr_operating_units hou ON hou.organization_id = ood.operating_unit
              CROSS JOIN params p
              WHERE (p.org_id IS NULL OR ood.operating_unit = TO_NUMBER(p.org_id))
                AND (p.name_pattern IS NULL
                     OR UPPER(ood.organization_name) LIKE UPPER('%' || p.name_pattern || '%')
                     OR UPPER(mp.organization_code) LIKE UPPER('%' || p.name_pattern || '%'))
              ORDER BY mp.organization_code
              FETCH FIRST 100 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_list_reservations:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists inventory reservations (newest first, up to 50), optionally for one item and organization.
      Use this tool to find the valid value for :reservation_id (reservation_id) of ebs_delete_reservation, and to confirm that ebs_reserve_item or ebs_delete_reservation took effect.
      Underlying Tables: MTL_RESERVATIONS, MTL_SYSTEM_ITEMS_B, MTL_PARAMETERS, FND_USER.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: item
      type: string
      description: Item number (MTL_SYSTEM_ITEMS_B.SEGMENT1), exact match. Empty string
        = any item.
    - name: location
      type: string
      description: Inventory organization code (e.g. 'S1'). Empty string = every organization.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :item AS item,
                      :location AS location
                  FROM dual
              )
              SELECT
                  mr.reservation_id,
                  msi.segment1 AS item_number,
                  mp.organization_code AS location,
                  mr.subinventory_code AS sub_inventory,
                  mr.reservation_quantity,
                  mr.reservation_uom_code,
                  mr.demand_source_name,
                  mr.requirement_date,
                  mr.creation_date,
                  fu.user_name AS created_by
              FROM apps.mtl_reservations mr
              JOIN apps.mtl_system_items_b msi ON msi.inventory_item_id = mr.inventory_item_id
                                              AND msi.organization_id = mr.organization_id
              JOIN apps.mtl_parameters mp ON mp.organization_id = mr.organization_id
              LEFT JOIN apps.fnd_user fu ON fu.user_id = mr.created_by
              CROSS JOIN params p
              WHERE (p.item IS NULL OR UPPER(msi.segment1) = UPPER(p.item))
                AND (p.location IS NULL OR mp.organization_code = UPPER(p.location))
              ORDER BY mr.creation_date DESC
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_list_subinventories:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists the active subinventories (storage areas) of an inventory organization and whether they are reservable.
      Use this tool to find valid values for :sub_inventory (sub_inventory) of ebs_reserve_item and ebs_create_onhand; the default is 'Stores'.
      Underlying Tables: MTL_SECONDARY_INVENTORIES, MTL_PARAMETERS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: location
      type: string
      description: Inventory organization code (e.g. 'S1'). Empty string = every organization
        (up to 100 rows).
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :location AS location FROM dual
              )
              SELECT
                  mp.organization_code AS location,
                  si.secondary_inventory_name AS sub_inventory,
                  si.description,
                  CASE WHEN si.reservable_type = 1 THEN 'Y' ELSE 'N' END AS reservable,
                  si.quantity_tracked,
                  si.disable_date
              FROM apps.mtl_secondary_inventories si
              JOIN apps.mtl_parameters mp ON mp.organization_id = si.organization_id
              CROSS JOIN params p
              WHERE (p.location IS NULL OR mp.organization_code = UPPER(p.location))
                AND (si.disable_date IS NULL OR si.disable_date > SYSDATE)
              ORDER BY mp.organization_code, si.secondary_inventory_name
              FETCH FIRST 100 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_list_supplier_invoices:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists the invoices already entered for a supplier (newest first, up to 50), optionally for one invoice number.
      Use this tool before ebs_create_ap_invoice to avoid a duplicate :invoice_num, and afterwards to confirm that the imported invoice exists (ebs_create_ap_invoice only submits an import). Rows still waiting or rejected in the interface are shown by ebs_get_invoice_import_status.
      Underlying Table: AP_INVOICES_ALL.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: vendor_id
      type: integer
      description: Supplier ID (AP_SUPPLIERS.VENDOR_ID).
    - name: invoice_num
      type: string
      description: Invoice number, exact match. Empty string = every invoice of the
        supplier.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :vendor_id AS vendor_id,
                      :invoice_num AS invoice_num
                  FROM dual
              )
              SELECT
                  ai.invoice_id,
                  ai.invoice_num,
                  ai.invoice_date,
                  ai.invoice_amount,
                  ai.invoice_currency_code,
                  ai.payment_status_flag,
                  ai.source,
                  ai.org_id,
                  ai.vendor_site_id,
                  ai.creation_date
              FROM apps.ap_invoices_all ai
              CROSS JOIN params p
              WHERE ai.vendor_id = p.vendor_id
                AND (p.invoice_num IS NULL OR ai.invoice_num = p.invoice_num)
              ORDER BY ai.creation_date DESC
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_list_supplier_sites:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists the sites of a supplier with their code, operating unit, purchasing/pay flags and inactive date.
      Use this tool to find valid values for :supplier_site (vendor_site_code, or part of it) of ebs_create_ap_invoice. Invoices need a site with pay_site_flag = 'Y' that is not inactive. If the supplier has no pay site, ebs_create_ap_invoice creates a default one ('Gemini default site for <vendor_id>'). No rows means the supplier has no sites yet.
      Underlying Tables: AP_SUPPLIER_SITES_ALL, HR_OPERATING_UNITS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: vendor_id
      type: integer
      description: Supplier ID (AP_SUPPLIERS.VENDOR_ID), e.g. from ebs_lookup_parties_and_vendors
        or ebs_create_supplier.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :vendor_id AS vendor_id FROM dual
              )
              SELECT
                  ss.vendor_site_id,
                  ss.vendor_site_code,
                  ss.org_id,
                  hou.name AS operating_unit_name,
                  ss.purchasing_site_flag,
                  ss.pay_site_flag,
                  ss.primary_pay_site_flag,
                  ss.city,
                  ss.country,
                  ss.inactive_date
              FROM apps.ap_supplier_sites_all ss
              LEFT JOIN apps.hr_operating_units hou ON hou.organization_id = ss.org_id
              CROSS JOIN params p
              WHERE ss.vendor_id = p.vendor_id
              ORDER BY ss.org_id, ss.vendor_site_code
              FETCH FIRST 100 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_create_ap_invoice:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Enters a Payables invoice: inserts it into AP_INVOICES_INTERFACE / AP_INVOICE_LINES_INTERFACE and submits the Payables Open Interface Import concurrent program (APXIIMPT). THIS CHANGES DATA: rows are committed and a concurrent request is submitted under the signed-in user.
      Returns one JSON text in column RESULT: {"STATUS":"SUCCESS","MESSAGE":[{"REQUEST_ID":...},{"INVOICE_ID":...},{"INVOICE_LINE_ID":...},{"VENDOR_SITE_ID":...}]} or {"STATUS":"ERROR","MESSAGE":"..."}. SUCCESS means the import was submitted, not that the invoice was accepted.
      Find the inputs first: ebs_lookup_parties_and_vendors or ebs_create_supplier (vendor_id), ebs_list_supplier_sites (supplier_site) and ebs_list_supplier_invoices (is invoice_num already used?). Afterwards ebs_get_invoice_import_status shows PROCESSED or the rejection reason, and ebs_list_supplier_invoices shows the imported invoice.
      Operating unit, currency (USD) and invoice source are fixed inside the package. Do not retry blindly after an error.
      Underlying package: APPS.GE_EBS_MCP_TOOLS.CREATE_AP_INVOICE.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: vendor_id
      type: integer
      description: Supplier ID (AP_SUPPLIERS.VENDOR_ID), e.g. from ebs_lookup_parties_and_vendors
        or ebs_create_supplier.
    - name: invoice_num
      type: string
      description: Invoice number to enter.
    - name: amount
      type: float
      description: Invoice amount (one ITEM line for the full amount).
    - name: supplier_site
      type: string
      description: Supplier site code or part of it. Empty string = the supplier's
        default site (created if missing).
    - name: description
      type: string
      description: Line description. Empty string = a default text.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :vendor_id AS vendor_id,
                      :invoice_num AS invoice_num,
                      :amount AS amount,
                      :supplier_site AS supplier_site,
                      :description AS description
                  FROM dual
              )
              SELECT apps.ge_ebs_mcp_tools.create_ap_invoice(p.vendor_id, p.invoice_num, p.amount, p.supplier_site, p.description) AS result
              FROM params p;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_create_onhand:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Creates on-hand stock for an item with an Oracle Inventory Miscellaneous Receipt (writes MTL_TRANSACTIONS_INTERFACE and processes it at once through INV_TXN_MANAGER_PUB). THIS CHANGES DATA: it commits a stock transaction under the signed-in user.
      Returns one JSON text in column RESULT: {"STATUS":"SUCCESS",...} or {"STATUS":"ERROR","MESSAGE":"..."}.
      Find the inputs first: ebs_find_items (item and location) and ebs_list_subinventories (sub_inventory); ebs_get_onhand confirms the new stock afterwards. Use for test or demo stock; the distribution account is fixed inside the package. Do not retry blindly after an error.
      Underlying package: APPS.GE_EBS_MCP_TOOLS.CREATE_ONHAND.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: item
      type: string
      description: Item number (MTL_SYSTEM_ITEMS_B.SEGMENT1).
    - name: quantity
      type: float
      description: Quantity to receive into stock.
    - name: location
      type: string
      description: Inventory organization code (e.g. 'S1').
    - name: sub_inventory
      type: string
      description: Subinventory to receive into. Empty string = 'Stores'.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :item AS item,
                      :quantity AS quantity,
                      :location AS location,
                      :sub_inventory AS sub_inventory
                  FROM dual
              )
              SELECT apps.ge_ebs_mcp_tools.create_onhand(p.item, p.quantity, p.location, NVL(p.sub_inventory, 'Stores')) AS result
              FROM params p;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_create_supplier:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Creates a supplier (vendor) with the Oracle Payables API AP_VENDOR_PUB_PKG.CREATE_VENDOR. THIS CHANGES DATA: the supplier is committed under the signed-in user.
      Returns one JSON text in column RESULT: {"STATUS":"SUCCESS","VENDOR_ID":"<id>"} or {"STATUS":"ERROR","MESSAGE":"..."}. Keep the VENDOR_ID for ebs_create_ap_invoice. Search ebs_lookup_parties_and_vendors first so you do not create a duplicate. ebs_list_supplier_sites shows the sites afterwards (none yet).
      The supplier has no site yet; ebs_create_ap_invoice creates a default site when it needs one.
      Underlying package: APPS.GE_EBS_MCP_TOOLS.CREATE_SUPPLIER.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: vendor_name
      type: string
      description: Name of the new supplier.
    - name: tax_reg_num
      type: string
      description: Tax reference (AP_SUPPLIERS.VAT_REGISTRATION_NUM / tax reference).
        Empty string = none.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :vendor_name AS vendor_name,
                      :tax_reg_num AS tax_reg_num
                  FROM dual
              )
              SELECT apps.ge_ebs_mcp_tools.create_supplier(p.vendor_name, NULL, p.tax_reg_num) AS result
              FROM params p;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_delete_reservation:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Deletes an inventory reservation by ID (INV_RESERVATION_PUB.DELETE_RESERVATION). THIS CHANGES DATA: the deletion is committed under the signed-in user and cannot be undone by this tool.
      Returns one JSON text in column RESULT: {"STATUS":"SUCCESS","MESSAGE":"Reservation <id> deleted successfully."} or {"STATUS":"ERROR","MESSAGE":"..."}.
      Find :reservation_id with ebs_list_reservations (also to confirm the deletion).
      Underlying package: APPS.GE_EBS_MCP_TOOLS.DELETE_RESERVATION.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: reservation_id
      type: integer
      description: Reservation ID (MTL_RESERVATIONS.RESERVATION_ID), as returned by
        ebs_reserve_item.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :reservation_id AS reservation_id FROM dual
              )
              SELECT apps.ge_ebs_mcp_tools.delete_reservation(p.reservation_id) AS result
              FROM params p;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_reserve_item:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Creates a manual inventory reservation (Oracle Inventory API INV_RESERVATION_PUB.CREATE_RESERVATION) for an item. THIS CHANGES DATA: it commits a reservation under the signed-in user.
      Returns one JSON text in column RESULT: {"STATUS":"SUCCESS","MESSAGE":[{"RESERVATION_ID":...},{"QUANTITY_RESERVED":...}]} or {"STATUS":"ERROR","MESSAGE":"..."}. Keep the RESERVATION_ID: ebs_delete_reservation needs it.
      Find the inputs first: ebs_get_my_context (whose operating unit is used), ebs_find_items (item and location; the item must be reservable), ebs_list_subinventories (sub_inventory) and ebs_get_onhand (is enough available?). Afterwards ebs_list_reservations confirms it. Do not retry blindly after an error, because the call may already have succeeded.
      Underlying package: APPS.GE_EBS_MCP_TOOLS.RESERVE_ITEM.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: item
      type: string
      description: Item number (MTL_SYSTEM_ITEMS_B.SEGMENT1) to reserve; a reservable
        item in the user's operating unit.
    - name: quantity
      type: float
      description: Quantity to reserve, in the item's primary unit of measure (Ea).
    - name: location
      type: string
      description: Inventory organization code (e.g. 'S1'). Empty string = any organization
        of the user's operating unit.
    - name: sub_inventory
      type: string
      description: Subinventory to reserve from. Empty string = 'Stores'.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :item AS item,
                      :quantity AS quantity,
                      :location AS location,
                      :sub_inventory AS sub_inventory
                  FROM dual
              )
              SELECT apps.ge_ebs_mcp_tools.reserve_item(p.item, p.quantity, p.location, NVL(p.sub_inventory, 'Stores')) AS result
              FROM params p;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
