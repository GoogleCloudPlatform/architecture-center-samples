# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_get_agency_policy_rules:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Queries agency-configured procurement approval limits and expense-type receipt rules from EBS setups. Pass an operating unit ID in org_id (empty string = all) and a name fragment in rule_name (empty string = all); pass as_of_date (YYYY-MM-DD) for the rules in force on a date (empty = all rules, active or not); at most 200 rows are returned. These tables have no start date: created_date is when the rule was set up, and effective_end_date is when it was ended or inactivated. In the EXPENSE category, threshold_amount is the amount above which a receipt is required (see threshold_meaning); it is not a spending cap. Per diem and lodging limits live in the expense policy schedules, which this tool does not read.
      Underlying Tables: PO_CONTROL_RULES, PO_CONTROL_GROUPS_ALL, AP_EXPENSE_REPORT_PARAMS_ALL.
      Security Context: Standard APPS schema access; Global profile options context.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: policy_category
      type: string
      description: 'Policy category: ''PROCUREMENT'', ''TRAVEL'', ''EXPENSE'', or
        ''ALL''.'
    - name: rule_name
      type: string
      description: Specific rule name or control group parameter identifier.
    - name: org_id
      type: string
      description: Operating unit ID to restrict the rules to. Empty string = all
        operating units.
    - name: as_of_date
      type: string
      description: YYYY-MM-DD; returns only rules that existed and had not ended on
        that date. Empty string = all rules, active or not.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :policy_category AS policy_category,
                      :rule_name AS rule_name,
                      :org_id AS org_id,
                      :as_of_date AS as_of_date
                  FROM dual
              )
              -- These setup tables have no start date, only an end (inactive) date, so created_date
              -- stands in for the start: a rule counts as in force on as_of_date if it was created
              -- by then and had not ended.
              SELECT * FROM (
                  SELECT
                      'PROCUREMENT' AS policy_category,
                      pcg.control_group_name AS rule_group,
                      pcr.rule_type_code AS rule_type,
                      pcr.object_code AS policy_object,
                      pcr.amount_limit AS threshold_amount,
                      'Approval amount limit' AS threshold_meaning,
                      TO_CHAR(pcr.creation_date, 'YYYY-MM-DD') AS created_date,
                      TO_CHAR(pcr.inactive_date, 'YYYY-MM-DD') AS effective_end_date,
                      'Org: ' || TO_CHAR(pcg.org_id) AS rule_scope
                  FROM apps.po_control_rules pcr
                  JOIN apps.po_control_groups_all pcg
                      ON pcr.control_group_id = pcg.control_group_id
                  CROSS JOIN params p
                  WHERE (p.policy_category IS NULL OR UPPER(p.policy_category) IN ('PROCUREMENT', 'ALL'))
                    AND (p.rule_name IS NULL OR UPPER(pcg.control_group_name) LIKE UPPER('%' || p.rule_name || '%'))
                    AND (p.org_id IS NULL OR pcg.org_id = TO_NUMBER(p.org_id))
                    AND (p.as_of_date IS NULL OR (TRUNC(pcr.creation_date) <= TO_DATE(p.as_of_date, 'YYYY-MM-DD')
                         AND (pcr.inactive_date IS NULL OR pcr.inactive_date > TO_DATE(p.as_of_date, 'YYYY-MM-DD'))))

                  UNION ALL

                  SELECT
                      'EXPENSE' AS policy_category,
                      aerp.prompt AS rule_group,
                      aerp.category_code AS rule_type,
                      aerp.receipt_required_flag AS policy_object,
                      aerp.require_receipt_amount AS threshold_amount,
                      'Amount above which a receipt is required (0 = any amount); applies when policy_object is A' AS threshold_meaning,
                      TO_CHAR(aerp.creation_date, 'YYYY-MM-DD') AS created_date,
                      TO_CHAR(aerp.end_date, 'YYYY-MM-DD') AS effective_end_date,
                      'Org: ' || TO_CHAR(aerp.org_id) AS rule_scope
                  FROM apps.ap_expense_report_params_all aerp
                  CROSS JOIN params p
                  WHERE (p.policy_category IS NULL OR UPPER(p.policy_category) IN ('TRAVEL', 'EXPENSE', 'ALL'))
                    AND (p.rule_name IS NULL OR UPPER(aerp.prompt) LIKE UPPER('%' || p.rule_name || '%'))
                    AND (p.org_id IS NULL OR aerp.org_id = TO_NUMBER(p.org_id))
                    AND (p.as_of_date IS NULL OR (TRUNC(aerp.creation_date) <= TO_DATE(p.as_of_date, 'YYYY-MM-DD')
                         AND (aerp.end_date IS NULL OR aerp.end_date > TO_DATE(p.as_of_date, 'YYYY-MM-DD'))))
              )
              ORDER BY policy_category, rule_group
              FETCH FIRST 200 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ebs_search_policy_attachments:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Searches the EBS attachment store for agency policy bulletins, administrative guidelines and SOP documents by keyword, document category and entity. Returns one row per document, metadata only: category, data type, title, summary, file name or URL, MIME type, size, how many records it is attached to (attachment_count), the date the document was added (created_date), last update, and its active dates (effective_from, effective_to; often empty). At most 20, newest first.
      created_date is not an effective date. The attachment store holds every kind of attachment, so narrow with policy_category (e.g. 'Standard Operating Procedures') or entity_name when possible. Fetch a document's file with ebs_get_document_attachment.
      Underlying Tables: FND_ATTACHED_DOCUMENTS, FND_DOCUMENTS, FND_DOCUMENTS_TL, FND_DOCUMENT_CATEGORIES_TL, FND_DOCUMENT_DATATYPES, FND_LOBS.
      Security Context: Per-user security only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: keyword
      type: string
      description: Search keyword or policy topic, matched against title, description
        and file name. Empty string = any.
    - name: policy_category
      type: string
      description: Document category name or part of it (e.g. 'Standard Operating
        Procedures'), matched against the attachment category. Empty string = any.
    - name: entity_name
      type: string
      description: Optional entity the documents are attached to (use ebs_list_attachment_entities).
        Empty string = any.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :keyword AS keyword,
                      :policy_category AS policy_category,
                      :entity_name AS entity_name
                  FROM dual
              )
              -- One row per document (a document can be attached to many records; attachment_count
              -- says how many). created_date is when the document was added to EBS; effective_from
              -- and effective_to are its active dates and are empty when not maintained.
              SELECT
                  attached_document_id, document_id, entity_name, attachment_count, document_category,
                  document_datatype, policy_title, policy_summary, file_name, url, mime_type,
                  file_size_bytes, created_date, last_updated_date, effective_from, effective_to
              FROM (
              SELECT
                  ROW_NUMBER() OVER (PARTITION BY fd.document_id ORDER BY fad.attached_document_id) AS rn,
                  COUNT(*) OVER (PARTITION BY fd.document_id) AS attachment_count,
                  fd.last_update_date AS sort_date,
                  fad.attached_document_id,
                  fd.document_id,
                  fad.entity_name,
                  cat.user_name AS document_category,
                  dtype.user_name AS document_datatype,
                  fdt.title AS policy_title,
                  fdt.description AS policy_summary,
                  NVL(fl.file_name, fd.file_name) AS file_name,
                  fd.url,
                  fl.file_content_type AS mime_type,
                  DBMS_LOB.GETLENGTH(fl.file_data) AS file_size_bytes,
                  TO_CHAR(fd.creation_date, 'YYYY-MM-DD') AS created_date,
                  TO_CHAR(fd.last_update_date, 'YYYY-MM-DD') AS last_updated_date,
                  TO_CHAR(fd.start_date_active, 'YYYY-MM-DD') AS effective_from,
                  TO_CHAR(fd.end_date_active, 'YYYY-MM-DD') AS effective_to
              FROM params p
              JOIN apps.fnd_attached_documents fad
                  ON (p.entity_name IS NULL OR fad.entity_name = p.entity_name)
              JOIN apps.fnd_documents fd
                  ON fad.document_id = fd.document_id
              LEFT JOIN apps.fnd_documents_tl fdt
                  ON fd.document_id = fdt.document_id
                 AND fdt.language = USERENV('LANG')
              LEFT JOIN apps.fnd_document_categories_tl cat
                  ON cat.category_id = NVL(fad.category_id, fd.category_id)
                 AND cat.language = USERENV('LANG')
              LEFT JOIN apps.fnd_document_datatypes dtype
                  ON dtype.datatype_id = fd.datatype_id
                 AND dtype.language = USERENV('LANG')
              LEFT JOIN apps.fnd_lobs fl
                  ON fd.datatype_id = 6
                 AND fd.media_id = fl.file_id
              WHERE (p.policy_category IS NULL OR UPPER(cat.user_name) LIKE UPPER('%' || p.policy_category || '%'))
                AND (p.keyword IS NULL
                  OR UPPER(fdt.title) LIKE UPPER('%' || p.keyword || '%')
                  OR UPPER(fdt.description) LIKE UPPER('%' || p.keyword || '%')
                  OR UPPER(NVL(fl.file_name, fd.file_name)) LIKE UPPER('%' || p.keyword || '%'))
              )
              WHERE rn = 1
              ORDER BY sort_date DESC, document_id DESC
              FETCH FIRST 20 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  policy_and_statute_assistant:
  - ebs_get_agency_policy_rules
  - ebs_search_policy_attachments
