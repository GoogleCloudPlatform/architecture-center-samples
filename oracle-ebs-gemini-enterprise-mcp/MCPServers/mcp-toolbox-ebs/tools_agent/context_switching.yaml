# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_change_my_context:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Changes the EBS context (operating unit, responsibility, application) the signed-in user's tools run under. THIS CHANGES STATE: a context EBS accepts is stored and used for all of the user's later calls until it is changed again or reset with ebs_reset_my_context.
      Returns one JSON text in column RESULT: {"STATUS":"SUCCESS",...} or {"STATUS":"ERROR","MESSAGE":"..."}. On an error nothing is stored and the previous context stays. The user is always the signed-in user (user_id); only their own responsibilities and operating units are accepted.
      Find the inputs first with ebs_list_my_responsibilities and ebs_list_my_operating_units, give at least one value, and check the result with ebs_get_my_context. Values left empty fall back to the default, they do not keep an earlier choice. The context decides what the transaction tools (ebs_reserve_item, ebs_create_ap_invoice, ...) see and write.
      Underlying package: APPS.XX_AI_SECURITY_PKG.SET_CONTEXT (wraps EBS_INITIALIZE_CONTEXT).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: operating_unit
      type: string
      description: Operating unit name, from ebs_list_my_operating_units. Empty string
        = the default operating unit of the responsibility.
    - name: responsibility
      type: string
      description: Responsibility name, from ebs_list_my_responsibilities. Empty string
        = the user's first responsibility.
    - name: application_short_name
      type: string
      description: Application short name, from ebs_list_my_responsibilities (e.g.
        'INV', 'SQLAP'). Empty string = the application of the responsibility.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :operating_unit AS operating_unit,
                      :responsibility AS responsibility,
                      :application_short_name AS application_short_name
                  FROM dual
              )
              SELECT apps.xx_ai_security_pkg.set_context(p.operating_unit, p.responsibility, p.application_short_name) AS result
              FROM params p;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_reset_my_context:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Forgets the context chosen with ebs_change_my_context and returns the signed-in user to their default operating unit and responsibility. THIS CHANGES STATE: the stored choice is deleted.
      Returns one JSON text in column RESULT: {"STATUS":"SUCCESS",...} or {"STATUS":"ERROR","MESSAGE":"..."}. Check the result with ebs_get_my_context.
      Underlying package: APPS.XX_AI_SECURITY_PKG.RESET_CONTEXT.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              SELECT apps.xx_ai_security_pkg.reset_context AS result FROM dual;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  context_switching:
  - ebs_change_my_context
  - ebs_reset_my_context
