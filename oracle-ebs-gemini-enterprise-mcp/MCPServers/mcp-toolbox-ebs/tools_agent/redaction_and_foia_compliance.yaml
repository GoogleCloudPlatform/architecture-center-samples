# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_search_foia_records:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Searches discoverable case records, HR employee files, vendor agreements, and correspondence across EBS modules by date, party, or keyword.
      Underlying Tables: PER_ALL_PEOPLE_F, PO_HEADERS_ALL, PO_LINES_ALL, AP_INVOICES_ALL, FND_ATTACHED_DOCUMENTS.
      APIs: APPS_AI.EBS_FOIA_SEARCH_PKG.SEARCH_DOCUMENTS.
      Security Context: Cross-module discovery context; filtered by agency tenant Org ID.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: query_keyword
      type: string
      description: Keyword, party name, or solicitation identifier for discovery search.
    - name: start_date
      type: string
      description: Discovery date window start in YYYY-MM-DD format.
    - name: end_date
      type: string
      description: Discovery date window end in YYYY-MM-DD format.
    - name: org_id
      type: integer
      description: Agency tenant Operating Unit / Organization ID to filter discovery.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :query_keyword AS query_keyword,
                      :start_date AS start_date,
                      :end_date AS end_date,
                      :org_id AS org_id
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      'PO' AS source_module,
                      TO_CHAR(po.po_header_id) AS record_id,
                      po.segment1 AS document_number,
                      po.type_lookup_code AS document_type,
                      TO_CHAR(po.creation_date, 'YYYY-MM-DD') AS creation_date,
                      po.org_id,
                      vend.vendor_name AS party_name,
                      po.comments AS record_summary
                  FROM params p
                  JOIN apps.po_headers_all po
                      ON (p.start_date IS NULL OR po.creation_date >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR po.creation_date <= TO_DATE(p.end_date, 'YYYY-MM-DD') + 1)
                     AND (p.org_id IS NULL OR po.org_id = TO_NUMBER(p.org_id))
                  LEFT JOIN apps.ap_suppliers vend
                      ON po.vendor_id = vend.vendor_id
                  WHERE (p.query_keyword IS NULL
                      OR UPPER(po.segment1) LIKE UPPER('%' || p.query_keyword || '%')
                      OR UPPER(po.comments) LIKE UPPER('%' || p.query_keyword || '%')
                      OR UPPER(vend.vendor_name) LIKE UPPER('%' || p.query_keyword || '%'))

                  UNION ALL

                  SELECT
                      'AP' AS source_module,
                      TO_CHAR(inv.invoice_id) AS record_id,
                      inv.invoice_num AS document_number,
                      inv.invoice_type_lookup_code AS document_type,
                      TO_CHAR(inv.creation_date, 'YYYY-MM-DD') AS creation_date,
                      inv.org_id,
                      inv_vend.vendor_name AS party_name,
                      inv.description AS record_summary
                  FROM params p
                  JOIN apps.ap_invoices_all inv
                      ON (p.start_date IS NULL OR inv.creation_date >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR inv.creation_date <= TO_DATE(p.end_date, 'YYYY-MM-DD') + 1)
                     AND (p.org_id IS NULL OR inv.org_id = TO_NUMBER(p.org_id))
                  LEFT JOIN apps.ap_suppliers inv_vend
                      ON inv.vendor_id = inv_vend.vendor_id
                  WHERE (p.query_keyword IS NULL
                      OR UPPER(inv.invoice_num) LIKE UPPER('%' || p.query_keyword || '%')
                      OR UPPER(inv.description) LIKE UPPER('%' || p.query_keyword || '%')
                      OR UPPER(inv_vend.vendor_name) LIKE UPPER('%' || p.query_keyword || '%'))

                  UNION ALL

                  SELECT
                      'HR' AS source_module,
                      TO_CHAR(papf.person_id) AS record_id,
                      papf.employee_number AS document_number,
                      'PERSONNEL' AS document_type,
                      TO_CHAR(papf.creation_date, 'YYYY-MM-DD') AS creation_date,
                      papf.business_group_id AS org_id,
                      papf.full_name AS party_name,
                      'Title: ' || paaf.title || ' | Assignment: ' || paaf.assignment_number AS record_summary
                  FROM params p
                  JOIN apps.per_all_people_f papf
                      ON TRUNC(SYSDATE) BETWEEN papf.effective_start_date AND papf.effective_end_date
                     AND (p.start_date IS NULL OR papf.creation_date >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR papf.creation_date <= TO_DATE(p.end_date, 'YYYY-MM-DD') + 1)
                  LEFT JOIN apps.per_all_assignments_f paaf
                      ON papf.person_id = paaf.person_id
                     AND TRUNC(SYSDATE) BETWEEN paaf.effective_start_date AND paaf.effective_end_date
                  WHERE (p.query_keyword IS NULL
                      OR UPPER(papf.full_name) LIKE UPPER('%' || p.query_keyword || '%')
                      OR UPPER(papf.employee_number) LIKE UPPER('%' || p.query_keyword || '%'))
              )
              ORDER BY creation_date DESC
              FETCH FIRST 100 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_employee_personnel_file:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Retrieves employee personnel files, performance reviews, and absence documentation from EBS HRMS.
      Underlying Tables: PER_ALL_PEOPLE_F, PER_ALL_ASSIGNMENTS_F, PER_PERFORMANCE_REVIEWS, PER_ABSENCE_ATTENDANCES, FND_LOBS.
      APIs: HR_PERSON_API.GET_PERSON_DETAILS, View: APPS_AI.VW_FOIA_PERSONNEL_FILE.
      Security Context: Security profile context (fnd_profile.value('PER_SECURITY_PROFILE_ID')).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: person_id
      type: integer
      description: Unique identifier of the employee in HRMS (PER_ALL_PEOPLE_F.PERSON_ID).
    - name: employee_number
      type: string
      description: Agency employee badge or identification number.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :person_id AS person_id,
                      :employee_number AS employee_number
                  FROM dual
              )
              SELECT
                  papf.person_id,
                  papf.employee_number,
                  papf.full_name,
                  papf.first_name,
                  papf.last_name,
                  papf.national_identifier AS ssn_tax_id,
                  TO_CHAR(papf.date_of_birth, 'YYYY-MM-DD') AS date_of_birth,
                  paaf.assignment_number,
                  paaf.job_id,
                  ppr.performance_review_id,
                  ppr.performance_rating,
                  TO_CHAR(ppr.review_date, 'YYYY-MM-DD') AS review_date,
                  paa.absence_attendance_type_id,
                  TO_CHAR(paa.date_start, 'YYYY-MM-DD') AS absence_start_date,
                  TO_CHAR(paa.date_end, 'YYYY-MM-DD') AS absence_end_date
              FROM params p
              JOIN apps.per_all_people_f papf
                  ON TRUNC(SYSDATE) BETWEEN papf.effective_start_date AND papf.effective_end_date
                 AND ((p.person_id IS NOT NULL AND papf.person_id = TO_NUMBER(p.person_id))
                   OR (p.employee_number IS NOT NULL AND papf.employee_number = p.employee_number))
              JOIN apps.per_all_assignments_f paaf
                  ON papf.person_id = paaf.person_id
                 AND TRUNC(SYSDATE) BETWEEN paaf.effective_start_date AND paaf.effective_end_date
              LEFT JOIN apps.per_performance_reviews ppr
                  ON papf.person_id = ppr.person_id
              LEFT JOIN apps.per_absence_attendances paa
                  ON papf.person_id = paa.person_id;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  redaction_and_foia_compliance:
  - ebs_search_foia_records
  - ebs_get_employee_personnel_file
