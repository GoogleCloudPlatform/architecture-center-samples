# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_execute_sql:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Runs any single SELECT (or WITH) statement against the Oracle E-Business Suite R12.2 database and returns the rows.
      The statement runs under the security context of the signed-in user (user_id), so row and
      organisation security apply as for that user. Use fully qualified table names (e.g. apps.).
      Only queries are supported. Prefer the specific tools when one fits, and check column names
      before writing a query. A trailing ';' is ignored.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: sql
      type: string
      description: A single SELECT (or WITH) statement to run. No trailing ';'.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              RTRIM(:sql, ';' || CHR(9) || CHR(10) || CHR(13) || ' ');


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  execute_sql:
  - ebs_execute_sql
