# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_get_constituent_notice_details:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Queries one AR transaction (determination, overpayment notice or billing adjustment): the customer, each invoice line with its reason code and meaning, the original and outstanding balance summed over all installments, and the grant award that billed it when the transaction came from Grants Accounting.
      This returns an individual's account data (name, account number, balances); the plain_language_notice_generator skill handles population-level notices only, so use this tool only where individual determinations are in scope.
      Underlying Tables: RA_CUSTOMER_TRX_ALL, RA_CUSTOMER_TRX_LINES_ALL, AR_PAYMENT_SCHEDULES_ALL, HZ_CUST_ACCOUNTS, HZ_PARTIES, AR_LOOKUPS (INVOICING_REASON), PA_PROJECTS_ALL, GMS_AWARDS_ALL.
      Security Context: Operating unit filter (org_id); per-user security only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: transaction_id
      type: string
      description: Customer transaction ID or transaction number (e.g., Claim / Determination
        ID).
    - name: org_id
      type: string
      description: Operating unit ID. Empty string = any operating unit.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :transaction_id AS transaction_id,
                      :org_id AS org_id
                  FROM dual
              )
              -- Balances are summed over the transaction's payment schedules (installments), and the
              -- award is the one whose award project billed this invoice (Grants invoices carry the
              -- project number in INTERFACE_HEADER_ATTRIBUTE1), so each invoice line is one row.
              SELECT
                  trx.customer_trx_id,
                  trx.trx_number,
                  TO_CHAR(trx.trx_date, 'YYYY-MM-DD') AS notice_date,
                  trx.org_id,
                  party.party_name AS constituent_name,
                  cust.account_number,
                  lines.line_number,
                  lines.line_type,
                  lines.description AS statutory_description,
                  lines.extended_amount AS line_amount,
                  lines.reason_code,
                  rsn.meaning AS reason_meaning,
                  sched.amount_due_original AS total_overpayment_amount,
                  sched.amount_due_remaining AS outstanding_balance,
                  sched.payment_status,
                  sched.installment_count,
                  gms.award_number,
                  gms.award_full_name AS award_name
              FROM params p
              JOIN apps.ra_customer_trx_all trx
                  ON (TO_CHAR(trx.customer_trx_id) = p.transaction_id OR trx.trx_number = p.transaction_id)
                 AND (p.org_id IS NULL OR trx.org_id = TO_NUMBER(p.org_id))
              JOIN apps.ra_customer_trx_lines_all lines
                  ON trx.customer_trx_id = lines.customer_trx_id
              JOIN (
                  SELECT
                      customer_trx_id,
                      SUM(amount_due_original) AS amount_due_original,
                      SUM(amount_due_remaining) AS amount_due_remaining,
                      CASE WHEN MIN(status) = MAX(status) THEN MIN(status) ELSE 'MIXED' END AS payment_status,
                      COUNT(*) AS installment_count
                  FROM apps.ar_payment_schedules_all
                  GROUP BY customer_trx_id
              ) sched
                  ON trx.customer_trx_id = sched.customer_trx_id
              JOIN apps.hz_cust_accounts cust
                  ON trx.bill_to_customer_id = cust.cust_account_id
              JOIN apps.hz_parties party
                  ON cust.party_id = party.party_id
              LEFT JOIN apps.ar_lookups rsn
                  ON rsn.lookup_type = 'INVOICING_REASON'
                 AND rsn.lookup_code = lines.reason_code
              LEFT JOIN apps.pa_projects_all ppa
                  ON trx.interface_header_context IN ('PROJECTS INVOICES', 'PA INVOICES')
                 AND ppa.segment1 = trx.interface_header_attribute1
              LEFT JOIN apps.gms_awards_all gms
                  ON gms.award_project_id = ppa.project_id
              ORDER BY lines.line_number;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_document_attachment:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Retrieves one attached document (for example a determination letter or decision PDF) from the EBS attachment store: category, data type, title, description, file name or URL, MIME type, size and the file data.
      The file data is binary (PDF, Word, image), not text. Only file attachments have file data; text and web-page attachments return their type and URL only. attachment_count shows how many records the same document is attached to.
      Underlying Tables: FND_DOCUMENTS, FND_ATTACHED_DOCUMENTS, FND_DOCUMENTS_TL, FND_DOCUMENT_CATEGORIES_TL, FND_DOCUMENT_DATATYPES, FND_LOBS.
      Security Context: Per-user security only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: document_id
      type: string
      description: Document identifier (FND_DOCUMENTS.DOCUMENT_ID).
    - name: entity_name
      type: string
      description: Optional entity the document is attached to (e.g. RA_CUSTOMER_TRX_ALL).
        Empty string = any.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :document_id AS document_id,
                      :entity_name AS entity_name
                  FROM dual
              )
              -- A document can be attached to several records; the lowest attached_document_id is
              -- returned and attachment_count says how many attachments share the document.
              SELECT
                  fad.attached_document_id,
                  fd.document_id,
                  fad.entity_name,
                  fad.pk1_value AS entity_pk1,
                  COUNT(*) OVER () AS attachment_count,
                  cat.user_name AS document_category,
                  dtype.user_name AS document_datatype,
                  fdt.title AS document_name,
                  fdt.description AS document_description,
                  NVL(fl.file_name, fd.file_name) AS file_name,
                  fd.url,
                  fl.file_content_type AS mime_type,
                  fl.file_format,
                  DBMS_LOB.GETLENGTH(fl.file_data) AS file_size_bytes,
                  fl.file_data
              FROM params p
              JOIN apps.fnd_documents fd
                  ON fd.document_id = TO_NUMBER(p.document_id)
              JOIN apps.fnd_attached_documents fad
                  ON fad.document_id = fd.document_id
                 AND (p.entity_name IS NULL OR fad.entity_name = p.entity_name)
              LEFT JOIN apps.fnd_documents_tl fdt
                  ON fd.document_id = fdt.document_id
                 AND fdt.language = USERENV('LANG')
              LEFT JOIN apps.fnd_document_categories_tl cat
                  ON cat.category_id = fd.category_id
                 AND cat.language = USERENV('LANG')
              LEFT JOIN apps.fnd_document_datatypes dtype
                  ON dtype.datatype_id = fd.datatype_id
                 AND dtype.language = USERENV('LANG')
              LEFT JOIN apps.fnd_lobs fl
                  ON fd.datatype_id = 6
                 AND fd.media_id = fl.file_id
              ORDER BY fad.attached_document_id
              FETCH FIRST 1 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  plain_language_notice_generator:
  - ebs_get_constituent_notice_details
  - ebs_get_document_attachment
