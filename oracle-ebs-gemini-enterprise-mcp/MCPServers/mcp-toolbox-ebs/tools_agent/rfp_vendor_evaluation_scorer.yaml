# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_get_sourcing_rfp_details:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Queries one Oracle Sourcing negotiation (RFP, RFQ, RFI or auction) by header ID or document number: document type, title, status, sealed-bid visibility, amendment number and the latest amendment number (an amended solicitation is a new negotiation version), open and close dates, then one row per item line (record_type LINE) and one row per requirement (record_type REQUIREMENT) with section, text, mandatory flag, weight, scoring type and method, maximum and knockout score.
      Requirements with requirement_line_number -1 apply to the whole solicitation. Requirement rows describe the published criteria; the evaluation itself and any scores are not returned.
      Underlying Tables: PON_AUCTION_HEADERS_ALL, PON_AUC_DOCTYPES, PON_AUCTION_ITEM_PRICES_ALL, PON_AUCTION_ATTRIBUTES.
      Security Context: Per-user security only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: auction_header_id
      type: string
      description: Sourcing negotiation header ID (PON_AUCTION_HEADERS_ALL.AUCTION_HEADER_ID).
        Empty string = look up by rfp_number.
    - name: rfp_number
      type: string
      description: Solicitation document number (PON_AUCTION_HEADERS_ALL.DOCUMENT_NUMBER).
        Empty string = look up by auction_header_id.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :auction_header_id AS auction_header_id,
                      :rfp_number AS rfp_number
                  FROM dual
              )
              -- Lines and requirements are separate record types (record_type LINE or REQUIREMENT) so
              -- they don't multiply each other. Requirements with requirement_line_number -1 apply to
              -- the whole solicitation; others apply to that line.
              SELECT
                  paha.auction_header_id,
                  paha.document_number AS rfp_number,
                  dt.internal_name AS document_type,
                  paha.auction_title,
                  paha.auction_status,
                  paha.bid_visibility_code,
                  paha.amendment_number,
                  paha.amendment_description,
                  (SELECT MAX(a.amendment_number)
                     FROM apps.pon_auction_headers_all a
                    WHERE NVL(a.auction_header_id_orig_amend, a.auction_header_id) = NVL(paha.auction_header_id_orig_amend, paha.auction_header_id)
                      AND a.auction_status <> 'DELETED') AS latest_amendment_number,
                  TO_CHAR(paha.open_bidding_date, 'YYYY-MM-DD HH24:MI:SS') AS open_date,
                  TO_CHAR(paha.close_bidding_date, 'YYYY-MM-DD HH24:MI:SS') AS close_date,
                  rec.record_type,
                  rec.item_line_number,
                  rec.item_description,
                  rec.required_quantity,
                  rec.unit_of_measure,
                  rec.requirement_line_number,
                  rec.section_name,
                  rec.scoring_criteria_id,
                  rec.criteria_name,
                  rec.criteria_description,
                  rec.mandatory_flag,
                  rec.weight_percent,
                  rec.scoring_type,
                  rec.scoring_method,
                  rec.max_score,
                  rec.knockout_score,
                  rec.internal_only_flag
              FROM params p
              JOIN apps.pon_auction_headers_all paha
                  ON (p.auction_header_id IS NOT NULL AND paha.auction_header_id = TO_NUMBER(p.auction_header_id))
                  OR (p.auction_header_id IS NULL AND p.rfp_number IS NOT NULL AND paha.document_number = p.rfp_number)
              LEFT JOIN apps.pon_auc_doctypes dt
                  ON dt.doctype_id = paha.doctype_id
              LEFT JOIN (
                  SELECT
                      paip.auction_header_id,
                      'LINE' AS record_type,
                      paip.line_number AS item_line_number,
                      paip.item_description,
                      paip.quantity AS required_quantity,
                      paip.unit_of_measure,
                      TO_NUMBER(NULL) AS requirement_line_number,
                      NULL AS section_name,
                      TO_NUMBER(NULL) AS scoring_criteria_id,
                      NULL AS criteria_name,
                      NULL AS criteria_description,
                      NULL AS mandatory_flag,
                      TO_NUMBER(NULL) AS weight_percent,
                      NULL AS scoring_type,
                      NULL AS scoring_method,
                      TO_NUMBER(NULL) AS max_score,
                      TO_NUMBER(NULL) AS knockout_score,
                      NULL AS internal_only_flag
                  FROM apps.pon_auction_item_prices_all paip
                  UNION ALL
                  SELECT
                      paa.auction_header_id,
                      'REQUIREMENT' AS record_type,
                      TO_NUMBER(NULL) AS item_line_number,
                      NULL AS item_description,
                      TO_NUMBER(NULL) AS required_quantity,
                      NULL AS unit_of_measure,
                      paa.line_number AS requirement_line_number,
                      paa.section_name,
                      paa.sequence_number AS scoring_criteria_id,
                      paa.attribute_name AS criteria_name,
                      NVL(paa.description, paa.help_text) AS criteria_description,
                      paa.mandatory_flag,
                      paa.weight AS weight_percent,
                      paa.scoring_type,
                      paa.scoring_method,
                      paa.attr_max_score AS max_score,
                      paa.knockout_score,
                      paa.internal_attr_flag AS internal_only_flag
                  FROM apps.pon_auction_attributes paa
              ) rec
                  ON rec.auction_header_id = paha.auction_header_id
              ORDER BY rec.record_type, rec.item_line_number, rec.requirement_line_number, rec.section_name, rec.scoring_criteria_id;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_vendor_bids:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Retrieves current vendor bids on an Oracle Sourcing negotiation, one row per bid line: vendor and supplier ID, submission date and whether it came after the close date, the amendment of the solicitation it answered, how many earlier revisions the vendor superseded, the vendor's notes and promised dates, and the titles and document IDs of attached proposal files (per line and per bid; fetch a file with ebs_get_document_attachment).
      Prices and totals are returned only with include_prices = 'Y', so technical evaluators can review without seeing price. Superseded revisions, drafts and disqualified bids are excluded; award, shortlist and score data is not returned. Pass at least one of auction_header_id, bid_number or vendor_name; at most 500 rows.
      Underlying Tables: PON_BID_HEADERS, PON_BID_ITEM_PRICES, PON_AUCTION_HEADERS_ALL, FND_ATTACHED_DOCUMENTS, FND_DOCUMENTS, FND_DOCUMENTS_TL.
      Security Context: Per-user security only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: auction_header_id
      type: string
      description: Sourcing negotiation header ID. Empty string = any negotiation
        (then pass bid_number or vendor_name).
    - name: bid_number
      type: string
      description: Specific bid number (PON_BID_HEADERS.BID_NUMBER). Empty string
        = any.
    - name: vendor_name
      type: string
      description: Part of the bidding vendor's name. Empty string = any.
    - name: include_prices
      type: string
      description: '''Y'' also returns bid prices and totals; anything else leaves
        them empty, for technical review without price.'
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :auction_header_id AS auction_header_id,
                      :bid_number AS bid_number,
                      :vendor_name AS vendor_name,
                      :include_prices AS include_prices
                  FROM dual
              )
              -- Current bids only: superseded revisions (ARCHIVED), drafts and disqualified bids are
              -- excluded, and superseded_revisions counts the vendor's archived revisions on the same
              -- negotiation. Attachments are listed per bid line (entity PON_BID_ITEM_PRICES) and per
              -- bid (PON_BID_HEADERS), keyed by negotiation, bid and line. Award, shortlist and score
              -- columns are deliberately not returned.
              SELECT
                  pbh.bid_number,
                  pbh.auction_header_id,
                  paha.document_number AS rfp_number,
                  paha.amendment_number AS bid_on_amendment_number,
                  pbh.vendor_id,
                  pbh.trading_partner_name AS vendor_name,
                  pbh.vendor_site_code,
                  pbh.bid_status,
                  TO_CHAR(pbh.publish_date, 'YYYY-MM-DD HH24:MI:SS') AS submitted_date,
                  TO_CHAR(paha.close_bidding_date, 'YYYY-MM-DD HH24:MI:SS') AS close_date,
                  CASE WHEN pbh.publish_date > paha.close_bidding_date THEN 'Y' ELSE 'N' END AS submitted_after_close,
                  (SELECT COUNT(*)
                     FROM apps.pon_bid_headers old
                    WHERE old.auction_header_id = pbh.auction_header_id
                      AND old.trading_partner_id = pbh.trading_partner_id
                      AND old.bid_status = 'ARCHIVED') AS superseded_revisions,
                  pbh.note_to_auction_owner AS bid_note,
                  CASE WHEN UPPER(p.include_prices) = 'Y' THEN pbh.buyer_bid_total END AS total_bid_price,
                  CASE WHEN UPPER(p.include_prices) = 'Y' THEN pbh.bid_currency_code END AS bid_currency_code,
                  pbip.line_number,
                  CASE WHEN UPPER(p.include_prices) = 'Y' THEN pbip.price END AS bid_currency_price,
                  TO_CHAR(pbip.promised_date, 'YYYY-MM-DD') AS promise_date,
                  pbip.note_to_auction_owner AS technical_response_summary,
                  (SELECT LISTAGG(NVL(fdt.title, fd.file_name) || ' [document ' || fd.document_id || ']', '; ')
                              WITHIN GROUP (ORDER BY fad.seq_num)
                     FROM apps.fnd_attached_documents fad
                     JOIN apps.fnd_documents fd
                         ON fd.document_id = fad.document_id
                     LEFT JOIN apps.fnd_documents_tl fdt
                         ON fdt.document_id = fd.document_id
                        AND fdt.language = USERENV('LANG')
                    WHERE fad.entity_name = 'PON_BID_ITEM_PRICES'
                      AND fad.pk1_value = TO_CHAR(pbh.auction_header_id)
                      AND fad.pk2_value = TO_CHAR(pbh.bid_number)
                      AND fad.pk3_value = TO_CHAR(pbip.line_number)) AS line_attachments,
                  (SELECT LISTAGG(NVL(fdt.title, fd.file_name) || ' [document ' || fd.document_id || ']', '; ')
                              WITHIN GROUP (ORDER BY fad.seq_num)
                     FROM apps.fnd_attached_documents fad
                     JOIN apps.fnd_documents fd
                         ON fd.document_id = fad.document_id
                     LEFT JOIN apps.fnd_documents_tl fdt
                         ON fdt.document_id = fd.document_id
                        AND fdt.language = USERENV('LANG')
                    WHERE fad.entity_name = 'PON_BID_HEADERS'
                      AND fad.pk1_value = TO_CHAR(pbh.auction_header_id)
                      AND fad.pk2_value = TO_CHAR(pbh.bid_number)) AS bid_attachments
              FROM params p
              JOIN apps.pon_bid_headers pbh
                  ON pbh.bid_status NOT IN ('ARCHIVED', 'DRAFT', 'DISQUALIFIED')
                 AND (p.auction_header_id IS NULL OR pbh.auction_header_id = TO_NUMBER(p.auction_header_id))
                 AND (p.bid_number IS NULL OR pbh.bid_number = TO_NUMBER(p.bid_number))
                 AND (p.vendor_name IS NULL OR UPPER(pbh.trading_partner_name) LIKE UPPER('%' || p.vendor_name || '%'))
                 AND COALESCE(p.auction_header_id, p.bid_number, p.vendor_name) IS NOT NULL
              JOIN apps.pon_auction_headers_all paha
                  ON paha.auction_header_id = pbh.auction_header_id
              LEFT JOIN apps.pon_bid_item_prices pbip
                  ON pbip.bid_number = pbh.bid_number
              ORDER BY pbh.auction_header_id, pbh.bid_number, pbip.line_number
              FETCH FIRST 500 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  rfp_vendor_evaluation_scorer:
  - ebs_get_sourcing_rfp_details
  - ebs_get_vendor_bids
