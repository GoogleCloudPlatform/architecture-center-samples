# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_get_expense_reports:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Retrieves employee travel and operational expense reports with their itemized expense lines, corporate policy setup, policy violation status (and allowable amount) per line, and receipt attachments (header and line level) from Oracle Internet Expenses (OIE) / AP.
      All filters are optional: pass an empty string to leave one off. At most 500 lines are returned. Receipt image data is returned only when include_receipts is 'Y'; otherwise only the attachment name and type come back, which keeps responses small. Use ebs_list_expense_reports to find report and employee IDs.
      Underlying Tables: AP_EXPENSE_REPORT_HEADERS_ALL, AP_EXPENSE_REPORT_LINES_ALL, AP_EXPENSE_REPORT_PARAMS_ALL, AP_POL_HEADERS, AP_POL_VIOLATIONS_ALL, FND_ATTACHED_DOCUMENTS, FND_DOCUMENTS, FND_LOBS.
      Security Context: Financial auditor responsibility context (fnd_global.apps_initialize).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: report_header_id
      type: string
      description: Expense report header ID (AP_EXPENSE_REPORT_HEADERS_ALL.REPORT_HEADER_ID).
        Empty string = any report.
    - name: employee_id
      type: string
      description: Employee person ID who submitted the expense report. Empty string
        = any employee.
    - name: start_date
      type: string
      description: Submission date window start in YYYY-MM-DD format. Empty string
        = no lower bound.
    - name: end_date
      type: string
      description: Submission date window end in YYYY-MM-DD format. Empty string =
        no upper bound.
    - name: include_receipts
      type: string
      description: '''Y'' returns the receipt image data (large); anything else returns
        attachment names only.'
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :report_header_id AS report_header_id,
                      :employee_id AS employee_id,
                      :start_date AS start_date,
                      :end_date AS end_date,
                      :include_receipts AS include_receipts
                  FROM dual
              )
              SELECT
                  aerh.report_header_id,
                  aerh.invoice_num AS report_number,
                  aerh.employee_id,
                  aerh.total AS report_total,
                  aerh.expense_status_code,
                  TO_CHAR(aerh.week_end_date, 'YYYY-MM-DD') AS submission_date,
                  aerl.report_line_id,
                  aerl.distribution_line_number AS line_num,
                  aerl.category_code AS expense_category,
                  aerl.amount AS line_amount,
                  TO_CHAR(aerl.start_expense_date, 'YYYY-MM-DD') AS expense_date,
                  TO_CHAR(aerl.end_expense_date, 'YYYY-MM-DD') AS expense_end_date,
                  aerl.location AS expense_location,
                  aerl.currency_code,
                  aerl.receipt_currency_code,
                  aerl.receipt_currency_amount,
                  aerl.daily_amount,
                  aerl.attendees,
                  aerl.number_attendees,
                  aerl.travel_type,
                  aerl.ticket_class_code,
                  aerl.project_number,
                  aerl.task_number,
                  aerl.award_number,
                  aerl.expenditure_type,
                  aerl.itemization_parent_id,
                  aerl.item_description,
                  aerl.justification,
                  -- Corporate Setup Policies (Shows even if the expense is OK)
                  er_param.prompt AS configured_expense_type,
                  aph.policy_name AS assigned_policy_rule,
                  aph.description AS policy_rule_description,
                  -- Status Flag (Checks if a violation actually occurred)
                  CASE
                      WHEN apv.violation_type IS NOT NULL THEN 'VIOLATED: ' || apv.violation_type
                      ELSE 'OK'
                  END AS policy_status,
                  apv.allowable_amount,
                  apv.exceeded_amount,
                  apv.dup_report_header_id,
                  apv.dup_report_line_id,
                  -- Receipt rules (setup for the expense type, the value copied onto the line, and the line's receipt status)
                  er_param.receipt_required_flag AS type_receipt_required_flag,
                  er_param.require_receipt_amount AS type_require_receipt_amount,
                  aerl.receipt_required_flag AS line_receipt_required_flag,
                  aerl.receipt_missing_flag,
                  aerl.receipt_verified_flag,
                  aerl.image_receipt_required_flag,
                  -- Attachment Metadata
                  fad.entity_name AS attachment_level,
                  fdt.title AS attachment_title,
                  fdt.description AS attachment_description,
                  fl.file_name AS receipt_file_name,
                  fl.file_content_type AS receipt_mime_type,
                  CASE WHEN UPPER(p.include_receipts) = 'Y' THEN fl.file_data END AS receipt_image_blob
              FROM params p
              JOIN apps.ap_expense_report_headers_all aerh
                  ON (p.report_header_id IS NULL OR aerh.report_header_id = TO_NUMBER(p.report_header_id))
                 AND (p.employee_id IS NULL OR aerh.employee_id = TO_NUMBER(p.employee_id))
                 AND (p.start_date IS NULL OR aerh.week_end_date >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                 AND (p.end_date IS NULL OR aerh.week_end_date <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
              JOIN apps.ap_expense_report_lines_all aerl
                  ON aerh.report_header_id = aerl.report_header_id
              -- 1. Bridge line item to the setup parameters of the template used
              LEFT JOIN apps.ap_expense_report_params_all er_param
                  ON aerl.web_parameter_id = er_param.parameter_id
              -- 2. Pull the policy rule tied to that template parameter setup
              LEFT JOIN apps.ap_pol_headers aph
                  ON er_param.company_policy_id = aph.policy_id
              -- 3. Match composite key (header_id + distribution_line_number) for violations
              LEFT JOIN apps.ap_pol_violations_all apv
                  ON aerl.report_header_id = apv.report_header_id
                 AND aerl.distribution_line_number = apv.distribution_line_number
              -- 4. Dual check for either Header or Line level iExpense attachments
              LEFT JOIN apps.fnd_attached_documents fad
                  ON (fad.entity_name = 'OIE_HEADER_ATTACHMENTS' AND fad.pk1_value = TO_CHAR(aerh.report_header_id))
                  OR (fad.entity_name = 'OIE_LINE_ATTACHMENTS' AND fad.pk1_value = TO_CHAR(aerl.report_line_id))
              LEFT JOIN apps.fnd_documents fd
                  ON fad.document_id = fd.document_id
              LEFT JOIN apps.fnd_documents_tl fdt
                  ON fd.document_id = fdt.document_id
                 AND fdt.language = USERENV('LANG')
              LEFT JOIN apps.fnd_lobs fl
                  ON fd.media_id = fl.file_id
              ORDER BY aerh.report_header_id, aerl.distribution_line_number
              FETCH FIRST 500 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_po_invoice_match:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Retrieves purchase order distributions, matched invoice lines, receiving receipts, and 2 CFR 200 grant project codes from EBS Payables and Purchasing. All three parameters are optional (empty string = no filter) and at most 200 lines are returned.
      Underlying Tables: AP_INVOICES_ALL, AP_INVOICE_LINES_ALL, AP_INVOICE_DISTRIBUTIONS_ALL, PO_HEADERS_ALL, PO_LINES_ALL, RCV_TRANSACTIONS, GMS_AWARD_DISTRIBUTIONS.
      Security Context: Org ID security context; AP auditor role.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: invoice_id
      type: string
      description: Accounts payable invoice ID (AP_INVOICES_ALL.INVOICE_ID). Empty
        string = any invoice.
    - name: po_header_id
      type: string
      description: Purchase order header ID (PO_HEADERS_ALL.PO_HEADER_ID). Empty string
        = any purchase order.
    - name: po_number
      type: string
      description: Purchase order reference number string. Empty string = any purchase
        order number.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :invoice_id AS invoice_id,
                      :po_header_id AS po_header_id,
                      :po_number AS po_number
                  FROM dual
              )
              SELECT
                  aia.invoice_id,
                  aia.invoice_num,
                  TO_CHAR(aia.invoice_date, 'YYYY-MM-DD') AS invoice_date,
                  aia.invoice_amount,
                  pha.po_header_id,
                  pha.segment1 AS po_number,
                  pla.line_num AS po_line_number,
                  pla.quantity AS quantity_ordered,
                  pla.unit_price AS po_unit_price,
                  aila.line_number AS invoice_line_number,
                  aila.quantity_invoiced,
                  aila.amount AS invoice_line_amount,
                  rcv.quantity AS quantity_received,
                  (NVL(aila.amount, 0) - (NVL(pla.unit_price, 0) * NVL(rcv.quantity, 0))) AS match_variance,
                  gad.award_id,
                  gad.project_id,
                  gad.task_id
              FROM params p
              JOIN apps.ap_invoices_all aia
                  ON (p.invoice_id IS NULL OR aia.invoice_id = TO_NUMBER(p.invoice_id))
              JOIN apps.ap_invoice_lines_all aila
                  ON aia.invoice_id = aila.invoice_id
              LEFT JOIN apps.po_headers_all pha
                  ON aila.po_header_id = pha.po_header_id
                 AND (p.po_header_id IS NULL OR pha.po_header_id = TO_NUMBER(p.po_header_id))
                 AND (p.po_number IS NULL OR pha.segment1 = p.po_number)
              LEFT JOIN apps.po_lines_all pla
                  ON aila.po_line_id = pla.po_line_id
              LEFT JOIN apps.rcv_transactions rcv
                  ON aila.rcv_transaction_id = rcv.transaction_id
              LEFT JOIN apps.ap_invoice_distributions_all aida
                  ON aila.invoice_id = aida.invoice_id
                 AND aila.line_number = aida.invoice_line_number
              LEFT JOIN apps.gms_award_distributions gad
                  ON aida.invoice_distribution_id = gad.invoice_distribution_id
              WHERE (p.po_header_id IS NULL AND p.po_number IS NULL) OR pha.po_header_id IS NOT NULL
              ORDER BY aia.invoice_id, aila.line_number
              FETCH FIRST 200 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_list_expense_reports:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists expense reports (one row per report, no line items or receipts) so an auditor can find reports to review.
      Every parameter is optional: pass an empty string to leave a filter off. Returns 50 reports per call, newest first, with the submitting employee (ID and name), total, status, line count, policy violation count, lines flagged receipt missing, lines whose required receipt is not verified, and the number of electronic attachments.
      Paging: total_matches is the number of reports that match the filters, and more_rows_follow is 'Y' when more remain. Pass offset 50, 100, ... to fetch the next pages.
      Use this tool to discover valid values for :report_header_id and :employee_id before calling ebs_get_expense_reports.
      Underlying Tables: AP_EXPENSE_REPORT_HEADERS_ALL, AP_EXPENSE_REPORT_LINES_ALL, AP_POL_VIOLATIONS_ALL, FND_ATTACHED_DOCUMENTS, PER_ALL_PEOPLE_F.
      Security Context: Financial auditor responsibility context (fnd_global.apps_initialize).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: org_id
      type: string
      description: Operating unit ID (ORG_ID). Empty string = all operating units.
    - name: employee_id
      type: string
      description: Employee person ID who submitted the report. Empty string = all
        employees.
    - name: status
      type: string
      description: Expense status code, e.g. 'PAID', 'INVOICED', 'REJECTED', 'PENDING_MGRAPPRVL'.
        Empty string = all statuses.
    - name: start_date
      type: string
      description: Submission (week end) date window start in YYYY-MM-DD format. Empty
        string = no lower bound.
    - name: end_date
      type: string
      description: Submission (week end) date window end in YYYY-MM-DD format. Empty
        string = no upper bound.
    - name: min_total
      type: string
      description: Minimum report total, e.g. '500'. Empty string = no minimum.
    - name: offset
      type: string
      description: Number of matching reports to skip, for paging (0 or empty string
        = first page of 50).
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :org_id AS org_id,
                      :employee_id AS employee_id,
                      :status AS status,
                      :start_date AS start_date,
                      :end_date AS end_date,
                      :min_total AS min_total,
                      :offset AS offset_rows
                  FROM dual
              )
              SELECT
                  q.report_header_id,
                  q.report_number,
                  q.org_id,
                  q.employee_id,
                  q.employee_name,
                  q.report_total,
                  q.expense_status_code,
                  q.submission_date,
                  q.line_count,
                  q.policy_violation_count,
                  q.lines_receipt_missing,
                  q.lines_receipt_unverified,
                  q.attachment_count,
                  q.total_matches,
                  q.row_number,
                  CASE WHEN q.total_matches > q.row_number THEN 'Y' ELSE 'N' END AS more_rows_follow
              FROM (
                  SELECT
                      aerh.report_header_id,
                      aerh.invoice_num AS report_number,
                      aerh.org_id,
                      aerh.employee_id,
                      (SELECT MAX(papf.full_name) KEEP (DENSE_RANK LAST ORDER BY papf.effective_start_date)
                         FROM apps.per_all_people_f papf
                        WHERE papf.person_id = aerh.employee_id) AS employee_name,
                      aerh.total AS report_total,
                      aerh.expense_status_code,
                      TO_CHAR(aerh.week_end_date, 'YYYY-MM-DD') AS submission_date,
                      (SELECT COUNT(*)
                         FROM apps.ap_expense_report_lines_all aerl
                        WHERE aerl.report_header_id = aerh.report_header_id) AS line_count,
                      (SELECT COUNT(*)
                         FROM apps.ap_pol_violations_all apv
                        WHERE apv.report_header_id = aerh.report_header_id) AS policy_violation_count,
                      (SELECT COUNT(*)
                         FROM apps.ap_expense_report_lines_all aerl
                        WHERE aerl.report_header_id = aerh.report_header_id
                          AND aerl.receipt_missing_flag = 'Y') AS lines_receipt_missing,
                      (SELECT COUNT(*)
                         FROM apps.ap_expense_report_lines_all aerl
                        WHERE aerl.report_header_id = aerh.report_header_id
                          AND aerl.receipt_required_flag = 'Y'
                          AND NVL(aerl.receipt_verified_flag, 'N') <> 'Y') AS lines_receipt_unverified,
                      (SELECT COUNT(*)
                         FROM apps.fnd_attached_documents fad
                        WHERE (fad.entity_name = 'OIE_HEADER_ATTACHMENTS' AND fad.pk1_value = TO_CHAR(aerh.report_header_id))
                           OR (fad.entity_name = 'OIE_LINE_ATTACHMENTS'
                               AND fad.pk1_value IN (SELECT TO_CHAR(l.report_line_id)
                                                       FROM apps.ap_expense_report_lines_all l
                                                      WHERE l.report_header_id = aerh.report_header_id))) AS attachment_count,
                      COUNT(*) OVER () AS total_matches,
                      ROW_NUMBER() OVER (ORDER BY aerh.week_end_date DESC, aerh.report_header_id DESC) AS row_number,
                      p.offset_rows
                  FROM params p
                  JOIN apps.ap_expense_report_headers_all aerh
                      ON (p.org_id IS NULL OR aerh.org_id = TO_NUMBER(p.org_id))
                     AND (p.employee_id IS NULL OR aerh.employee_id = TO_NUMBER(p.employee_id))
                     AND (p.status IS NULL OR aerh.expense_status_code = p.status)
                     AND (p.start_date IS NULL OR aerh.week_end_date >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR aerh.week_end_date <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                     AND (p.min_total IS NULL OR aerh.total >= TO_NUMBER(p.min_total))
              ) q
              WHERE q.row_number > NVL(TO_NUMBER(q.offset_rows), 0)
                AND q.row_number <= NVL(TO_NUMBER(q.offset_rows), 0) + 50
              ORDER BY q.row_number;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_find_duplicate_expense_lines:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Finds expense lines that look duplicated, to support duplicate-billing and cloned-claim review.
      Returns two kinds of matches, labelled in match_type. SAME_LINE_ACROSS_REPORTS: one employee, same expense type, amount and justification text on two or more different reports (a recurring or copied line). SAME_DAY_SAME_AMOUNT: one employee, same expense type, amount and expense date on two or more lines (a possible double entry). Largest total first, at most 100 groups.
      All parameters are optional: pass an empty string to leave a filter off. Use min_amount to ignore small lines. A match is a lead to review, not proof of a duplicate; compare receipts and dates before concluding.
      Underlying Tables: AP_EXPENSE_REPORT_HEADERS_ALL, AP_EXPENSE_REPORT_LINES_ALL, AP_EXPENSE_REPORT_PARAMS_ALL, PER_ALL_PEOPLE_F.
      Security Context: Financial auditor responsibility context (fnd_global.apps_initialize).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: org_id
      type: string
      description: Operating unit ID (ORG_ID). Empty string = all operating units.
    - name: start_date
      type: string
      description: Submission (week end) date window start in YYYY-MM-DD format. Empty
        string = no lower bound.
    - name: end_date
      type: string
      description: Submission (week end) date window end in YYYY-MM-DD format. Empty
        string = no upper bound.
    - name: min_amount
      type: string
      description: Ignore lines below this amount, e.g. '100'. Empty string = include
        all amounts.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :org_id AS org_id,
                      :start_date AS start_date,
                      :end_date AS end_date,
                      :min_amount AS min_amount
                  FROM dual
              ),
              base AS (
                  SELECT
                      aerh.report_header_id,
                      aerh.invoice_num,
                      aerh.employee_id,
                      aerh.week_end_date,
                      aerl.report_line_id,
                      aerl.amount,
                      aerl.start_expense_date,
                      aerl.justification,
                      NVL(er_param.prompt, aerl.category_code) AS expense_type
                  FROM params p
                  JOIN apps.ap_expense_report_headers_all aerh
                      ON (p.org_id IS NULL OR aerh.org_id = TO_NUMBER(p.org_id))
                     AND (p.start_date IS NULL OR aerh.week_end_date >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR aerh.week_end_date <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  JOIN apps.ap_expense_report_lines_all aerl
                      ON aerl.report_header_id = aerh.report_header_id
                     AND (p.min_amount IS NULL OR aerl.amount >= TO_NUMBER(p.min_amount))
                  LEFT JOIN apps.ap_expense_report_params_all er_param
                      ON aerl.web_parameter_id = er_param.parameter_id
              )
              SELECT * FROM (
                  SELECT
                      d.match_type,
                      d.employee_id,
                      (SELECT MAX(papf.full_name) KEEP (DENSE_RANK LAST ORDER BY papf.effective_start_date)
                         FROM apps.per_all_people_f papf
                        WHERE papf.person_id = d.employee_id) AS employee_name,
                      d.expense_type,
                      d.line_amount,
                      d.justification,
                      d.expense_date,
                      d.report_count,
                      d.line_count,
                      d.total_amount,
                      d.first_submitted,
                      d.last_submitted,
                      d.reports
                  FROM (
                      SELECT
                          'SAME_LINE_ACROSS_REPORTS' AS match_type,
                          b.employee_id,
                          b.expense_type,
                          b.amount AS line_amount,
                          b.justification,
                          CAST(NULL AS VARCHAR2(10)) AS expense_date,
                          COUNT(DISTINCT b.report_header_id) AS report_count,
                          COUNT(*) AS line_count,
                          SUM(b.amount) AS total_amount,
                          TO_CHAR(MIN(b.week_end_date), 'YYYY-MM-DD') AS first_submitted,
                          TO_CHAR(MAX(b.week_end_date), 'YYYY-MM-DD') AS last_submitted,
                          LISTAGG(b.invoice_num, ', ' ON OVERFLOW TRUNCATE '...') WITHIN GROUP (ORDER BY b.week_end_date) AS reports
                      FROM base b
                      GROUP BY b.employee_id, b.expense_type, b.amount, b.justification
                      HAVING COUNT(DISTINCT b.report_header_id) >= 2
                      UNION ALL
                      SELECT
                          'SAME_DAY_SAME_AMOUNT' AS match_type,
                          b.employee_id,
                          b.expense_type,
                          b.amount AS line_amount,
                          MAX(b.justification) AS justification,
                          TO_CHAR(b.start_expense_date, 'YYYY-MM-DD') AS expense_date,
                          COUNT(DISTINCT b.report_header_id) AS report_count,
                          COUNT(*) AS line_count,
                          SUM(b.amount) AS total_amount,
                          TO_CHAR(MIN(b.week_end_date), 'YYYY-MM-DD') AS first_submitted,
                          TO_CHAR(MAX(b.week_end_date), 'YYYY-MM-DD') AS last_submitted,
                          LISTAGG(b.invoice_num, ', ' ON OVERFLOW TRUNCATE '...') WITHIN GROUP (ORDER BY b.week_end_date) AS reports
                      FROM base b
                      GROUP BY b.employee_id, b.expense_type, b.amount, b.start_expense_date
                      HAVING COUNT(*) >= 2
                  ) d
                  ORDER BY d.total_amount DESC, d.employee_id
              )
              FETCH FIRST 100 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_award_terms:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Retrieves grant award terms from Oracle Grants Accounting: number, name, status, type, purpose, sponsor award number, active period (start, end, close date), award manager, funded direct and indirect amounts from the installments, and the current budget totals.
      period_status compares the award period with as_of_date (empty string = today) as WITHIN_PERIOD, NOT_STARTED or PAST_END_DATE, so an expense date can be tested against the period of performance.
      Use this tool to find the award behind an expense line (see award_number on ebs_get_expense_reports) before testing allowability. All parameters are optional: pass an empty string to leave a filter off. Returns at most 50 awards.
      The sponsor and funding-source tables are not readable by this database user, so only funding_source_id and sponsor_award_number are returned; whether an award is federal, state or local must be confirmed from the award documents.
      Underlying Tables: GMS_AWARDS_ALL, GMS_INSTALLMENTS, GMS_BUDGET_VERSIONS, PER_ALL_PEOPLE_F.
      Security Context: Standard APPS schema access; Org ID security context.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: org_id
      type: string
      description: Operating unit ID (ORG_ID). Empty string = all operating units.
    - name: award_number
      type: string
      description: Full or partial award number or name. Empty string = all awards.
    - name: as_of_date
      type: string
      description: Date to test the award period against, YYYY-MM-DD. Empty string
        = today.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :org_id AS org_id,
                      :award_number AS award_number,
                      :as_of_date AS as_of_date
                  FROM dual
              )
              SELECT
                  ga.award_id,
                  ga.award_number,
                  ga.award_short_name,
                  ga.award_full_name,
                  ga.status AS award_status,
                  ga.type AS award_type,
                  ga.award_purpose_code,
                  ga.funding_source_id,
                  ga.funding_source_award_number AS sponsor_award_number,
                  TO_CHAR(ga.preaward_date, 'YYYY-MM-DD') AS preaward_date,
                  TO_CHAR(ga.start_date_active, 'YYYY-MM-DD') AS start_date,
                  TO_CHAR(ga.end_date_active, 'YYYY-MM-DD') AS end_date,
                  TO_CHAR(ga.close_date, 'YYYY-MM-DD') AS close_date,
                  CASE
                      WHEN ga.start_date_active IS NOT NULL
                       AND NVL(TO_DATE(p.as_of_date, 'YYYY-MM-DD'), TRUNC(SYSDATE)) < ga.start_date_active THEN 'NOT_STARTED'
                      WHEN ga.end_date_active IS NOT NULL
                       AND NVL(TO_DATE(p.as_of_date, 'YYYY-MM-DD'), TRUNC(SYSDATE)) > ga.end_date_active THEN 'PAST_END_DATE'
                      ELSE 'WITHIN_PERIOD'
                  END AS period_status,
                  ga.award_manager_id,
                  (SELECT MAX(papf.full_name) KEEP (DENSE_RANK LAST ORDER BY papf.effective_start_date)
                     FROM apps.per_all_people_f papf
                    WHERE papf.person_id = ga.award_manager_id) AS award_manager_name,
                  ga.award_organization_id,
                  ga.org_id,
                  ga.hard_limit_flag,
                  ga.fund_control_level_award,
                  ga.allowable_schedule_id,
                  ga.idc_schedule_id,
                  (SELECT COUNT(*)
                     FROM apps.gms_installments gi
                    WHERE gi.award_id = ga.award_id) AS installment_count,
                  (SELECT SUM(gi.direct_cost)
                     FROM apps.gms_installments gi
                    WHERE gi.award_id = ga.award_id
                      AND NVL(gi.active_flag, 'Y') = 'Y') AS funded_direct_cost,
                  (SELECT SUM(gi.indirect_cost)
                     FROM apps.gms_installments gi
                    WHERE gi.award_id = ga.award_id
                      AND NVL(gi.active_flag, 'Y') = 'Y') AS funded_indirect_cost,
                  (SELECT MAX(gbv.raw_cost) KEEP (DENSE_RANK LAST ORDER BY gbv.version_number)
                     FROM apps.gms_budget_versions gbv
                    WHERE gbv.award_id = ga.award_id
                      AND gbv.current_flag = 'Y') AS budget_raw_cost,
                  (SELECT MAX(gbv.burdened_cost) KEEP (DENSE_RANK LAST ORDER BY gbv.version_number)
                     FROM apps.gms_budget_versions gbv
                    WHERE gbv.award_id = ga.award_id
                      AND gbv.current_flag = 'Y') AS budget_burdened_cost,
                  (SELECT MAX(gbv.budget_status_code) KEEP (DENSE_RANK LAST ORDER BY gbv.version_number)
                     FROM apps.gms_budget_versions gbv
                    WHERE gbv.award_id = ga.award_id
                      AND gbv.current_flag = 'Y') AS budget_status
              FROM params p
              JOIN apps.gms_awards_all ga
                  ON (p.org_id IS NULL OR ga.org_id = TO_NUMBER(p.org_id))
                 AND (p.award_number IS NULL
                      OR UPPER(ga.award_number) LIKE UPPER('%' || p.award_number || '%')
                      OR UPPER(ga.award_full_name) LIKE UPPER('%' || p.award_number || '%'))
              WHERE NVL(ga.award_template_flag, 'N') <> 'Y'
              ORDER BY ga.award_number
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_award_expenditures:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Summarizes the costs charged to a grant award, by expenditure type and source, from Oracle Grants Accounting and Projects.
      Each row is one expenditure type and source (system_linkage_function, for example ER for expense reports, VI for supplier invoices) with the item count, the actual raw cost (credits and adjustments show as negative amounts), and cost_outside_award_period: the part of the actual cost dated before the award start or after the award end (the period-of-performance test).
      Pass an exact award number in award_number (see ebs_get_award_terms; empty string = all awards) and optionally an expenditure item date window. Returns at most 200 rows. Budget totals are not returned here; see ebs_get_award_terms for the award's funded and budgeted amounts.
      Underlying Tables: GMS_AWARDS_ALL, GMS_AWARD_DISTRIBUTIONS, PA_EXPENDITURE_ITEMS_ALL.
      Security Context: Standard APPS schema access; Org ID security context.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: award_number
      type: string
      description: Exact award number (see ebs_get_award_terms). Empty string = all
        awards.
    - name: start_date
      type: string
      description: Expenditure item date window start in YYYY-MM-DD format. Empty
        string = no lower bound.
    - name: end_date
      type: string
      description: Expenditure item date window end in YYYY-MM-DD format. Empty string
        = no upper bound.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :award_number AS award_number,
                      :start_date AS start_date,
                      :end_date AS end_date
                  FROM dual
              ),
              aw AS (
                  SELECT
                      ga.award_id,
                      ga.award_number,
                      ga.start_date_active,
                      ga.end_date_active
                  FROM params p
                  JOIN apps.gms_awards_all ga
                      ON (p.award_number IS NULL OR ga.award_number = p.award_number)
              ),
              act AS (
                  SELECT
                      aw.award_id,
                      pei.expenditure_type,
                      pei.system_linkage_function,
                      COUNT(*) AS item_count,
                      SUM(gad.raw_cost) AS actual_raw_cost,
                      TO_CHAR(MIN(pei.expenditure_item_date), 'YYYY-MM-DD') AS first_item_date,
                      TO_CHAR(MAX(pei.expenditure_item_date), 'YYYY-MM-DD') AS last_item_date,
                      SUM(CASE WHEN pei.expenditure_item_date < aw.start_date_active
                                 OR pei.expenditure_item_date > aw.end_date_active
                               THEN gad.raw_cost ELSE 0 END) AS cost_outside_award_period
                  FROM aw
                  JOIN apps.gms_award_distributions gad
                      ON gad.award_id = aw.award_id
                     AND gad.document_type = 'EXP'
                     AND gad.line_type = 'R'
                     AND NVL(gad.reversed_flag, 'N') <> 'Y'
                  JOIN apps.pa_expenditure_items_all pei
                      ON pei.expenditure_item_id = gad.expenditure_item_id
                  CROSS JOIN params p
                  WHERE (p.start_date IS NULL OR pei.expenditure_item_date >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                    AND (p.end_date IS NULL OR pei.expenditure_item_date <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  GROUP BY aw.award_id, pei.expenditure_type, pei.system_linkage_function
              )
              SELECT
                  aw.award_number,
                  act.expenditure_type,
                  act.system_linkage_function,
                  act.item_count,
                  act.actual_raw_cost,
                  act.cost_outside_award_period,
                  TO_CHAR(aw.start_date_active, 'YYYY-MM-DD') AS award_start_date,
                  TO_CHAR(aw.end_date_active, 'YYYY-MM-DD') AS award_end_date,
                  act.first_item_date,
                  act.last_item_date
              FROM aw
              JOIN act
                  ON act.award_id = aw.award_id
              ORDER BY aw.award_number, act.expenditure_type
              FETCH FIRST 200 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_expense_report_approval_and_payment:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Retrieves the approval, receipts-audit and payment trail of expense reports, for segregation-of-duties checks and the incurred-versus-paid test.
      Per report it returns the status and last status date, the current and override approver (and whether the approver is the submitter), the workflow approval flag, the paper and image receipts status and received date, the audit code and last auditor, any hold or reject code, and the matching Payables invoice with its payments: amount, payment date, check or EFT number, payment status, method and cleared or void date. A report paid in several instalments returns one row per payment.
      All parameters are optional: pass an empty string to leave a filter off. Returns at most 200 rows, newest first. Per-step approval history from the approval workflow is not returned.
      Underlying Tables: AP_EXPENSE_REPORT_HEADERS_ALL, AP_INVOICES_ALL, AP_INVOICE_PAYMENTS_ALL, AP_CHECKS_ALL, PER_ALL_PEOPLE_F.
      Security Context: Financial auditor responsibility context (fnd_global.apps_initialize).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: report_header_id
      type: string
      description: Expense report header ID. Empty string = any report.
    - name: org_id
      type: string
      description: Operating unit ID (ORG_ID). Empty string = all operating units.
    - name: start_date
      type: string
      description: Submission (week end) date window start in YYYY-MM-DD format. Empty
        string = no lower bound.
    - name: end_date
      type: string
      description: Submission (week end) date window end in YYYY-MM-DD format. Empty
        string = no upper bound.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :report_header_id AS report_header_id,
                      :org_id AS org_id,
                      :start_date AS start_date,
                      :end_date AS end_date
                  FROM dual
              )
              SELECT
                  aerh.report_header_id,
                  aerh.invoice_num AS report_number,
                  aerh.employee_id,
                  (SELECT MAX(papf.full_name) KEEP (DENSE_RANK LAST ORDER BY papf.effective_start_date)
                     FROM apps.per_all_people_f papf
                    WHERE papf.person_id = aerh.employee_id) AS employee_name,
                  aerh.total AS report_total,
                  TO_CHAR(aerh.week_end_date, 'YYYY-MM-DD') AS submission_date,
                  TO_CHAR(aerh.report_submitted_date, 'YYYY-MM-DD') AS report_submitted_date,
                  aerh.expense_status_code,
                  TO_CHAR(aerh.expense_last_status_date, 'YYYY-MM-DD') AS last_status_date,
                  aerh.workflow_approved_flag,
                  aerh.approval_type,
                  aerh.expense_current_approver_id AS current_approver_id,
                  (SELECT MAX(papf.full_name) KEEP (DENSE_RANK LAST ORDER BY papf.effective_start_date)
                     FROM apps.per_all_people_f papf
                    WHERE papf.person_id = aerh.expense_current_approver_id) AS current_approver_name,
                  CASE WHEN aerh.expense_current_approver_id = aerh.employee_id THEN 'Y' ELSE 'N' END AS approver_is_submitter,
                  aerh.override_approver_id,
                  aerh.override_approver_name,
                  aerh.receipts_status,
                  TO_CHAR(aerh.receipts_received_date, 'YYYY-MM-DD') AS receipts_received_date,
                  aerh.image_receipts_status,
                  aerh.missing_img_just AS missing_image_justification,
                  aerh.audit_code,
                  aerh.last_audited_by,
                  aerh.hold_lookup_code,
                  aerh.reject_code,
                  aia.invoice_id,
                  aia.invoice_amount,
                  aia.amount_paid,
                  aia.payment_status_flag,
                  aia.approval_status AS invoice_approval_status,
                  TO_CHAR(aia.gl_date, 'YYYY-MM-DD') AS invoice_gl_date,
                  aip.amount AS payment_amount,
                  TO_CHAR(aip.accounting_date, 'YYYY-MM-DD') AS payment_accounting_date,
                  ac.check_number,
                  TO_CHAR(ac.check_date, 'YYYY-MM-DD') AS payment_date,
                  ac.status_lookup_code AS payment_status,
                  ac.payment_method_lookup_code AS payment_method,
                  TO_CHAR(ac.cleared_date, 'YYYY-MM-DD') AS cleared_date,
                  TO_CHAR(ac.void_date, 'YYYY-MM-DD') AS void_date
              FROM params p
              JOIN apps.ap_expense_report_headers_all aerh
                  ON (p.report_header_id IS NULL OR aerh.report_header_id = TO_NUMBER(p.report_header_id))
                 AND (p.org_id IS NULL OR aerh.org_id = TO_NUMBER(p.org_id))
                 AND (p.start_date IS NULL OR aerh.week_end_date >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                 AND (p.end_date IS NULL OR aerh.week_end_date <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
              LEFT JOIN apps.ap_invoices_all aia
                  ON aia.invoice_num = aerh.invoice_num
                 AND aia.org_id = aerh.org_id
              LEFT JOIN apps.ap_invoice_payments_all aip
                  ON aip.invoice_id = aia.invoice_id
              LEFT JOIN apps.ap_checks_all ac
                  ON ac.check_id = aip.check_id
              ORDER BY aerh.week_end_date DESC, aerh.report_header_id DESC, aip.invoice_payment_id
              FETCH FIRST 200 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
