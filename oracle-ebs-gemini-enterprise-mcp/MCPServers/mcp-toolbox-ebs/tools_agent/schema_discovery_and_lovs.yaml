# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_list_operating_units:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists active Oracle EBS Operating Units (organization_id, name, short_code) from HR_OPERATING_UNITS.
      Use this tool to discover valid values for the :org_id bind variable required across AR, AP, PO, and Grants tools.
      Underlying Table: HR_OPERATING_UNITS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: name_pattern
      type: string
      description: Optional search pattern to filter operating units by name (e.g.
        '%Vision%' or '%Government%'). Defaults to '%' if empty.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :name_pattern AS name_pattern FROM dual
              )
              SELECT
                  hou.organization_id,
                  hou.name AS operating_unit_name,
                  hou.short_code,
                  hou.business_group_id
              FROM apps.hr_operating_units hou, params p
              WHERE (p.name_pattern IS NULL OR UPPER(hou.name) LIKE UPPER(p.name_pattern) OR p.name_pattern = '%')
              ORDER BY hou.name
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_list_attachment_entities:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists valid attachment business entity names from FND_DOCUMENT_ENTITIES_VL.
      Use this tool to discover valid values for the :entity_name bind variable (e.g. 'PO_HEADERS_ALL', 'RA_CUSTOMER_TRX_ALL', 'AP_INVOICES_ALL', 'PON_BID_HEADERS') used in document attachment tools.
      Underlying View: FND_DOCUMENT_ENTITIES_VL.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: keyword
      type: string
      description: Keyword to filter entity code or user entity name (e.g. '%PO%'
        or '%INVOICE%').
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :keyword AS keyword FROM dual
              )
              SELECT
                  fde.data_object_code AS entity_name,
                  fde.user_entity_name,
                  fde.table_name
              FROM apps.fnd_document_entities_vl fde, params p
              WHERE (p.keyword IS NULL OR UPPER(fde.data_object_code) LIKE UPPER(p.keyword) OR UPPER(fde.user_entity_name) LIKE UPPER(p.keyword))
              ORDER BY fde.data_object_code
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_list_lookup_values:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Queries QuickCodes / lookup values from FND_LOOKUP_VALUES for a specific lookup type or category.
      Use this tool to discover valid codes for categorical bind variables like :policy_category, document types, or status codes.
      Underlying View: FND_LOOKUP_VALUES.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: lookup_type
      type: string
      description: The FND lookup type (e.g. 'PO_CONTROL_RULES', 'YES_NO', 'FOB_VALUES',
        'DOCUMENT_TYPE').
    - name: keyword
      type: string
      description: Optional keyword to filter lookup codes or descriptions.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :lookup_type AS lookup_type,
                      :keyword AS keyword
                  FROM dual
              )
              SELECT
                  flv.lookup_type,
                  flv.lookup_code,
                  flv.meaning,
                  flv.description
              FROM apps.fnd_lookup_values flv, params p
              WHERE flv.lookup_type = UPPER(p.lookup_type)
                AND flv.language = USERENV('LANG')
                AND flv.enabled_flag = 'Y'
                AND (p.keyword IS NULL OR UPPER(flv.lookup_code) LIKE UPPER(p.keyword) OR UPPER(flv.meaning) LIKE UPPER(p.keyword))
              ORDER BY flv.lookup_code
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_lookup_parties_and_vendors:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Searches AP suppliers (with their TCA party) by partial name or exact supplier number, optionally limited to suppliers with a site in one operating unit; at most 25.
      Use this tool to discover valid values for :party_id, :vendor_name and supplier IDs before invoking verification, voucher or bid evaluation tools.
      Underlying Tables: AP_SUPPLIERS, HZ_PARTIES, AP_SUPPLIER_SITES_ALL.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: search_name
      type: string
      description: Partial supplier name or supplier number (e.g. 'Vision', 'Office'
        or '1003'). Empty string = any.
    - name: org_id
      type: string
      description: Operating unit ID; returns only suppliers with a site in that operating
        unit. Empty string = any.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :search_name AS search_name,
                      :org_id AS org_id
                  FROM dual
              )
              SELECT
                  vend.vendor_id,
                  vend.segment1 AS vendor_number,
                  vend.vendor_name,
                  vend.party_id,
                  hp.party_name,
                  hp.party_number,
                  hp.party_type
              FROM apps.ap_suppliers vend
              JOIN apps.hz_parties hp ON vend.party_id = hp.party_id, params p
              WHERE (p.search_name IS NULL
                  OR UPPER(vend.vendor_name) LIKE UPPER('%' || p.search_name || '%')
                  OR UPPER(hp.party_name) LIKE UPPER('%' || p.search_name || '%')
                  OR vend.segment1 = p.search_name)
                AND (p.org_id IS NULL OR EXISTS (
                      SELECT 1 FROM apps.ap_supplier_sites_all ss
                      WHERE ss.vendor_id = vend.vendor_id AND ss.org_id = TO_NUMBER(p.org_id)))
              ORDER BY vend.vendor_name
              FETCH FIRST 25 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_lookup_employees:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Searches Oracle HRMS personnel directory by name or employee number. The national identifier is returned masked (last four characters only); the full value is not exposed by this tool.
      Use this tool to discover valid values for employee bind variables :person_id and :employee_number before invoking personnel file or expense report tools.
      Underlying Table: PER_ALL_PEOPLE_F.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: name_keyword
      type: string
      description: Full or partial employee name (e.g. 'Smith').
    - name: employee_number
      type: string
      description: Exact or partial employee badge / worker number.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :name_keyword AS name_keyword,
                      :employee_number AS employee_number
                  FROM dual
              )
              SELECT
                  papf.person_id,
                  papf.employee_number,
                  papf.full_name,
                  papf.email_address,
                  CASE WHEN papf.national_identifier IS NULL THEN NULL
                       ELSE 'XXXXX' || SUBSTR(REGEXP_REPLACE(papf.national_identifier, '[^0-9A-Za-z]', ''), -4)
                  END AS ssn_masked,
                  TO_CHAR(papf.effective_start_date, 'YYYY-MM-DD') AS effective_start_date
              FROM apps.per_all_people_f papf, params p
              WHERE TRUNC(SYSDATE) BETWEEN papf.effective_start_date AND papf.effective_end_date
                AND (p.name_keyword IS NULL OR UPPER(papf.full_name) LIKE UPPER('%' || p.name_keyword || '%'))
                AND (p.employee_number IS NULL OR papf.employee_number = p.employee_number)
              ORDER BY papf.full_name
              FETCH FIRST 25 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_lookup_recent_transactions:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Searches recent POs, Invoices, Customer Notices, RFPs, or Expense Reports by document number or type.
      Use this tool to discover valid values for transactional bind variables :po_number, :po_header_id, :invoice_id, :transaction_id, :auction_header_id, and :report_header_id.
      Underlying Tables: PO_HEADERS_ALL, AP_INVOICES_ALL, RA_CUSTOMER_TRX_ALL, PON_AUCTION_HEADERS_ALL, AP_EXPENSE_REPORT_HEADERS_ALL.
      Parameters doc_number and org_id are optional: pass an empty string to leave them off.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: doc_type
      type: string
      description: 'Document type filter: ''PO'', ''INVOICE'', ''NOTICE'', ''RFP'',
        or ''EXPENSE''.'
    - name: doc_number
      type: string
      description: Optional partial document or invoice number.
    - name: org_id
      type: string
      description: Optional operating unit ID. Empty string = all operating units.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :doc_type AS doc_type,
                      :doc_number AS doc_number,
                      :org_id AS org_id
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      'PO' AS doc_type,
                      po.po_header_id AS header_id,
                      po.segment1 AS doc_number,
                      TO_CHAR(po.creation_date, 'YYYY-MM-DD') AS doc_date,
                      po.authorization_status AS doc_status,
                      po.org_id
                  FROM apps.po_headers_all po, params p
                  WHERE UPPER(p.doc_type) = 'PO'
                    AND (p.doc_number IS NULL OR po.segment1 LIKE '%' || p.doc_number || '%')
                    AND (p.org_id IS NULL OR po.org_id = TO_NUMBER(p.org_id))
                  UNION ALL
                  SELECT
                      'INVOICE' AS doc_type,
                      inv.invoice_id AS header_id,
                      inv.invoice_num AS doc_number,
                      TO_CHAR(inv.invoice_date, 'YYYY-MM-DD') AS doc_date,
                      inv.payment_status_flag AS doc_status,
                      inv.org_id
                  FROM apps.ap_invoices_all inv, params p
                  WHERE UPPER(p.doc_type) = 'INVOICE'
                    AND (p.doc_number IS NULL OR inv.invoice_num LIKE '%' || p.doc_number || '%')
                    AND (p.org_id IS NULL OR inv.org_id = TO_NUMBER(p.org_id))
                  UNION ALL
                  SELECT
                      'NOTICE' AS doc_type,
                      trx.customer_trx_id AS header_id,
                      trx.trx_number AS doc_number,
                      TO_CHAR(trx.trx_date, 'YYYY-MM-DD') AS doc_date,
                      trx.complete_flag AS doc_status,
                      trx.org_id
                  FROM apps.ra_customer_trx_all trx, params p
                  WHERE UPPER(p.doc_type) = 'NOTICE'
                    AND (p.doc_number IS NULL OR trx.trx_number LIKE '%' || p.doc_number || '%')
                    AND (p.org_id IS NULL OR trx.org_id = TO_NUMBER(p.org_id))
                  UNION ALL
                  SELECT
                      'RFP' AS doc_type,
                      pon.auction_header_id AS header_id,
                      pon.document_number AS doc_number,
                      TO_CHAR(pon.creation_date, 'YYYY-MM-DD') AS doc_date,
                      pon.auction_status AS doc_status,
                      pon.org_id
                  FROM apps.pon_auction_headers_all pon, params p
                  WHERE UPPER(p.doc_type) = 'RFP'
                    AND (p.doc_number IS NULL OR pon.document_number LIKE '%' || p.doc_number || '%')
                    AND (p.org_id IS NULL OR pon.org_id = TO_NUMBER(p.org_id))
                  UNION ALL
                  SELECT
                      'EXPENSE' AS doc_type,
                      er.report_header_id AS header_id,
                      er.invoice_num AS doc_number,
                      TO_CHAR(er.creation_date, 'YYYY-MM-DD') AS doc_date,
                      er.expense_status_code AS doc_status,
                      er.org_id
                  FROM apps.ap_expense_report_headers_all er, params p
                  WHERE UPPER(p.doc_type) = 'EXPENSE'
                    AND (p.doc_number IS NULL OR er.invoice_num LIKE '%' || p.doc_number || '%')
                    AND (p.org_id IS NULL OR er.org_id = TO_NUMBER(p.org_id))
              )
              ORDER BY doc_date DESC
              FETCH FIRST 25 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_describe_table:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists the columns (name, data type, length) of a table or view that the database user can see.
      Use this tool to check which columns exist before writing or changing a query against that table.
      Underlying View: ALL_TAB_COLUMNS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: table_name
      type: string
      description: Table or view name to describe (e.g. 'AP_EXPENSE_REPORT_LINES_ALL').
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :table_name AS table_name FROM dual
              )
              SELECT
                  atc.owner,
                  atc.table_name,
                  atc.column_id,
                  atc.column_name,
                  atc.data_type,
                  atc.data_length
              FROM all_tab_columns atc, params p
              WHERE atc.table_name = UPPER(p.table_name)
              ORDER BY atc.owner, atc.column_id
              FETCH FIRST 400 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_attachment_text:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Returns the text of one EBS attachment, for the notice, policy, intake and RFP skills: short and long text attachments; plain-text, HTML (tags removed), XML or JSON files decoded with their own character set; and PDF, Word, Excel, PowerPoint, RTF and OpenDocument files converted to plain text by Oracle Text (layout and tables are flattened). Text comes back in order as numbered chunks (about 1,000 characters each, up to 24 per call); when more_chunks_follow is Y, call again with start_chunk = the last chunk_number + 1. Join the chunks in order, without separators, to get the full text; an HTML entity cut by a chunk boundary (e.g. &nbsp;) stays encoded.
      A file with no extractable text (a scanned image, a damaged or encrypted file, or more than 50 MB) returns one row with an explanation in extraction_note instead of text; images return content_kind BINARY_FILE. Web-page attachments return their URL.
      Find document IDs with ebs_search_policy_attachments, ebs_get_intake_attachments, ebs_get_vendor_bids or ebs_get_document_attachment.
      Underlying Tables: FND_DOCUMENTS, FND_DOCUMENTS_TL, FND_DOCUMENT_DATATYPES, FND_DOCUMENTS_SHORT_TEXT, FND_DOCUMENTS_LONG_TEXT, FND_LOBS; package APPS.XX_AI_ATTACHMENT_PKG (Oracle Text AUTO_FILTER).
      Security Context: Per-user security only with the PL/SQL security wrapper.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: document_id
      type: string
      description: Document identifier (FND_DOCUMENTS.DOCUMENT_ID), e.g. from ebs_search_policy_attachments,
        ebs_get_intake_attachments or ebs_get_vendor_bids.
    - name: start_chunk
      type: string
      description: First chunk to return (1-based) for paging through long documents.
        Empty string = 1.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :document_id AS document_id,
                      :start_chunk AS start_chunk
                  FROM dual
              ),
              -- Post-install version: needs APPS.XX_AI_ATTACHMENT_PKG (ebs/install/README.md).
              -- One row per document with its content kind. Files are decoded with the charset in
              -- the MIME type (IANA name), else FND_LOBS.ORACLE_CHARSET. Chunks are 1200 bytes for
              -- files (up to 3 bytes per character in AL32UTF8 stays under the 4000-byte SQL limit)
              -- and 1000 characters for long text.
              doc AS (
                  SELECT
                      fd.document_id,
                      dtype.user_name AS document_datatype,
                      fdt.title AS document_title,
                      NVL(fl.file_name, fd.file_name) AS file_name,
                      fd.url,
                      fl.file_content_type AS mime_type,
                      fl.file_id,
                      fl.file_data,
                      st.short_text,
                      lt.long_text,
                      CASE
                          WHEN fd.datatype_id = 1 THEN 'SHORT_TEXT'
                          WHEN fd.datatype_id = 2 THEN 'LONG_TEXT'
                          WHEN fd.datatype_id = 5 THEN 'WEB_PAGE'
                          WHEN fd.datatype_id = 6 AND fl.file_id IS NULL THEN 'FILE_MISSING'
                          WHEN fd.datatype_id = 6 AND (LOWER(fl.file_content_type) LIKE 'text/html%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/xhtml%') THEN 'HTML_FILE'
                          WHEN fd.datatype_id = 6 AND (LOWER(fl.file_content_type) LIKE 'text/%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/xml%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/json%') THEN 'TEXT_FILE'
                          WHEN fd.datatype_id = 6 AND (LOWER(fl.file_content_type) LIKE 'application/pdf%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/msword%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/rtf%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/vnd.ms-%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/vnd.openxmlformats-officedocument%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/vnd.oasis.opendocument%'
                                                    OR LOWER(fl.file_content_type) LIKE 'application/octet-stream%') THEN 'FILTERED_FILE'
                          WHEN fd.datatype_id = 6 THEN 'BINARY_FILE'
                          ELSE 'OTHER'
                      END AS content_kind,
                      NVL(UTL_I18N.MAP_CHARSET(REGEXP_SUBSTR(fl.file_content_type, 'charset=([^; ]+)', 1, 1, 'i', 1), 0, 1),
                          NVL(fl.oracle_charset, 'WE8MSWIN1252')) AS source_charset,
                      CASE
                          WHEN fd.datatype_id = 1 THEN 1
                          WHEN fd.datatype_id = 2 THEN CEIL(NVL(DBMS_LOB.GETLENGTH(lt.long_text), 0) / 1000)
                          WHEN fd.datatype_id = 6 AND fl.file_id IS NOT NULL AND NOT (
                                   LOWER(fl.file_content_type) LIKE 'text/%' OR LOWER(fl.file_content_type) LIKE 'application/xhtml%'
                                OR LOWER(fl.file_content_type) LIKE 'application/xml%' OR LOWER(fl.file_content_type) LIKE 'application/json%')
                              THEN CEIL(apps.xx_ai_attachment_pkg.get_text_length(fl.file_id) / 1000)
                          WHEN fd.datatype_id = 6 THEN CEIL(NVL(DBMS_LOB.GETLENGTH(fl.file_data), 0) / 1200)
                          ELSE 0
                      END AS total_chunks,
                      GREATEST(NVL(TO_NUMBER(p.start_chunk), 1), 1) AS first_chunk
                  FROM params p
                  JOIN apps.fnd_documents fd
                      ON fd.document_id = TO_NUMBER(p.document_id)
                  LEFT JOIN apps.fnd_documents_tl fdt
                      ON fdt.document_id = fd.document_id
                     AND fdt.language = USERENV('LANG')
                  LEFT JOIN apps.fnd_document_datatypes dtype
                      ON dtype.datatype_id = fd.datatype_id
                     AND dtype.language = USERENV('LANG')
                  LEFT JOIN apps.fnd_lobs fl
                      ON fd.datatype_id = 6
                     AND fl.file_id = fd.media_id
                  LEFT JOIN apps.fnd_documents_short_text st
                      ON fd.datatype_id = 1
                     AND st.media_id = fd.media_id
                  LEFT JOIN apps.fnd_documents_long_text lt
                      ON fd.datatype_id = 2
                     AND lt.media_id = fd.media_id
              ),
              chunks AS (
                  SELECT LEVEL - 1 AS k FROM dual CONNECT BY LEVEL <= 24
              ),
              bounds AS (
                  SELECT
                      d.document_id,
                      d.document_datatype,
                      d.document_title,
                      d.file_name,
                      d.url,
                      d.mime_type,
                      d.content_kind,
                      d.source_charset,
                      d.total_chunks,
                      d.short_text,
                      d.long_text,
                      d.file_id,
                      d.file_data,
                      d.first_chunk + c.k AS chunk_number,
                      CASE WHEN d.source_charset IN ('AL32UTF8', 'UTF8') THEN 'Y' ELSE 'N' END AS utf8,
                      (d.first_chunk + c.k - 1) * 1200 + 1 AS byte_start,
                      (d.first_chunk + c.k) * 1200 + 1 AS byte_next,
                      CASE WHEN d.content_kind IN ('TEXT_FILE', 'HTML_FILE')
                           THEN DBMS_LOB.SUBSTR(d.file_data, 3, (d.first_chunk + c.k - 1) * 1200 + 1) END AS head_bytes,
                      CASE WHEN d.content_kind IN ('TEXT_FILE', 'HTML_FILE')
                           THEN DBMS_LOB.SUBSTR(d.file_data, 3, (d.first_chunk + c.k) * 1200 + 1) END AS next_head_bytes
                  FROM doc d
                  CROSS JOIN chunks c
                  WHERE (d.content_kind IN ('SHORT_TEXT', 'LONG_TEXT', 'TEXT_FILE', 'HTML_FILE')
                         AND d.first_chunk + c.k <= GREATEST(d.total_chunks, 1))
                     OR (d.content_kind = 'FILTERED_FILE' AND d.total_chunks > 0 AND d.first_chunk + c.k <= d.total_chunks)
                     OR (d.content_kind = 'FILTERED_FILE' AND d.total_chunks = 0 AND c.k = 0)
                     OR (d.content_kind NOT IN ('SHORT_TEXT', 'LONG_TEXT', 'TEXT_FILE', 'HTML_FILE', 'FILTERED_FILE') AND c.k = 0)
              ),
              -- For UTF-8 files each chunk boundary moves past continuation bytes (80 to BF), so a
              -- multi-byte character is never split (a split character raises ORA-01890).
              aligned AS (
                  SELECT
                      bnd.*,
                      bnd.byte_start + CASE WHEN bnd.utf8 = 'Y' AND bnd.head_bytes IS NOT NULL
                                AND UTL_RAW.SUBSTR(bnd.head_bytes, 1, 1) BETWEEN HEXTORAW('80') AND HEXTORAW('BF') THEN
                              CASE WHEN UTL_RAW.LENGTH(bnd.head_bytes) >= 2 AND UTL_RAW.SUBSTR(bnd.head_bytes, 2, 1) BETWEEN HEXTORAW('80') AND HEXTORAW('BF') THEN
                                  CASE WHEN UTL_RAW.LENGTH(bnd.head_bytes) >= 3 AND UTL_RAW.SUBSTR(bnd.head_bytes, 3, 1) BETWEEN HEXTORAW('80') AND HEXTORAW('BF') THEN 3 ELSE 2 END
                              ELSE 1 END
                          ELSE 0 END AS char_start,
                      bnd.byte_next + CASE WHEN bnd.utf8 = 'Y' AND bnd.next_head_bytes IS NOT NULL
                                AND UTL_RAW.SUBSTR(bnd.next_head_bytes, 1, 1) BETWEEN HEXTORAW('80') AND HEXTORAW('BF') THEN
                              CASE WHEN UTL_RAW.LENGTH(bnd.next_head_bytes) >= 2 AND UTL_RAW.SUBSTR(bnd.next_head_bytes, 2, 1) BETWEEN HEXTORAW('80') AND HEXTORAW('BF') THEN
                                  CASE WHEN UTL_RAW.LENGTH(bnd.next_head_bytes) >= 3 AND UTL_RAW.SUBSTR(bnd.next_head_bytes, 3, 1) BETWEEN HEXTORAW('80') AND HEXTORAW('BF') THEN 3 ELSE 2 END
                              ELSE 1 END
                          ELSE 0 END AS char_next
                  FROM bounds bnd
              ),
              raw_text AS (
                  SELECT
                      a.document_id,
                      a.document_datatype,
                      a.document_title,
                      a.file_name,
                      a.url,
                      a.mime_type,
                      a.content_kind,
                      a.source_charset,
                      a.total_chunks,
                      a.chunk_number,
                      CASE WHEN a.content_kind = 'FILTERED_FILE' AND a.total_chunks = 0
                           THEN apps.xx_ai_attachment_pkg.get_text_status(a.file_id) END AS filter_status,
                      CASE
                          WHEN a.content_kind = 'SHORT_TEXT' THEN a.short_text
                          WHEN a.content_kind = 'LONG_TEXT' THEN DBMS_LOB.SUBSTR(a.long_text, 1000, (a.chunk_number - 1) * 1000 + 1)
                          WHEN a.content_kind = 'FILTERED_FILE' AND a.total_chunks > 0
                              THEN apps.xx_ai_attachment_pkg.get_text_chunk(a.file_id, a.chunk_number)
                          WHEN a.content_kind IN ('TEXT_FILE', 'HTML_FILE') AND a.char_next > a.char_start
                              THEN UTL_I18N.RAW_TO_CHAR(DBMS_LOB.SUBSTR(a.file_data, a.char_next - a.char_start, a.char_start), a.source_charset)
                      END AS chunk_text
                  FROM aligned a
              )
              -- HTML chunks have tags removed (including a tag cut off at either end of the chunk)
              -- and common entities decoded.
              SELECT
                  document_id,
                  document_datatype,
                  document_title,
                  file_name,
                  url,
                  mime_type,
                  content_kind,
                  CASE WHEN content_kind IN ('TEXT_FILE', 'HTML_FILE') THEN source_charset END AS source_charset,
                  CASE WHEN content_kind = 'BINARY_FILE' THEN 0 ELSE total_chunks END AS total_chunks,
                  CASE WHEN content_kind = 'BINARY_FILE' OR (content_kind = 'FILTERED_FILE' AND total_chunks = 0) THEN NULL ELSE chunk_number END AS chunk_number,
                  CASE WHEN content_kind IN ('SHORT_TEXT', 'LONG_TEXT', 'TEXT_FILE', 'HTML_FILE')
                         OR (content_kind = 'FILTERED_FILE' AND total_chunks > 0)
                       THEN CASE WHEN chunk_number < total_chunks THEN 'Y' ELSE 'N' END END AS more_chunks_follow,
                  CASE
                      WHEN content_kind = 'HTML_FILE' THEN
                          REGEXP_REPLACE(
                              REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(
                                  REGEXP_REPLACE(REGEXP_REPLACE(REGEXP_REPLACE(chunk_text, '^[^<>]*>', ' '), '<[^>]*$', ' '), '<[^>]*>', ' '),
                                  '&nbsp;', ' '), '&lt;', '<'), '&gt;', '>'), '&quot;', '"'), '&#39;', ''''), '&amp;', '&'),
                              '\s+', ' ')
                      ELSE chunk_text
                  END AS text,
                  CASE content_kind
                      WHEN 'BINARY_FILE' THEN 'Binary file (' || NVL(mime_type, 'unknown type') || ') with no text to extract, such as an image. Fetch the file with ebs_get_document_attachment for an external step such as OCR.'
                      WHEN 'FILTERED_FILE' THEN
                          CASE
                              WHEN filter_status IS NULL THEN 'Text extracted from the ' || NVL(mime_type, 'binary') || ' file by Oracle Text; page layout and tables are flattened to plain text.'
                              WHEN filter_status = 'NO_TEXT' THEN 'No text found in the file; it is probably a scanned image and needs OCR.'
                              WHEN filter_status = 'TOO_LARGE' THEN 'The file is larger than the 50 MB extraction limit.'
                              ELSE 'Text could not be extracted: ' || filter_status
                          END
                      WHEN 'WEB_PAGE' THEN 'Web page attachment: the content is at the URL, not in EBS.'
                      WHEN 'FILE_MISSING' THEN 'The file record is missing from FND_LOBS.'
                      WHEN 'OTHER' THEN 'Attachment type ' || NVL(document_datatype, 'unknown') || ' has no text content in EBS.'
                  END AS extraction_note
              FROM raw_text
              ORDER BY chunk_number;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_get_attachment_base64:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Returns an EBS file attachment as Base64 text, one piece per call, so a client can rebuild a file whose text cannot be read in the database (images, scanned documents, anything the agent must pass on or read with its own tools). Give the document ID (document_id). The response gives the file size, bytes per piece, the number of pieces and whether more follow; call again with the next chunk number, keeping chunk_bytes the same, until has_more is N, then join the base64_chunk values in order and decode them.
      For readable text use ebs_get_attachment_text instead; it is much smaller. Only file attachments (datatype File) have content; other attachment types return file_status NOT_A_FILE. Files over 50 MB are refused (file_status TOO_LARGE).
      Attachments can hold personal data; the content is returned as stored.
      Underlying Tables: FND_DOCUMENTS, FND_LOBS (through the database package APPS.XX_AI_ATTACHMENT_PKG, installed by a DBA from ebs/install).
      Security Context: Attachment data; use the PL/SQL wrapper and an authorised user in production.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    - name: document_id
      type: string
      description: Document identifier (FND_DOCUMENTS.DOCUMENT_ID) of a file attachment,
        e.g. from ebs_search_policy_attachments, ebs_get_intake_attachments or ebs_get_vendor_bids.
        Required.
    - name: chunk
      type: string
      description: Which piece of the file to return, starting at 1. Empty = 1. Repeat
        until has_more is N.
    - name: chunk_bytes
      type: string
      description: File bytes per piece, rounded down to a multiple of 3 (default
        1500, at most 1998). Use the same value for every call for one file.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :document_id AS document_id,
                      :chunk AS chunk,
                      :chunk_bytes AS chunk_bytes
                  FROM dual
              ),
              -- Post-install version: needs APPS.XX_AI_ATTACHMENT_PKG (ebs/install/README.md).
              info AS (
                  SELECT
                      fd.document_id,
                      fd.datatype_id,
                      NVL(fl.file_name, fd.file_name) AS file_name,
                      fl.file_content_type AS mime_type,
                      fl.file_id,
                      GREATEST(NVL(TO_NUMBER(p.chunk), 1), 1) AS chunk_no,
                      FLOOR(LEAST(GREATEST(NVL(TO_NUMBER(p.chunk_bytes), 1500), 3), 1998) / 3) * 3 AS bytes_per_chunk
                  FROM params p
                  JOIN apps.fnd_documents fd
                      ON fd.document_id = TO_NUMBER(p.document_id)
                  LEFT JOIN apps.fnd_lobs fl
                      ON fd.datatype_id = 6
                     AND fl.file_id = fd.media_id
              )
              SELECT
                  i.document_id,
                  i.file_name,
                  i.mime_type,
                  CASE WHEN i.datatype_id <> 6 THEN 'NOT_A_FILE'
                       ELSE apps.xx_ai_attachment_pkg.get_status(i.file_id) END AS file_status,
                  apps.xx_ai_attachment_pkg.get_bytes(i.file_id) AS file_bytes,
                  i.bytes_per_chunk AS chunk_bytes,
                  CEIL(apps.xx_ai_attachment_pkg.get_bytes(i.file_id) / i.bytes_per_chunk) AS chunk_count,
                  i.chunk_no AS chunk,
                  CASE WHEN i.chunk_no * i.bytes_per_chunk < apps.xx_ai_attachment_pkg.get_bytes(i.file_id) THEN 'Y' ELSE 'N' END AS has_more,
                  apps.xx_ai_attachment_pkg.get_base64_chunk(i.file_id, i.chunk_no, i.bytes_per_chunk) AS base64_chunk
              FROM info i;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
