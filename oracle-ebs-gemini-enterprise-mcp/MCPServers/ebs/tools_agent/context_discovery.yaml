# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ebs_get_my_context:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Shows the EBS context the signed-in user's tools run under: FND user, responsibility, application, operating unit (org_id) and, if set with ebs_change_my_context, the stored choice.
      Returns one JSON text in column RESULT. Call it before the transaction tools (ebs_reserve_item, ebs_create_onhand, ebs_create_supplier, ebs_create_ap_invoice), which only see data of this operating unit, and after ebs_change_my_context or ebs_reset_my_context to confirm the change.
      Underlying package: APPS.XX_AI_SECURITY_PKG.GET_SESSION_CONTEXT.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              SELECT apps.xx_ai_security_pkg.get_session_context AS result FROM dual;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_list_my_operating_units:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists the operating units the signed-in user can work in, each with the responsibility that gives access to it (the "MO: Operating Unit" profile of that responsibility).
      Use this tool to find valid values for :operating_unit (operating_unit_name) of ebs_change_my_context, and pick the :responsibility from the same row so the two fit together. Responsibilities that reach their operating units through an MO security profile instead of the operating-unit profile are not listed here; EBS still refuses an operating unit the user cannot access when ebs_change_my_context is called.
      Underlying Tables: FND_USER, FND_USER_RESP_GROUPS_DIRECT, FND_RESPONSIBILITY_VL, FND_APPLICATION_VL, FND_PROFILE_OPTION_VALUES, FND_PROFILE_OPTIONS, HR_OPERATING_UNITS.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              SELECT DISTINCT
                  hou.name AS operating_unit_name,
                  hou.organization_id AS org_id,
                  r.responsibility_name,
                  fa.application_short_name
              FROM apps.fnd_user u
              JOIN apps.fnd_user_resp_groups_direct urg ON urg.user_id = u.user_id
              JOIN apps.fnd_responsibility_vl r ON r.responsibility_id = urg.responsibility_id
                                               AND r.application_id = urg.responsibility_application_id
              JOIN apps.fnd_application_vl fa ON fa.application_id = r.application_id
              JOIN apps.fnd_profile_option_values fpov ON fpov.level_value = urg.responsibility_id
                                                      AND fpov.level_id = 10003   -- responsibility level
              JOIN apps.fnd_profile_options fpo ON fpo.profile_option_id = fpov.profile_option_id
                                               AND fpo.profile_option_name = 'ORG_ID'
              JOIN apps.hr_operating_units hou ON fpov.profile_option_value = TO_CHAR(hou.organization_id)
              WHERE (u.end_date IS NULL OR u.end_date > SYSDATE)
                AND ((INSTR(SYS_CONTEXT('USERENV', 'CLIENT_IDENTIFIER'), '@') > 0
                      AND UPPER(u.email_address) = UPPER(SYS_CONTEXT('USERENV', 'CLIENT_IDENTIFIER')))
                  OR (INSTR(SYS_CONTEXT('USERENV', 'CLIENT_IDENTIFIER'), '@') = 0
                      AND u.user_name = UPPER(SYS_CONTEXT('USERENV', 'CLIENT_IDENTIFIER'))))
                AND (urg.end_date IS NULL OR urg.end_date > SYSDATE)
                AND (r.end_date IS NULL OR r.end_date > SYSDATE)
              ORDER BY hou.name, r.responsibility_name
              FETCH FIRST 200 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ebs_list_my_responsibilities:
    kind: oracle-sql
    source: ebs-oracle-source
    description: |-
      Lists the active EBS responsibilities of the signed-in user, with the application each belongs to.
      Use this tool to find valid values for :responsibility (responsibility_name) and :application_short_name (application_short_name) of ebs_change_my_context. Only responsibilities listed here are accepted. The current choice is shown by ebs_get_my_context.
      Underlying Tables: FND_USER, FND_USER_RESP_GROUPS_DIRECT, FND_RESPONSIBILITY_VL, FND_APPLICATION_VL.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the EBS security context
        for the query.
      required: true
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Set the EBS application/security context for the authenticated user
          apps.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the EBS selection query
          OPEN rc FOR
              SELECT
                  r.responsibility_name,
                  fa.application_short_name,
                  fa.application_name,
                  urg.start_date,
                  urg.end_date
              FROM apps.fnd_user u
              JOIN apps.fnd_user_resp_groups_direct urg ON urg.user_id = u.user_id
              JOIN apps.fnd_responsibility_vl r ON r.responsibility_id = urg.responsibility_id
                                               AND r.application_id = urg.responsibility_application_id
              JOIN apps.fnd_application_vl fa ON fa.application_id = r.application_id
              WHERE (u.end_date IS NULL OR u.end_date > SYSDATE)
                AND ((INSTR(SYS_CONTEXT('USERENV', 'CLIENT_IDENTIFIER'), '@') > 0
                      AND UPPER(u.email_address) = UPPER(SYS_CONTEXT('USERENV', 'CLIENT_IDENTIFIER')))
                  OR (INSTR(SYS_CONTEXT('USERENV', 'CLIENT_IDENTIFIER'), '@') = 0
                      AND u.user_name = UPPER(SYS_CONTEXT('USERENV', 'CLIENT_IDENTIFIER'))))
                AND (urg.end_date IS NULL OR urg.end_date > SYSDATE)
                AND (r.end_date IS NULL OR r.end_date > SYSDATE)
              ORDER BY r.responsibility_name
              FETCH FIRST 200 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  context_discovery:
  - ebs_get_my_context
  - ebs_list_my_operating_units
  - ebs_list_my_responsibilities
