# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_get_process_status:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Shows Process Scheduler runs (newest first, up to 50): process name and description, who requested it, run control, status (Queued, Processing, Success, Error, ...), start and end time and return code.
      Use this tool to follow what happens after staging a transaction with ps_stage_voucher, ps_stage_requisition or ps_stage_journal_entry: those only fill staging tables, and a delivered batch process (Voucher Build, Requisition Loader PO_REQLOAD, Journal Generator FS_JGEN) turns them into the real transaction when the Process Scheduler runs it. The same applies to Time Administration (TL_TIMEADMIN). Status 'Success' (9) means that run finished; 'Error' (3) or 'Not Successful' (10) means look at the process messages in PeopleSoft.
      Shows runs of all operators unless :oprid is given. Underlying Tables: PSPRCSRQST, PS_PRCSDEFN, PSXLATITEM (RUNSTATUS).
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: process_name
      type: string
      description: Part of the process name (e.g. 'VCHRBLD', 'PO_REQLOAD', 'FS_JGEN',
        'TL_TIMEADMIN'). Empty string = any process.
    - name: run_status
      type: string
      description: Run status code (e.g. '9') or text (e.g. 'Success', 'Error', 'Queued',
        'Processing'). Empty string = any status.
    - name: oprid
      type: string
      description: Operator ID that requested the run (e.g. 'PS'). Empty string =
        any operator.
    - name: days_back
      type: string
      description: How many days back to look, by request time (a whole number). Empty
        string = 7.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :process_name AS process_name,
                      :run_status AS run_status,
                      :oprid AS oprid,
                      :days_back AS days_back
                  FROM dual
              ),
              status_text AS (
                  SELECT fieldvalue, xlatlongname
                  FROM (
                      SELECT x.fieldvalue, x.xlatlongname,
                             ROW_NUMBER() OVER (PARTITION BY x.fieldvalue ORDER BY x.effdt DESC) AS rn
                      FROM sysadm.psxlatitem x
                      WHERE x.fieldname = 'RUNSTATUS' AND x.eff_status = 'A' AND x.effdt <= SYSDATE
                  )
                  WHERE rn = 1
              )
              SELECT
                  r.prcsinstance AS process_instance,
                  r.prcstype AS process_type,
                  r.prcsname AS process_name,
                  d.descr AS process_description,
                  r.oprid,
                  r.runcntlid AS run_control_id,
                  r.runstatus AS run_status,
                  st.xlatlongname AS run_status_text,
                  r.rqstdttm AS requested_at,
                  r.begindttm AS started_at,
                  r.enddttm AS ended_at,
                  r.prcsrtncd AS return_code
              FROM params p
              CROSS JOIN sysadm.psprcsrqst r
              LEFT JOIN sysadm.ps_prcsdefn d ON d.prcstype = r.prcstype AND d.prcsname = r.prcsname
              LEFT JOIN status_text st ON st.fieldvalue = r.runstatus
              WHERE r.rqstdttm >= SYSDATE - NVL(TO_NUMBER(p.days_back), 7)
                AND (p.process_name IS NULL OR UPPER(r.prcsname) LIKE UPPER('%' || p.process_name || '%'))
                AND (p.oprid IS NULL OR r.oprid = UPPER(p.oprid))
                AND (p.run_status IS NULL OR r.runstatus = p.run_status OR UPPER(st.xlatlongname) = UPPER(p.run_status))
              ORDER BY r.prcsinstance DESC
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  process_monitor:
  - ps_get_process_status
