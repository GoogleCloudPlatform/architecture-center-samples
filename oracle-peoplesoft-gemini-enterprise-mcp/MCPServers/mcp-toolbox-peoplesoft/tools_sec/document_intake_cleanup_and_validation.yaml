# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_verify_constituent_data:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Cross-checks extracted income and demographic fields against PeopleSoft Person/Constituent master tables.
      Underlying Tables: PS_PERSONAL_DATA, PS_PERS_NID, PS_NAMES, PS_ADDRESSES.
      Procedures/APIs: Component Interface CI_PERSONAL_DATA, REST verification service.
      Security Context: Row-level security and permission list context.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: first_name
      type: string
      description: First name of the constituent.
    - name: last_name
      type: string
      description: Last name of the constituent.
    - name: emplid
      type: string
      description: Constituent EMPLID if available.
    - name: nid
      type: string
      description: National ID / SSN hash or last 4 digits for identity matching.
    - name: postal
      type: string
      description: Residential postal/ZIP code.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :first_name AS first_name,
                      :last_name AS last_name,
                      :emplid AS emplid,
                      :nid AS nid,
                      :postal AS postal
                  FROM dual
              )
              SELECT
                  pers.emplid,
                  nm.first_name,
                  nm.last_name,
                  nm.name_display,
                  addr.address1,
                  addr.city,
                  addr.state,
                  addr.postal,
                  CASE
                      WHEN UPPER(nm.first_name) = UPPER(p.first_name) AND UPPER(nm.last_name) = UPPER(p.last_name) THEN 100
                      WHEN UPPER(nm.last_name) = UPPER(p.last_name) THEN 75
                      ELSE 50
                  END AS name_match_confidence,
                  CASE
                      WHEN p.nid IS NOT NULL AND nid.national_id LIKE '%' || p.nid THEN 'VERIFIED_MATCH'
                      WHEN p.nid IS NOT NULL THEN 'NO_MATCH'
                      ELSE 'NOT_CHECKED'
                  END AS nid_match_status
              FROM params p
              JOIN sysadm.ps_personal_data pers
                  ON (p.emplid IS NULL OR pers.emplid = p.emplid)
              JOIN sysadm.ps_names nm
                  ON pers.emplid = nm.emplid
                 AND nm.name_type = 'PRI'
                 AND (p.first_name IS NULL OR UPPER(nm.first_name) = UPPER(p.first_name))
                 AND (p.last_name IS NULL OR UPPER(nm.last_name) = UPPER(p.last_name))
              LEFT JOIN sysadm.ps_pers_nid nid
                  ON pers.emplid = nid.emplid
                 AND nid.primary_nid = 'Y'
              LEFT JOIN sysadm.ps_addresses addr
                  ON pers.emplid = addr.emplid
                 AND addr.address_type = 'HOME'
                 AND (p.postal IS NULL OR addr.postal = p.postal)
              FETCH FIRST 10 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  document_intake_cleanup_and_validation:
  - ps_verify_constituent_data
