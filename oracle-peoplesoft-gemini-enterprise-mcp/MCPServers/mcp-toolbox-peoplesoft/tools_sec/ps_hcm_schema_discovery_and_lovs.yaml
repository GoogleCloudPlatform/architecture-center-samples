# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_hcm_describe_table:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Describes a PeopleSoft table in the connected database, or finds tables by name. With table_name it returns every column (position, name, type, length, nullable); with name_pattern and no table_name it lists matching tables with their statistics row estimate (which can be empty). At most 400 rows. Both table_name forms work: PS_JOB or JOB.
      Use it before writing or changing a query, and to confirm a column exists in this database: the PeopleSoft equivalent of ebs_describe_table. The connected database is HCM only; tables of other PeopleSoft products (Financials, Campus Solutions) will be reported as not found.
      Underlying Tables: ALL_TAB_COLUMNS, ALL_TABLES (SYSADM owner only).
      Security Context: Dictionary views; shows only what the connected user can see.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: table_name
      type: string
      description: Record or table name to describe (for example PS_JOB or JOB). Empty
        = list tables by pattern instead.
    - name: name_pattern
      type: string
      description: Pattern for listing tables when table_name is empty (for example
        %CHECKLIST%). Case-insensitive; % is the wildcard.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :table_name AS table_name,
                      :name_pattern AS name_pattern
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      'COLUMN' AS kind,
                      c.table_name,
                      c.column_id AS position,
                      c.column_name,
                      c.data_type,
                      c.data_length,
                      c.nullable,
                      CAST(NULL AS NUMBER) AS row_estimate
                  FROM params p
                  JOIN all_tab_columns c
                      ON p.table_name IS NOT NULL
                     AND c.owner = 'SYSADM'
                     AND c.table_name IN (UPPER(p.table_name), 'PS_' || UPPER(p.table_name))
                  UNION ALL
                  SELECT
                      'TABLE',
                      t.table_name,
                      CAST(NULL AS NUMBER),
                      CAST(NULL AS VARCHAR2(128)),
                      CAST(NULL AS VARCHAR2(106)),
                      CAST(NULL AS NUMBER),
                      CAST(NULL AS VARCHAR2(1)),
                      t.num_rows
                  FROM params p
                  JOIN all_tables t
                      ON p.table_name IS NULL
                     AND p.name_pattern IS NOT NULL
                     AND t.owner = 'SYSADM'
                     AND t.table_name LIKE UPPER(p.name_pattern)
                  ORDER BY 1, 2, 3
              )
              WHERE ROWNUM <= 400;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
  ps_hcm_lookup_recent_transactions:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Finds recent payroll, project and vendor records so the agent can ground an ID before calling a detail tool. doc_type is PAYCHECK (number, EMPLID, date, status, gross), PROJECT (project ID, description, status) or VENDOR (vendor ID, name, status, last activity). The ID is matched from its start, not anywhere in it. At most 25 rows, newest first.
      Replaces the FSCM lookup (vouchers, purchase orders, sourcing events and expense sheets), which cannot run on this HCM database.
      Underlying Tables: PS_PAY_CHECK, PS_PROJECT, PS_VENDOR.
      Security Context: HCM data; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: doc_type
      type: string
      description: PAYCHECK, PROJECT or VENDOR. Required.
    - name: org_code
      type: string
      description: Company (PAYCHECK), Project Costing business unit (PROJECT) or
        SetID (VENDOR). Empty = any.
    - name: doc_id
      type: string
      description: 'Start of the ID: paycheck number or EMPLID (PAYCHECK), project
        ID (PROJECT), vendor ID (VENDOR). Empty = latest records.'
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :doc_type AS doc_type,
                      :org_code AS org_code,
                      :doc_id AS doc_id
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      'PAYCHECK' AS doc_type,
                      c.company AS org_code,
                      TO_CHAR(c.paycheck_nbr) AS doc_id,
                      c.emplid AS alt_number,
                      TO_CHAR(c.check_dt, 'YYYY-MM-DD') AS doc_date,
                      c.paycheck_status AS doc_status,
                      c.total_gross AS total_amt
                  FROM params p
                  JOIN sysadm.ps_pay_check c
                      ON UPPER(p.doc_type) = 'PAYCHECK'
                     AND (p.org_code IS NULL OR c.company = p.org_code)
                     AND (p.doc_id IS NULL OR TO_CHAR(c.paycheck_nbr) LIKE p.doc_id || '%' OR c.emplid = p.doc_id)
                  UNION ALL
                  SELECT
                      'PROJECT',
                      pr.business_unit,
                      pr.project_id,
                      pr.descr,
                      TO_CHAR(pr.dttm_stamp, 'YYYY-MM-DD'),
                      pr.eff_status,
                      CAST(NULL AS NUMBER)
                  FROM params p
                  JOIN sysadm.ps_project pr
                      ON UPPER(p.doc_type) = 'PROJECT'
                     AND (p.org_code IS NULL OR pr.business_unit = p.org_code)
                     AND (p.doc_id IS NULL OR pr.project_id LIKE p.doc_id || '%')
                  UNION ALL
                  SELECT
                      'VENDOR',
                      v.setid,
                      v.vendor_id,
                      v.name1,
                      TO_CHAR(v.last_activity_dt, 'YYYY-MM-DD'),
                      v.vendor_status,
                      CAST(NULL AS NUMBER)
                  FROM params p
                  JOIN sysadm.ps_vendor v
                      ON UPPER(p.doc_type) = 'VENDOR'
                     AND (p.org_code IS NULL OR v.setid = p.org_code)
                     AND (p.doc_id IS NULL OR v.vendor_id LIKE p.doc_id || '%')
                  ORDER BY 5 DESC NULLS LAST
              )
              WHERE ROWNUM <= 25;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  ps_hcm_schema_discovery_and_lovs:
  - ps_hcm_describe_table
  - ps_hcm_lookup_recent_transactions
