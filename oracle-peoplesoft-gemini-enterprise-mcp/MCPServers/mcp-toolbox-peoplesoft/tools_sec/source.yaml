# ==============================================================================
# Model Context Protocol (MCP) Toolbox for Databases - source.yaml
# Connection and authentication; the tools are in the other files of this folder (one per toolset).
# System: PeopleSoft 9.2 (FSCM / HCM / Campus Solutions)
# Target: Gemini for Government Plugin (Oct 2026)
# Bind Variables: Oracle syntax (:param_name)
# Connection Details: Unified connectionString (hostname:port/servicename)
# ==============================================================================
#
# Authenticated parameters for the PL/SQL security wrapper (README §2.6).
# To enable: uncomment the authServices block below, set GOOGLE_CLIENT_ID
# in peoplesoft/.env, then run: python3 scripts/sync_sql_to_yaml.py --system peoplesoft --wrap
# authServices:
#   google-auth:
#     type: google
#     clientId: ${GOOGLE_CLIENT_ID}
# PL/SQL wrapper: mcp-toolbox-peoplesoft/templates/plsql_wrapper.sql (sync_sql_to_yaml.py --wrap / --no-wrap)

authServices:
  google-auth:
    type: google
    clientId: ${GOOGLE_CLIENT_ID}
sources:
  ps-oracle-source:
    kind: oracle
    connectionString: ${DB_CONNECTION_STRING:oracle-peoplesoft-hcm.c.gcp-project-id.internal:1521/HR92U054}
    user: ${DB_USER:SYSADM_AI}
    password: ${DB_PASSWORD:SYSADM_AI}
