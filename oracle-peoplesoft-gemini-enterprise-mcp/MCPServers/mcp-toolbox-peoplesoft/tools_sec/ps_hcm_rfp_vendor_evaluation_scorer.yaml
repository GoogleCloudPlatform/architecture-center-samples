# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_hcm_get_vendor_profile:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns the vendor master record for a supplier: legal name, status, class, whether it is the primary or a corporate-parent record, hub-zone and EEO certification date, last activity, primary address (as of today), default payment terms and currency, and how many vendor policies are on file. At most 50 vendors, found by SetID, vendor ID or part of the name.
      Use it for vendor identity and consistency checks in the RFP vendor evaluation skill (does the legal name and address on a proposal match the vendor master? is the vendor active?), and to ground a vendor ID before another call. It contains no tax identifiers and no bank details.
      Sourcing events, bids and evaluation criteria are NOT in this database (Strategic Sourcing is not installed), so there is no tool for the solicitation or the vendor responses; that part of the skill cannot be served from HCM.
      Underlying Tables: PS_VENDOR, PS_VENDOR_ADDR, PS_VENDOR_LOC, PS_VENDOR_POLICY.
      Security Context: Supplier SetID security; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
      authServices:
      - name: google-auth
        field: email
    - name: setid
      type: string
      description: Vendor SetID. Empty = any.
    - name: vendor_id
      type: string
      description: Vendor ID. Empty = any.
    - name: name_pattern
      type: string
      description: Text to find in the vendor name (case-insensitive, matched anywhere).
        Empty = no name filter.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :setid AS setid,
                      :vendor_id AS vendor_id,
                      :name_pattern AS name_pattern
                  FROM dual
              ),
              pol AS (
                  SELECT vp.setid, vp.vendor_id, COUNT(*) AS policy_count, MAX(vp.policy_end_date) AS latest_policy_end
                  FROM sysadm.ps_vendor_policy vp
                  GROUP BY vp.setid, vp.vendor_id
              )
              SELECT * FROM (
                  SELECT
                      v.setid,
                      v.vendor_id,
                      v.name1 AS vendor_name,
                      v.name2 AS vendor_name_2,
                      v.vendor_status,
                      v.vendor_class,
                      v.vendor_persistence,
                      v.vndr_status_po AS purchasing_status,
                      v.primary_vendor,
                      v.corporate_setid,
                      v.corporate_vendor,
                      v.hub_zone,
                      TO_CHAR(v.eeo_certif_dt, 'YYYY-MM-DD') AS eeo_certification_date,
                      TO_CHAR(v.last_activity_dt, 'YYYY-MM-DD') AS last_activity_date,
                      v.wthd_sw AS subject_to_withholding,
                      a.address1,
                      a.city,
                      a.state,
                      a.postal,
                      a.country,
                      l.pymnt_terms_cd AS payment_terms,
                      l.currency_cd,
                      NVL(pol.policy_count, 0) AS policy_count,
                      TO_CHAR(pol.latest_policy_end, 'YYYY-MM-DD') AS latest_policy_end_date
                  FROM params p
                  JOIN sysadm.ps_vendor v
                      ON (p.setid IS NULL OR v.setid = p.setid)
                     AND (p.vendor_id IS NULL OR v.vendor_id = p.vendor_id)
                     AND (p.name_pattern IS NULL
                          OR UPPER(v.name1) LIKE '%' || UPPER(p.name_pattern) || '%'
                          OR UPPER(v.name2) LIKE '%' || UPPER(p.name_pattern) || '%')
                  LEFT JOIN sysadm.ps_vendor_addr a
                      ON a.setid = v.setid
                     AND a.vendor_id = v.vendor_id
                     AND a.address_seq_num = v.prim_addr_seq_num
                     AND a.effdt = (SELECT MAX(a2.effdt) FROM sysadm.ps_vendor_addr a2
                                     WHERE a2.setid = a.setid AND a2.vendor_id = a.vendor_id
                                       AND a2.address_seq_num = a.address_seq_num AND a2.effdt <= TRUNC(SYSDATE))
                  LEFT JOIN sysadm.ps_vendor_loc l
                      ON l.setid = v.setid
                     AND l.vendor_id = v.vendor_id
                     AND l.vndr_loc = v.default_loc
                     AND l.effdt = (SELECT MAX(l2.effdt) FROM sysadm.ps_vendor_loc l2
                                     WHERE l2.setid = l.setid AND l2.vendor_id = l.vendor_id
                                       AND l2.vndr_loc = l.vndr_loc AND l2.effdt <= TRUNC(SYSDATE))
                  LEFT JOIN pol
                      ON pol.setid = v.setid AND pol.vendor_id = v.vendor_id
                  ORDER BY v.name1
              )
              WHERE ROWNUM <= 50;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
    authRequired:
    - google-auth
toolsets:
  ps_hcm_rfp_vendor_evaluation_scorer:
  - ps_hcm_get_vendor_profile
