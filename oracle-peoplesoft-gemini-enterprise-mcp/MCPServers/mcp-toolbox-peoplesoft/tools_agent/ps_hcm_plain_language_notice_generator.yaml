# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_hcm_get_agency_contact_info:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns the agency's own contact details as stored in HCM setup: office locations (address, phone, extension, fax) and companies (legal entity name and address), as of today. Search by SetID and location, by company, or by text in the name or city. At most 100 rows; a location filter returns locations only, a company filter returns companies only, no filter returns both.
      Use it for the required contact elements of a plain-language notice (where to call, where to write, office address). TTY or relay numbers, website URLs and hours are not stored in these tables: report them as 'not found in the source' rather than inventing them. This is organisational data with no personal information.
      Underlying Tables: PS_LOCATION_TBL, PS_COMPANY_TBL.
      Security Context: HCM setup data; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: setid
      type: string
      description: Location SetID. Empty = any.
    - name: location
      type: string
      description: Location code. Empty = any.
    - name: company
      type: string
      description: Company code. Empty = any.
    - name: keyword
      type: string
      description: Text to find in the description or city (case-insensitive). Empty
        = no text filter.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :setid AS setid,
                      :location AS location,
                      :company AS company,
                      :keyword AS keyword
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      'LOCATION' AS entity_type,
                      l.setid,
                      l.location AS code,
                      l.descr AS name,
                      l.address1,
                      l.address2,
                      l.city,
                      l.state,
                      l.postal,
                      l.country,
                      l.phone,
                      l.extension,
                      l.fax,
                      l.eff_status
                  FROM params p
                  JOIN sysadm.ps_location_tbl l
                      ON (p.company IS NULL)
                     AND (p.setid IS NULL OR l.setid = p.setid)
                     AND (p.location IS NULL OR l.location = p.location)
                     AND (p.keyword IS NULL OR UPPER(l.descr) LIKE '%' || UPPER(p.keyword) || '%'
                          OR UPPER(l.city) LIKE '%' || UPPER(p.keyword) || '%')
                     AND l.effdt = (SELECT MAX(l2.effdt) FROM sysadm.ps_location_tbl l2
                                     WHERE l2.setid = l.setid AND l2.location = l.location AND l2.effdt <= TRUNC(SYSDATE))
                  UNION ALL
                  SELECT
                      'COMPANY' AS entity_type,
                      CAST(NULL AS VARCHAR2(5)) AS setid,
                      c.company AS code,
                      c.descr AS name,
                      c.address1,
                      c.address2,
                      c.city,
                      c.state,
                      c.postal,
                      c.country,
                      CAST(NULL AS VARCHAR2(24)) AS phone,
                      CAST(NULL AS VARCHAR2(6)) AS extension,
                      CAST(NULL AS VARCHAR2(24)) AS fax,
                      c.eff_status
                  FROM params p
                  JOIN sysadm.ps_company_tbl c
                      ON (p.setid IS NULL AND p.location IS NULL)
                     AND (p.company IS NULL OR c.company = p.company)
                     AND (p.keyword IS NULL OR UPPER(c.descr) LIKE '%' || UPPER(p.keyword) || '%'
                          OR UPPER(c.city) LIKE '%' || UPPER(p.keyword) || '%')
                     AND c.effdt = (SELECT MAX(c2.effdt) FROM sysadm.ps_company_tbl c2
                                     WHERE c2.company = c.company AND c2.effdt <= TRUNC(SYSDATE))
                  ORDER BY 1, 3
              )
              WHERE ROWNUM <= 100;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_hcm_get_attachment_text:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns the text of a stored attachment, 2,000 bytes at a time, for files that are plain text, HTML, XML or JSON. For every file it returns the source table, size, version, last update and the detected format (PDF, Word or Excel, image, binary or text), so the agent knows what it has. Give the stored file name (attachsysfilename) from ps_hcm_get_person_documents or ps_hcm_search_policy_documents; one row comes back per stored file part and version, at most 10.
      PDF, Word, Excel and image files are NOT decoded: is_text is N and text_chunk is empty. Reading those needs text extraction that this database does not provide (same limit as the EBS equivalent, which needs a DBA-installed function); do not guess their content. When has_more is Y, call again with chunk_start set to chunk_start + chunk_length. A multi-byte character can be cut at a chunk boundary.
      Attachments can hold personal data. The text is returned as stored; masking belongs to the calling skill.
      Underlying Tables: PS_HR_ATT_FILES, PSFILE_ATTDET.
      Security Context: Attachment data; use the PL/SQL wrapper and an authorised user in production.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: attach_sys_filename
      type: string
      description: Stored attachment file name (ATTACHSYSFILENAME), as returned by
        ps_hcm_get_person_documents or ps_hcm_search_policy_documents. Required.
    - name: source
      type: string
      description: PS_HR_ATT_FILES, PSFILE_ATTDET, or empty to look in both.
    - name: chunk_start
      type: string
      description: 1-based byte position to start reading the text from. Empty = 1.
        Use start + chunk_length for the next chunk while has_more is Y.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :attach_sys_filename AS attach_sys_filename,
                      :source AS source,
                      :chunk_start AS chunk_start
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      y.src AS source_table,
                      y.attachsysfilename,
                      y.file_seq,
                      y.version AS file_version,
                      y.file_size AS file_bytes,
                      TO_CHAR(y.lastupddttm, 'YYYY-MM-DD HH24:MI:SS') AS last_updated,
                      y.detected_format,
                      y.is_text,
                      y.start_pos AS chunk_start,
                      CASE WHEN y.is_text = 'Y' THEN LEAST(2000, GREATEST(DBMS_LOB.GETLENGTH(y.file_data) - y.start_pos + 1, 0)) END AS chunk_length,
                      CASE WHEN y.is_text = 'Y' AND y.start_pos + 2000 <= DBMS_LOB.GETLENGTH(y.file_data) THEN 'Y' ELSE 'N' END AS has_more,
                      CASE WHEN y.is_text = 'Y' THEN UTL_RAW.CAST_TO_VARCHAR2(DBMS_LOB.SUBSTR(y.file_data, 2000, y.start_pos)) END AS text_chunk
                  FROM (
                      SELECT
                          z.*,
                          CASE
                              WHEN z.head_hex LIKE '25504446%' THEN 'PDF'
                              WHEN z.head_hex LIKE '504B0304%' THEN 'ZIP/OOXML (docx, xlsx, pptx)'
                              WHEN z.head_hex LIKE 'D0CF11E0%' THEN 'OLE (doc, xls, ppt)'
                              WHEN z.head_hex LIKE '89504E47%' THEN 'PNG image'
                              WHEN z.head_hex LIKE 'FFD8FF%' THEN 'JPEG image'
                              WHEN z.head_hex LIKE '47494638%' THEN 'GIF image'
                              WHEN INSTR(z.head_txt, CHR(0)) > 0 THEN 'BINARY'
                              ELSE 'TEXT'
                          END AS detected_format,
                          CASE
                              WHEN z.head_hex LIKE '25504446%' OR z.head_hex LIKE '504B0304%' OR z.head_hex LIKE 'D0CF11E0%'
                                OR z.head_hex LIKE '89504E47%' OR z.head_hex LIKE 'FFD8FF%' OR z.head_hex LIKE '47494638%'
                                OR INSTR(z.head_txt, CHR(0)) > 0 THEN 'N'
                              ELSE 'Y'
                          END AS is_text
                      FROM (
                          SELECT
                              u.*,
                              GREATEST(NVL(TO_NUMBER(p.chunk_start), 1), 1) AS start_pos,
                              RAWTOHEX(DBMS_LOB.SUBSTR(u.file_data, 8, 1)) AS head_hex,
                              UTL_RAW.CAST_TO_VARCHAR2(DBMS_LOB.SUBSTR(u.file_data, 512, 1)) AS head_txt
                          FROM params p
                          JOIN (
                              SELECT 'PS_HR_ATT_FILES' AS src, f.* FROM sysadm.ps_hr_att_files f
                              UNION ALL
                              SELECT 'PSFILE_ATTDET' AS src, d.* FROM sysadm.psfile_attdet d
                          ) u
                              ON u.attachsysfilename = p.attach_sys_filename
                             AND (p.source IS NULL OR u.src = UPPER(p.source))
                      ) z
                  ) y
                  ORDER BY y.src, y.file_seq, y.version
              )
              WHERE ROWNUM <= 10;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  ps_hcm_plain_language_notice_generator:
  - ps_hcm_get_agency_contact_info
  - ps_hcm_get_attachment_text
