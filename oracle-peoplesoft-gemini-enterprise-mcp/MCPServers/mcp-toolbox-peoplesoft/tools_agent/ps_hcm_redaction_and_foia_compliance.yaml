# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_hcm_get_employee_record_documents:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns one person's HR record as a flat list for public-records review: identity (name and the national ID masked to its last four digits), disciplinary actions, grievances, the latest 12 paychecks (gross and net only), absence history and attachments (title and file name, no content). Each row has a record type, key, date, title, a detail text and up to two amounts. EMPLID is required; at most 300 rows; rows of different types are listed one after another instead of being joined, so nothing is multiplied.
      Use it to assemble what exists for one person before redaction. The full national ID, bank details, address and long-text descriptions are not returned. The FSCM-based tool of the same purpose (which returned the unmasked national ID) is disabled. There is no FOIA skill in google_oracle_skills yet; this toolset is a placeholder until one is delivered.
      Underlying Tables: PS_NAMES, PS_PERS_NID, PS_DISCIPLIN_ACTN, PS_GRIEVANCE, PS_PAY_CHECK, PS_ABSENCE_HIST, PS_GP_ABS_ATTACH, PS_HR_PER_BIOG_ATT, PS_BEN_ATTACH_DTL.
      Security Context: Highly sensitive personal data; use the PL/SQL wrapper and an authorised user in production.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: emplid
      type: string
      description: Employee ID whose record is wanted. Required.
    - name: document_type
      type: string
      description: IDENTITY, DISCIPLINE, GRIEVANCE, PAYCHECK, ABSENCE, ATTACHMENT,
        or empty for all.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :emplid AS emplid,
                      :document_type AS document_type
                  FROM dual
              ),
              nm AS (
                  SELECT n.emplid, n.name_display
                  FROM sysadm.ps_names n
                  WHERE n.name_type = 'PRI'
                    AND n.effdt = (SELECT MAX(n2.effdt) FROM sysadm.ps_names n2
                                    WHERE n2.emplid = n.emplid AND n2.name_type = n.name_type AND n2.effdt <= TRUNC(SYSDATE))
              )
              SELECT * FROM (
                  SELECT
                      'IDENTITY' AS record_type,
                      nm.emplid AS record_key,
                      CAST(NULL AS VARCHAR2(10)) AS record_date,
                      nm.name_display AS title,
                      (SELECT n.national_id_type || ' ending ' || SUBSTR(n.national_id, -4)
                         FROM sysadm.ps_pers_nid n
                        WHERE n.emplid = nm.emplid AND n.primary_nid = 'Y' AND ROWNUM = 1) AS detail,
                      CAST(NULL AS NUMBER) AS amount1,
                      CAST(NULL AS NUMBER) AS amount2
                  FROM params p
                  JOIN nm ON nm.emplid = p.emplid AND (p.document_type IS NULL OR UPPER(p.document_type) = 'IDENTITY')
                  UNION ALL
                  SELECT
                      'DISCIPLINE', d.emplid || '/' || TO_CHAR(d.discipline_dt, 'YYYYMMDD'), TO_CHAR(d.discipline_dt, 'YYYY-MM-DD'),
                      d.disciplinary_type, d.final_resolution, CAST(NULL AS NUMBER), CAST(NULL AS NUMBER)
                  FROM params p
                  JOIN sysadm.ps_disciplin_actn d ON d.emplid = p.emplid AND (p.document_type IS NULL OR UPPER(p.document_type) = 'DISCIPLINE')
                  UNION ALL
                  SELECT
                      'GRIEVANCE', g.grievance_id, TO_CHAR(g.grievance_dt, 'YYYY-MM-DD'),
                      g.grievance_type, g.grievance_status || ' / ' || g.final_resolution, CAST(NULL AS NUMBER), CAST(NULL AS NUMBER)
                  FROM params p
                  JOIN sysadm.ps_grievance g ON g.emplid = p.emplid AND (p.document_type IS NULL OR UPPER(p.document_type) = 'GRIEVANCE')
                  UNION ALL
                  SELECT * FROM (
                      SELECT
                          'PAYCHECK', TO_CHAR(c.paycheck_nbr), TO_CHAR(c.check_dt, 'YYYY-MM-DD'),
                          'Paycheck ' || c.company || '/' || c.paygroup, c.paycheck_status, c.total_gross, c.net_pay
                      FROM params p
                      JOIN sysadm.ps_pay_check c ON c.emplid = p.emplid AND (p.document_type IS NULL OR UPPER(p.document_type) = 'PAYCHECK')
                      ORDER BY c.check_dt DESC
                  ) WHERE ROWNUM <= 12
                  UNION ALL
                  SELECT
                      'ABSENCE', TO_CHAR(a.begin_dt, 'YYYYMMDD') || '/' || a.absence_type, TO_CHAR(a.begin_dt, 'YYYY-MM-DD'),
                      a.absence_type || ' ' || a.absence_code, a.paid_unpaid, a.duration_days, a.duration_hours
                  FROM params p
                  JOIN sysadm.ps_absence_hist a ON a.emplid = p.emplid AND (p.document_type IS NULL OR UPPER(p.document_type) = 'ABSENCE')
                  UNION ALL
                  SELECT
                      'ATTACHMENT', att.source_record || '/' || att.attachsysfilename, TO_CHAR(att.created_dttm, 'YYYY-MM-DD'),
                      att.hr_att_subject, att.attachuserfile, CAST(NULL AS NUMBER), CAST(NULL AS NUMBER)
                  FROM params p
                  JOIN (
                      SELECT 'GP_ABS_ATTACH' AS source_record, emplid, hr_att_subject, attachuserfile, attachsysfilename, created_dttm FROM sysadm.ps_gp_abs_attach
                      UNION ALL
                      SELECT 'HR_PER_BIOG_ATT', emplid, hr_att_subject, attachuserfile, attachsysfilename, created_dttm FROM sysadm.ps_hr_per_biog_att
                      UNION ALL
                      SELECT 'BEN_ATTACH_DTL', emplid, hr_att_subject, attachuserfile, attachsysfilename, created_dttm FROM sysadm.ps_ben_attach_dtl
                  ) att ON att.emplid = p.emplid AND (p.document_type IS NULL OR UPPER(p.document_type) = 'ATTACHMENT')
                  ORDER BY 1, 3 DESC NULLS LAST
              )
              WHERE ROWNUM <= 300;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_hcm_search_foia_records:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Searches the HR and vendor records that could be requested under public-records (FOIA) rules and returns where they are, not what they say: category, reference ID, party name, a title and a date. Categories: personnel records (by name or EMPLID), disciplinary actions, grievances, training records and vendor records. At most 100 rows. At least a keyword or a category is required so that a broad dump is not returned; person records carry no date, so they are left out when a date range is given.
      Use it to locate candidate records for a request; fetch the content of one person's record with ps_hcm_get_employee_record_documents. Purchase orders and vouchers are not in this database. There is no FOIA skill in google_oracle_skills yet, so this toolset is a placeholder until one is delivered.
      Underlying Tables: PS_NAMES, PS_DISCIPLIN_ACTN, PS_GRIEVANCE, PS_TRAINING, PS_VENDOR.
      Security Context: Personal data; use the PL/SQL wrapper and an authorised user in production.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: search_keyword
      type: string
      description: Name, ID or title text to find (case-insensitive). Empty = no text
        filter, but then a category is required.
    - name: category
      type: string
      description: PERSON, DISCIPLINE, GRIEVANCE, TRAINING, VENDOR, or ALL. Empty
        = all, but then a keyword is required.
    - name: start_date
      type: string
      description: Earliest record date (YYYY-MM-DD). Empty = no lower bound; person
        records have no date and are left out when a date is given.
    - name: end_date
      type: string
      description: Latest record date (YYYY-MM-DD). Empty = no upper bound.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :search_keyword AS search_keyword,
                      :category AS category,
                      :start_date AS start_date,
                      :end_date AS end_date
                  FROM dual
              ),
              nm AS (
                  SELECT n.emplid, n.name_display
                  FROM sysadm.ps_names n
                  WHERE n.name_type = 'PRI'
                    AND n.effdt = (SELECT MAX(n2.effdt) FROM sysadm.ps_names n2
                                    WHERE n2.emplid = n.emplid AND n2.name_type = n.name_type AND n2.effdt <= TRUNC(SYSDATE))
              )
              SELECT * FROM (
                  SELECT
                      'PERSON' AS record_category,
                      nm.emplid AS reference_id,
                      nm.name_display AS party_name,
                      'Personnel record' AS record_title,
                      CAST(NULL AS VARCHAR2(10)) AS record_date
                  FROM params p
                  JOIN nm
                      ON (p.search_keyword IS NOT NULL OR p.category IS NOT NULL)
                     AND (p.category IS NULL OR UPPER(p.category) IN ('PERSON', 'ALL'))
                     AND p.start_date IS NULL AND p.end_date IS NULL
                     AND (p.search_keyword IS NULL OR nm.emplid = p.search_keyword
                          OR UPPER(nm.name_display) LIKE '%' || UPPER(p.search_keyword) || '%')
                  UNION ALL
                  SELECT
                      'DISCIPLINE',
                      d.emplid || '/' || TO_CHAR(d.discipline_dt, 'YYYYMMDD'),
                      nm.name_display,
                      'Disciplinary action: ' || d.disciplinary_type,
                      TO_CHAR(d.discipline_dt, 'YYYY-MM-DD')
                  FROM params p
                  JOIN sysadm.ps_disciplin_actn d
                      ON (p.search_keyword IS NOT NULL OR p.category IS NOT NULL)
                     AND (p.category IS NULL OR UPPER(p.category) IN ('DISCIPLINE', 'ALL'))
                     AND (p.start_date IS NULL OR d.discipline_dt >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR d.discipline_dt <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  LEFT JOIN nm ON nm.emplid = d.emplid
                  WHERE p.search_keyword IS NULL OR d.emplid = p.search_keyword
                     OR UPPER(nm.name_display) LIKE '%' || UPPER(p.search_keyword) || '%'
                     OR UPPER(d.disciplinary_type) LIKE '%' || UPPER(p.search_keyword) || '%'
                  UNION ALL
                  SELECT
                      'GRIEVANCE',
                      g.grievance_id,
                      nm.name_display,
                      'Grievance: ' || g.grievance_type,
                      TO_CHAR(g.grievance_dt, 'YYYY-MM-DD')
                  FROM params p
                  JOIN sysadm.ps_grievance g
                      ON (p.search_keyword IS NOT NULL OR p.category IS NOT NULL)
                     AND (p.category IS NULL OR UPPER(p.category) IN ('GRIEVANCE', 'ALL'))
                     AND (p.start_date IS NULL OR g.grievance_dt >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR g.grievance_dt <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  LEFT JOIN nm ON nm.emplid = g.emplid
                  WHERE p.search_keyword IS NULL OR g.grievance_id = p.search_keyword OR g.emplid = p.search_keyword
                     OR UPPER(nm.name_display) LIKE '%' || UPPER(p.search_keyword) || '%'
                     OR UPPER(g.grievance_type) LIKE '%' || UPPER(p.search_keyword) || '%'
                  UNION ALL
                  SELECT
                      'TRAINING',
                      tr.emplid || '/' || tr.course || '/' || TO_CHAR(tr.course_start_dt, 'YYYYMMDD'),
                      nm.name_display,
                      'Training: ' || tr.course_title,
                      TO_CHAR(tr.course_start_dt, 'YYYY-MM-DD')
                  FROM params p
                  JOIN sysadm.ps_training tr
                      ON (p.search_keyword IS NOT NULL OR p.category IS NOT NULL)
                     AND (p.category IS NULL OR UPPER(p.category) IN ('TRAINING', 'ALL'))
                     AND (p.start_date IS NULL OR tr.course_start_dt >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR tr.course_start_dt <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  LEFT JOIN nm ON nm.emplid = tr.emplid
                  WHERE p.search_keyword IS NULL OR tr.emplid = p.search_keyword
                     OR UPPER(nm.name_display) LIKE '%' || UPPER(p.search_keyword) || '%'
                     OR UPPER(tr.course_title) LIKE '%' || UPPER(p.search_keyword) || '%'
                  UNION ALL
                  SELECT
                      'VENDOR',
                      v.setid || '/' || v.vendor_id,
                      v.name1,
                      'Vendor record',
                      TO_CHAR(v.last_activity_dt, 'YYYY-MM-DD')
                  FROM params p
                  JOIN sysadm.ps_vendor v
                      ON (p.search_keyword IS NOT NULL OR p.category IS NOT NULL)
                     AND (p.category IS NULL OR UPPER(p.category) IN ('VENDOR', 'ALL'))
                     AND (p.start_date IS NULL OR v.last_activity_dt >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR v.last_activity_dt <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                     AND (p.search_keyword IS NULL OR v.vendor_id = p.search_keyword
                          OR UPPER(v.name1) LIKE '%' || UPPER(p.search_keyword) || '%')
                  ORDER BY 5 DESC NULLS LAST, 3
              )
              WHERE ROWNUM <= 100;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  ps_hcm_redaction_and_foia_compliance:
  - ps_hcm_get_employee_record_documents
  - ps_hcm_search_foia_records
