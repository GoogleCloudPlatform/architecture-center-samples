# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_list_business_units:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Lists valid PeopleSoft General Ledger and HCM Business Units from PS_BUS_UNIT_TBL_FS and PS_BUS_UNIT_TBL_HR.
      Use this tool to discover valid values for the :business_unit bind variable across Strategic Sourcing, Voucher, and AP tools.
      Underlying Tables: PS_BUS_UNIT_TBL_FS, PS_BUS_UNIT_TBL_HR.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: bu_type
      type: string
      description: 'Optional business unit family filter: ''FS'' for Financials/SCM,
        ''HR'' for HCM, or ''ALL''.'
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :bu_type AS bu_type FROM dual
              )
              SELECT * FROM (
                  SELECT
                      fs.business_unit,
                      fs.descr AS unit_description,
                      'FSCM' AS bu_family
                  FROM sysadm.ps_bus_unit_tbl_fs fs, params p
                  WHERE (p.bu_type IS NULL OR UPPER(p.bu_type) IN ('FS', 'ALL'))
                  UNION ALL
                  SELECT
                      hr.business_unit,
                      hr.descr AS unit_description,
                      'HCM' AS bu_family
                  FROM sysadm.ps_bus_unit_tbl_hr hr, params p
                  WHERE (p.bu_type IS NULL OR UPPER(p.bu_type) IN ('HR', 'ALL'))
              )
              ORDER BY business_unit
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_list_setids:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Lists valid PeopleSoft SetIDs from PS_SETID_TBL.
      Use this tool to discover valid values for the :setid bind variable used in policy catalog and prompt table queries.
      Underlying Table: PS_SETID_TBL.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: search_pattern
      type: string
      description: Optional search pattern to filter SetID code or description (e.g.
        '%SHARE%' or '%USA%').
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT :search_pattern AS search_pattern FROM dual
              )
              SELECT
                  st.setid,
                  st.descr AS setid_description
              FROM sysadm.ps_setid_tbl st, params p
              WHERE (p.search_pattern IS NULL OR UPPER(st.setid) LIKE UPPER(p.search_pattern) OR UPPER(st.descr) LIKE UPPER(p.search_pattern))
              ORDER BY st.setid
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_list_translate_values:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Queries the PeopleSoft Translate Table (PSXLATITEM) for valid field values.
      Use this tool to discover valid codes for categorical bind variables like :document_type, :category, and status codes.
      Underlying Table: PSXLATITEM.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: fieldname
      type: string
      description: Field name in PeopleSoft data dictionary (e.g. 'CATEGORY', 'ACTION',
        'STATUS', 'POLICY_CODE').
    - name: search_keyword
      type: string
      description: Optional keyword to filter display name or description.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :fieldname AS fieldname,
                      :search_keyword AS search_keyword
                  FROM dual
              )
              SELECT
                  x.fieldname,
                  x.fieldvalue,
                  x.xlatlongname,
                  x.xlatshortname,
                  x.eff_status
              FROM sysadm.psxlatitem x, params p
              WHERE x.fieldname = UPPER(p.fieldname)
                AND x.eff_status = 'A'
                AND (p.search_keyword IS NULL OR UPPER(x.xlatlongname) LIKE UPPER('%' || p.search_keyword || '%'))
              ORDER BY x.fieldvalue
              FETCH FIRST 50 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_lookup_constituents:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Searches PeopleSoft HCM and Campus directory for constituents, students, or employees by name or postal code.
      Use this tool to discover valid values for constituent bind variable :emplid before invoking case determination, personnel, or verification tools.
      Underlying Tables: PS_NAMES, PS_PERSONAL_DATA, PS_ADDRESSES.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: search_name
      type: string
      description: Full or partial constituent or employee name (e.g. 'Smith' or 'Jane').
    - name: postal_code
      type: string
      description: Optional 5-digit postal code or ZIP code.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :search_name AS search_name,
                      :postal_code AS postal_code
                  FROM dual
              )
              SELECT
                  nm.emplid,
                  nm.name_display,
                  TO_CHAR(pd.birthdate, 'YYYY-MM-DD') AS birthdate,
                  addr.city,
                  addr.state,
                  addr.postal
              FROM sysadm.ps_names nm
              JOIN sysadm.ps_personal_data pd ON nm.emplid = pd.emplid
              LEFT JOIN sysadm.ps_addresses addr ON nm.emplid = addr.emplid AND addr.address_type = 'HOME',
              params p
              WHERE nm.name_type = 'PRI'
                AND (UPPER(nm.name_display) LIKE UPPER('%' || p.search_name || '%'))
                AND (p.postal_code IS NULL OR addr.postal LIKE p.postal_code || '%')
              ORDER BY nm.name_display
              FETCH FIRST 25 ROWS ONLY;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  schema_discovery_and_lovs:
  - ps_list_business_units
  - ps_list_setids
  - ps_list_translate_values
  - ps_lookup_constituents
