# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_hcm_find_duplicate_time_entries:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Finds possible duplicate billing of labor to projects: groups of payable time entries for the same employee, work date, time reporting code, quantity, project and fund that appear more than once. Returns the group, how many entries it holds, their sequence numbers, the estimated gross for the group and the payable statuses involved, largest groups first, at most 200 groups.
      Use it for the duplicate-billing test of the expense auditor skill, on labor charged to projects. Only entries that count as payable (status Approved, Closed, Sent to Payroll, Taken by Payroll or Distributed) are compared, so diluted, ignored, denied and rejected entries do not create false groups. A group is still a lead, not proof: a legitimate second shift looks the same, so check the sequence numbers and payable_statuses.
      Underlying Tables: PS_TL_PAYABLE_TIME.
      Security Context: HCM Time and Labor; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: project_id
      type: string
      description: Project ID to check. Empty = all projects.
    - name: start_date
      type: string
      description: First work date (YYYY-MM-DD). Empty = no lower bound.
    - name: end_date
      type: string
      description: Last work date (YYYY-MM-DD). Empty = no upper bound.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :project_id AS project_id,
                      :start_date AS start_date,
                      :end_date AS end_date
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      t.emplid,
                      TO_CHAR(t.dur, 'YYYY-MM-DD') AS work_date,
                      t.trc AS time_reporting_code,
                      t.tl_quantity AS hours_or_quantity,
                      TRIM(t.project_id) AS project_id,
                      TRIM(t.fund_code) AS fund_code,
                      COUNT(*) AS entry_count,
                      COUNT(DISTINCT t.seq_nbr) AS distinct_sequences,
                      MIN(t.seq_nbr) AS first_seq_nbr,
                      MAX(t.seq_nbr) AS last_seq_nbr,
                      SUM(t.est_gross) AS total_estimated_gross,
                      LISTAGG(DISTINCT t.payable_status, ',') WITHIN GROUP (ORDER BY t.payable_status) AS payable_statuses
                  FROM params p
                  JOIN sysadm.ps_tl_payable_time t
                      ON TRIM(t.project_id) IS NOT NULL
                     AND t.payable_status IN ('AP', 'CL', 'SP', 'TP', 'PD')
                     AND (p.project_id IS NULL OR t.project_id = p.project_id)
                     AND (p.start_date IS NULL OR t.dur >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR t.dur <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  GROUP BY t.emplid, t.dur, t.trc, t.tl_quantity, TRIM(t.project_id), TRIM(t.fund_code)
                  HAVING COUNT(*) > 1
                  ORDER BY COUNT(*) DESC, SUM(t.est_gross) DESC
              )
              WHERE ROWNUM <= 200;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_hcm_get_labor_distribution:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns payable time (Time and Labor) that is charged to a project, with the chartfields it carries: project, activity, fund, account, program and department. This is the HCM-side labor cost evidence for grant and project audits (2 CFR 200.430 effort and compensation). One row per payable time entry, newest first, at most 200 rows. Only entries with a project are returned. The project's business unit is blank on many entries, so the project description is often empty even when the project exists; look it up with ps_hcm_get_project_setup.
      Use it to test allocability (is the time charged to the right project and fund?), to look at one employee or project over a date window, and to see payable status (approved, sent to payroll, deleted). Combine with ps_hcm_find_duplicate_time_entries for duplicate billing and ps_hcm_get_project_setup for project terms.
      Contains employee IDs but no names. Reported (punch) time is not included; this is payable time.
      Underlying Tables: PS_TL_PAYABLE_TIME, PS_PROJECT.
      Security Context: HCM Time and Labor; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: emplid
      type: string
      description: Employee ID. Empty = any.
    - name: project_id
      type: string
      description: Project ID that the time is charged to. Empty = any project.
    - name: business_unit_pc
      type: string
      description: Project Costing business unit of the project. Empty = any.
    - name: start_date
      type: string
      description: First work date (YYYY-MM-DD). Empty = no lower bound.
    - name: end_date
      type: string
      description: Last work date (YYYY-MM-DD). Empty = no upper bound.
    - name: payable_status
      type: string
      description: Time and Labor payable status code (see ps_list_translate_values,
        field PAYABLE_STATUS). Empty = any.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :emplid AS emplid,
                      :project_id AS project_id,
                      :business_unit_pc AS business_unit_pc,
                      :start_date AS start_date,
                      :end_date AS end_date,
                      :payable_status AS payable_status
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      t.emplid,
                      t.empl_rcd,
                      TO_CHAR(t.dur, 'YYYY-MM-DD') AS work_date,
                      t.seq_nbr,
                      t.trc AS time_reporting_code,
                      t.tl_quantity AS hours_or_quantity,
                      t.payable_status,
                      t.est_gross AS estimated_gross,
                      t.lbr_dist_amt AS labor_distribution_amount,
                      TRIM(t.business_unit_pc) AS project_business_unit,
                      TRIM(t.project_id) AS project_id,
                      pr.descr AS project_description,
                      TRIM(t.activity_id) AS activity_id,
                      TRIM(t.fund_code) AS fund_code,
                      TRIM(t.account) AS account,
                      TRIM(t.acct_cd) AS account_code,
                      TRIM(t.program_code) AS program_code,
                      t.deptid,
                      t.jobcode,
                      t.company,
                      t.billable_ind,
                      t.oprid AS entered_by,
                      TO_CHAR(t.lastupddttm, 'YYYY-MM-DD HH24:MI:SS') AS last_updated
                  FROM params p
                  JOIN sysadm.ps_tl_payable_time t
                      ON TRIM(t.project_id) IS NOT NULL
                     AND (p.emplid IS NULL OR t.emplid = p.emplid)
                     AND (p.project_id IS NULL OR t.project_id = p.project_id)
                     AND (p.business_unit_pc IS NULL OR t.business_unit_pc = p.business_unit_pc)
                     AND (p.start_date IS NULL OR t.dur >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR t.dur <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                     AND (p.payable_status IS NULL OR t.payable_status = p.payable_status)
                  LEFT JOIN sysadm.ps_project pr
                      ON pr.business_unit = t.business_unit_pc
                     AND pr.project_id = t.project_id
                  ORDER BY t.dur DESC, t.emplid, t.seq_nbr
              )
              WHERE ROWNUM <= 200;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_hcm_get_payroll_earnings:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns paychecks with their earnings rolled up: one row per paycheck with gross, taxes, deductions and net pay, regular and overtime hours and earnings (regular includes hourly and salary amounts), other earnings with their earnings codes, and gross_minus_earnings (paycheck gross less the sum of the earnings lines; a non-zero value means the ledger does not tie). Newest first, at most 200 paychecks.
      Use it to test the compensation side of a grant or project audit (2 CFR 200.430): that payroll for a person and period is consistent and reasonable, and to find off-cycle checks. It does not contain the person's name, address, bank details or national ID.
      Rolled-up earnings, department and account-code counts avoid the row multiplication that listing every earnings line would cause. For project-level charging see ps_hcm_get_labor_distribution.
      Underlying Tables: PS_PAY_CHECK, PS_PAY_EARNINGS, PS_PAY_OTH_EARNS.
      Security Context: Payroll data; use the PL/SQL wrapper and an authorised user in production.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: emplid
      type: string
      description: Employee ID. Empty = any.
    - name: company
      type: string
      description: Company code. Empty = any.
    - name: start_date
      type: string
      description: Earliest pay period end date (YYYY-MM-DD). Empty = no lower bound.
    - name: end_date
      type: string
      description: Latest pay period end date (YYYY-MM-DD). Empty = no upper bound.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :emplid AS emplid,
                      :company AS company,
                      :start_date AS start_date,
                      :end_date AS end_date
                  FROM dual
              ),
              ern AS (
                  SELECT
                      e.company, e.paygroup, e.pay_end_dt, e.off_cycle, e.page_num, e.line_num, e.sepchk,
                      COUNT(*) AS earnings_lines,
                      SUM(e.reg_hrs) AS regular_hours,
                      SUM(e.ot_hrs) AS overtime_hours,
                      SUM(NVL(e.reg_earns, 0) + NVL(e.reg_pay, 0) + NVL(e.reg_hrly_earns, 0)) AS regular_earnings,
                      SUM(e.ot_hrly_earns) AS overtime_earnings,
                      COUNT(DISTINCT e.deptid) AS department_count,
                      COUNT(DISTINCT TRIM(e.acct_cd)) AS account_code_count
                  FROM params p
                  JOIN sysadm.ps_pay_earnings e
                      ON (p.emplid IS NULL OR e.emplid = p.emplid)
                     AND (p.company IS NULL OR e.company = p.company)
                     AND (p.start_date IS NULL OR e.pay_end_dt >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR e.pay_end_dt <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  GROUP BY e.company, e.paygroup, e.pay_end_dt, e.off_cycle, e.page_num, e.line_num, e.sepchk
              ),
              oth AS (
                  SELECT
                      o.company, o.paygroup, o.pay_end_dt, o.off_cycle, o.page_num, o.line_num, o.sepchk,
                      SUM(o.oth_earns) AS other_earnings,
                      SUM(o.oth_hrs) AS other_hours,
                      LISTAGG(DISTINCT o.erncd, ',') WITHIN GROUP (ORDER BY o.erncd) AS other_earnings_codes
                  FROM params p
                  JOIN sysadm.ps_pay_oth_earns o
                      ON (p.company IS NULL OR o.company = p.company)
                     AND (p.start_date IS NULL OR o.pay_end_dt >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR o.pay_end_dt <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  GROUP BY o.company, o.paygroup, o.pay_end_dt, o.off_cycle, o.page_num, o.line_num, o.sepchk
              )
              SELECT * FROM (
                  SELECT
                      c.emplid,
                      c.company,
                      c.paygroup,
                      TO_CHAR(c.pay_end_dt, 'YYYY-MM-DD') AS pay_period_end,
                      TO_CHAR(c.check_dt, 'YYYY-MM-DD') AS check_date,
                      c.paycheck_nbr,
                      c.off_cycle,
                      c.paycheck_status,
                      c.deptid,
                      c.total_gross,
                      c.total_taxes,
                      c.total_deductions,
                      c.net_pay,
                      e.earnings_lines,
                      e.regular_hours,
                      e.overtime_hours,
                      e.regular_earnings,
                      e.overtime_earnings,
                      o.other_earnings,
                      o.other_earnings_codes,
                      e.department_count,
                      e.account_code_count,
                      c.total_gross - (NVL(e.regular_earnings, 0) + NVL(e.overtime_earnings, 0) + NVL(o.other_earnings, 0)) AS gross_minus_earnings
                  FROM params p
                  JOIN sysadm.ps_pay_check c
                      ON (p.emplid IS NULL OR c.emplid = p.emplid)
                     AND (p.company IS NULL OR c.company = p.company)
                     AND (p.start_date IS NULL OR c.pay_end_dt >= TO_DATE(p.start_date, 'YYYY-MM-DD'))
                     AND (p.end_date IS NULL OR c.pay_end_dt <= TO_DATE(p.end_date, 'YYYY-MM-DD'))
                  LEFT JOIN ern e
                      ON e.company = c.company AND e.paygroup = c.paygroup AND e.pay_end_dt = c.pay_end_dt
                     AND e.off_cycle = c.off_cycle AND e.page_num = c.page_num AND e.line_num = c.line_num AND e.sepchk = c.sepchk
                  LEFT JOIN oth o
                      ON o.company = c.company AND o.paygroup = c.paygroup AND o.pay_end_dt = c.pay_end_dt
                     AND o.off_cycle = c.off_cycle AND o.page_num = c.page_num AND o.line_num = c.line_num AND o.sepchk = c.sepchk
                  ORDER BY c.check_dt DESC, c.emplid
              )
              WHERE ROWNUM <= 200;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_hcm_get_project_setup:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns Project Costing project definitions: description, type, function, status, in-use flag, start and end dates, currency, percent complete, docket number, source and the size and roles of the project team. At most 100 projects.
      This is the HCM database's nearest equivalent of award terms for the expense auditor skill. It is project setup only: sponsor, funding stream, award budget, period of performance and allowable-cost terms are not in this database (Grants and Contracts are not installed), and start and end dates are blank on almost all projects. Report those items as 'not available' rather than guessing.
      Use it to confirm that a project exists, is active and has a team before testing time charged to it with ps_hcm_get_labor_distribution.
      Underlying Tables: PS_PROJECT, PS_PROJECT_TEAM.
      Security Context: Project Costing business unit security; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: business_unit
      type: string
      description: Project Costing business unit. Empty = any.
    - name: project_id
      type: string
      description: Project ID. Empty = any.
    - name: keyword
      type: string
      description: Text to find in the project ID or description (case-insensitive).
        Empty = no text filter.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :business_unit AS business_unit,
                      :project_id AS project_id,
                      :keyword AS keyword
                  FROM dual
              ),
              team AS (
                  SELECT
                      tm.business_unit, tm.project_id,
                      COUNT(*) AS team_member_count,
                      LISTAGG(DISTINCT tm.proj_role, ',') WITHIN GROUP (ORDER BY tm.proj_role) AS team_roles
                  FROM sysadm.ps_project_team tm
                  GROUP BY tm.business_unit, tm.project_id
              )
              SELECT * FROM (
                  SELECT
                      pr.business_unit,
                      pr.project_id,
                      pr.descr AS project_description,
                      pr.eff_status,
                      pr.project_type,
                      pr.project_function,
                      pr.in_use_sw AS in_use,
                      TO_CHAR(pr.start_dt, 'YYYY-MM-DD') AS start_date,
                      TO_CHAR(pr.end_dt, 'YYYY-MM-DD') AS end_date,
                      pr.currency_cd,
                      pr.percent_complete,
                      pr.docket_number,
                      pr.system_source,
                      pr.template_sw AS is_template,
                      pr.summary_sw AS is_summary,
                      NVL(tm.team_member_count, 0) AS team_member_count,
                      tm.team_roles
                  FROM params p
                  JOIN sysadm.ps_project pr
                      ON (p.business_unit IS NULL OR pr.business_unit = p.business_unit)
                     AND (p.project_id IS NULL OR pr.project_id = p.project_id)
                     AND (p.keyword IS NULL
                          OR UPPER(pr.project_id) LIKE '%' || UPPER(p.keyword) || '%'
                          OR UPPER(pr.descr) LIKE '%' || UPPER(p.keyword) || '%')
                  LEFT JOIN team tm
                      ON tm.business_unit = pr.business_unit
                     AND tm.project_id = pr.project_id
                  ORDER BY pr.business_unit, pr.project_id
              )
              WHERE ROWNUM <= 100;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  ps_hcm_expense_auditor:
  - ps_hcm_find_duplicate_time_entries
  - ps_hcm_get_labor_distribution
  - ps_hcm_get_payroll_earnings
  - ps_hcm_get_project_setup
