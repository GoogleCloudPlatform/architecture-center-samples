# Generated by scripts/sync_sql_to_yaml.py from <system>/sql/*.sql: do not edit by hand.
# Sources and authentication are in source.yaml; the Toolbox merges the files of this folder.

tools:
  ps_hcm_get_earnings_rules:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns payroll earnings code rules in force on a date: payment type, maximum hourly rate, flat amount, year-to-date maximum, rate multiplier (for example overtime factors), tax subjectivity and FLSA treatment. One row per earnings code, from the latest effective-dated row on or before as_of_date (default today). At most 100 codes.
      Use it as the agency's own rule source when the policy skill, or an audit, needs the limit or treatment behind a pay type (overtime, shift differential, caps). The earnings codes seen on paychecks come from ps_hcm_get_payroll_earnings (other_earnings_codes).
      Underlying Tables: PS_EARNINGS_TBL.
      Security Context: HCM setup data; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: as_of_date
      type: string
      description: Date the rules must be in force on (YYYY-MM-DD). Empty = today.
    - name: erncd
      type: string
      description: Earnings code. Empty = any.
    - name: keyword
      type: string
      description: Text to find in the earnings code description (case-insensitive).
        Empty = no text filter.
    - name: active_only
      type: string
      description: Y = only active codes, N or empty = include inactive.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :as_of_date AS as_of_date,
                      :erncd AS erncd,
                      :keyword AS keyword,
                      :active_only AS active_only
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      e.erncd AS earnings_code,
                      e.descr AS description,
                      e.eff_status,
                      TO_CHAR(e.effdt, 'YYYY-MM-DD') AS effective_date,
                      NVL(p.as_of_date, TO_CHAR(TRUNC(SYSDATE), 'YYYY-MM-DD')) AS as_of_date,
                      e.payment_type,
                      e.amt_or_hours,
                      e.hrly_rt_maximum AS hourly_rate_maximum,
                      e.earn_flat_amt AS flat_amount,
                      e.earn_ytd_max AS year_to_date_maximum,
                      e.factor_mult AS rate_multiplier,
                      e.add_gross AS adds_to_gross,
                      e.subject_fwt AS subject_to_federal_tax,
                      e.subject_fica AS subject_to_fica,
                      e.effect_on_flsa,
                      e.flsa_category,
                      e.shift_diff_elig AS shift_differential_eligible
                  FROM params p
                  JOIN sysadm.ps_earnings_tbl e
                      ON (p.erncd IS NULL OR e.erncd = p.erncd)
                     AND (p.keyword IS NULL OR UPPER(e.descr) LIKE '%' || UPPER(p.keyword) || '%')
                     AND (p.active_only IS NULL OR UPPER(p.active_only) <> 'Y' OR e.eff_status = 'A')
                     AND e.effdt = (SELECT MAX(e2.effdt) FROM sysadm.ps_earnings_tbl e2
                                     WHERE e2.erncd = e.erncd
                                       AND e2.effdt <= NVL(TO_DATE(p.as_of_date, 'YYYY-MM-DD'), TRUNC(SYSDATE)))
                  ORDER BY e.erncd
              )
              WHERE ROWNUM <= 100;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_hcm_get_leave_policy_rules:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Returns the leave plan rules in force on a date: accrual frequency, maximum balance and carryover, payout at termination, whether the balance may go negative. One row per leave plan, using the latest effective-dated row on or before as_of_date (default today); rows that started after the date, and earlier versions, are not returned. At most 100 plans.
      Use it as the agency's own written rule source for the policy skill when a question concerns leave limits, with as_of_date driving the retrieval so a past period is answered with the rules that applied then. The statute and regulation tiers (federal and state law) are not in PeopleSoft.
      Plan descriptions are not stored in this table; use ps_list_translate_values for code meanings where they exist.
      Underlying Tables: PS_LEAVE_PLAN_TBL.
      Security Context: HCM setup data; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: as_of_date
      type: string
      description: Date the rules must be in force on (YYYY-MM-DD). Empty = today.
    - name: plan_type
      type: string
      description: Leave plan type code (for example 50, 51, 52). Empty = any.
    - name: benefit_plan
      type: string
      description: Leave benefit plan code. Empty = any.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :as_of_date AS as_of_date,
                      :plan_type AS plan_type,
                      :benefit_plan AS benefit_plan
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      lp.plan_type,
                      lp.benefit_plan,
                      TO_CHAR(lp.effdt, 'YYYY-MM-DD') AS effective_date,
                      NVL(p.as_of_date, TO_CHAR(TRUNC(SYSDATE), 'YYYY-MM-DD')) AS as_of_date,
                      lp.accrual_frequency,
                      lp.service_interval,
                      lp.year_begin_calc,
                      lp.maximum_leave_bal AS maximum_leave_balance,
                      lp.maximum_carryover,
                      lp.pay_at_termination,
                      lp.pay_term_pct AS pay_at_termination_pct,
                      lp.pay_vs_leave,
                      lp.hrs_go_negative AS may_go_negative,
                      lp.max_neg_hrs AS maximum_negative_hours,
                      lp.balance_visible
                  FROM params p
                  JOIN sysadm.ps_leave_plan_tbl lp
                      ON (p.plan_type IS NULL OR lp.plan_type = p.plan_type)
                     AND (p.benefit_plan IS NULL OR lp.benefit_plan = p.benefit_plan)
                     AND lp.effdt = (SELECT MAX(lp2.effdt) FROM sysadm.ps_leave_plan_tbl lp2
                                      WHERE lp2.plan_type = lp.plan_type AND lp2.benefit_plan = lp.benefit_plan
                                        AND lp2.effdt <= NVL(TO_DATE(p.as_of_date, 'YYYY-MM-DD'), TRUNC(SYSDATE)))
                  ORDER BY lp.plan_type, lp.benefit_plan
              )
              WHERE ROWNUM <= 100;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
  ps_hcm_search_policy_documents:
    kind: oracle-sql
    source: ps-oracle-source
    description: |-
      Searches the agency-written procedure text that exists in this HCM database: checklist item instructions (what an HR checklist step requires) and HR attachment configurations (attachment types and their stock documents, with file names). Each entry is the version in force on as_of_date (default today). At most 50 entries, newest effective date first.
      This is not a policy manual library: this database has no portal policy documents, so most agency policy documents cannot be searched here. Use attachsysfilename with ps_hcm_get_attachment_text to read a stock document, if it has one. Federal and state law (the statute and regulation tiers of the policy skill) are not in PeopleSoft.
      Underlying Tables: PS_CHKLST_ITEM_TBL, PS_HR_ATT_CNFG_TBL.
      Security Context: HCM setup data; no row security applies unless the PL/SQL wrapper is on.
    parameters:
    - name: user_id
      type: string
      description: Email of the authenticated user; sets the PeopleSoft security context
        for the query.
      required: true
    - name: search_text
      type: string
      description: Text to find in the title, description or instructions (case-insensitive).
        Empty = no text filter.
    - name: source
      type: string
      description: CHECKLIST_ITEM (checklist item instructions), ATTACHMENT_CONFIG
        (HR attachment types and their stock documents), or empty for both.
    - name: as_of_date
      type: string
      description: Date the entries must be in force on (YYYY-MM-DD). Empty = today.
    statement: |-
      DECLARE
          rc SYS_REFCURSOR;
      BEGIN
          -- 1. Correctly set the user session context
          sysadm.xx_ai_security_pkg.init_user_session(:user_id);

          -- 2. Open the cursor for the PeopleSoft selection query
          OPEN rc FOR
              WITH params AS (
                  SELECT
                      :search_text AS search_text,
                      :source AS source,
                      :as_of_date AS as_of_date
                  FROM dual
              )
              SELECT * FROM (
                  SELECT
                      'CHECKLIST_ITEM' AS source,
                      i.chklst_item_cd AS document_id,
                      i.descr AS title,
                      DBMS_LOB.SUBSTR(i.descrlong, 1000, 1) AS summary,
                      i.eff_status AS status,
                      TO_CHAR(i.effdt, 'YYYY-MM-DD') AS effective_date,
                      CAST(NULL AS VARCHAR2(200)) AS file_name,
                      CAST(NULL AS VARCHAR2(200)) AS attachsysfilename
                  FROM params p
                  JOIN sysadm.ps_chklst_item_tbl i
                      ON (p.source IS NULL OR UPPER(p.source) = 'CHECKLIST_ITEM')
                     AND (p.search_text IS NULL
                          OR UPPER(i.descr) LIKE '%' || UPPER(p.search_text) || '%'
                          OR UPPER(DBMS_LOB.SUBSTR(i.descrlong, 2000, 1)) LIKE '%' || UPPER(p.search_text) || '%')
                     AND i.effdt = (SELECT MAX(i2.effdt) FROM sysadm.ps_chklst_item_tbl i2
                                     WHERE i2.chklst_item_cd = i.chklst_item_cd
                                       AND i2.effdt <= NVL(TO_DATE(p.as_of_date, 'YYYY-MM-DD'), TRUNC(SYSDATE)))
                  UNION ALL
                  SELECT
                      'ATTACHMENT_CONFIG' AS source,
                      c.hr_att_cnfg_id AS document_id,
                      c.descr AS title,
                      DBMS_LOB.SUBSTR(c.comments, 1000, 1) AS summary,
                      c.eff_status AS status,
                      TO_CHAR(c.effdt, 'YYYY-MM-DD') AS effective_date,
                      c.attachuserfile AS file_name,
                      c.attachsysfilename AS attachsysfilename
                  FROM params p
                  JOIN sysadm.ps_hr_att_cnfg_tbl c
                      ON (p.source IS NULL OR UPPER(p.source) = 'ATTACHMENT_CONFIG')
                     AND (p.search_text IS NULL
                          OR UPPER(c.descr) LIKE '%' || UPPER(p.search_text) || '%'
                          OR UPPER(DBMS_LOB.SUBSTR(c.comments, 2000, 1)) LIKE '%' || UPPER(p.search_text) || '%')
                     AND c.effdt = (SELECT MAX(c2.effdt) FROM sysadm.ps_hr_att_cnfg_tbl c2
                                     WHERE c2.hr_att_cnfg_id = c.hr_att_cnfg_id
                                       AND c2.effdt <= NVL(TO_DATE(p.as_of_date, 'YYYY-MM-DD'), TRUNC(SYSDATE)))
                  ORDER BY 6 DESC, 3
              )
              WHERE ROWNUM <= 50;


          -- 3. Implicitly return the cursor back to the database client driver
          DBMS_SQL.RETURN_RESULT(rc);
      END;
toolsets:
  ps_hcm_policy_and_statute_assistant:
  - ps_hcm_get_earnings_rules
  - ps_hcm_get_leave_policy_rules
  - ps_hcm_search_policy_documents
